<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Islamist parties and power: Egypt and Tunisia</title>
<!-- Built by group-session/sim/make_sim.mjs from sim.json and sim_rules.js.
     Everything the page needs is inside this file or in the media folder beside
     it: no fonts, no scripts, and no images from the internet, so the page runs
     the same from the site and from the offline copy. Build cd608542ed64. -->
<style>/* engine.css — the whole look of a simulation page. System fonts only: the page
   must load nothing from the internet, so it also runs from the offline copy. */
:root {
  --bg: #eef0f4; --panel: #ffffff; --panel-2: #f5f7fa; --ink: #131a26; --ink-2: #3a4560;
  --muted: #667089; --rule: #d5dae3; --rule-soft: #e6eaf1; --ui: #2a3c63;
  --good: #00705f; --good-bg: #e2f0ec; --bad: #b8402a; --bad-bg: #f9e7e2;
  --warn: #8a5a08; --warn-bg: #fbf0dc;
  --shadow: 0 1px 2px rgba(19, 26, 38, .06), 0 12px 30px -22px rgba(19, 26, 38, .5);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a0f18; --panel: #131a27; --panel-2: #0e1420; --ink: #e9eef7; --ink-2: #b6c1d6;
    --muted: #8390a8; --rule: #232d43; --rule-soft: #1a2233; --ui: #a8bbe8;
    --good: #2aa189; --good-bg: #0c2e28; --bad: #dd6242; --bad-bg: #361b14;
    --warn: #dfa83e; --warn-bg: #33260f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 12px 30px -22px rgba(0, 0, 0, 1);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
body.staged { overflow: hidden; }
h1 { font-size: clamp(26px, 3.6vw, 40px); line-height: 1.08; letter-spacing: -.02em; margin: 6px 0 12px; }
h2 { font-size: 18px; margin: 22px 0 8px; }
h3 { font-size: 17px; margin: 0 0 4px; }
p { margin: 0 0 12px; }
a { color: var(--ui); }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible {
  outline: 2px solid var(--ui); outline-offset: 2px;
}
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- top bar */
.topbar {
  position: sticky; top: 0; z-index: 40; background: var(--panel);
  border-bottom: 1px solid var(--rule); padding: 10px 20px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.brand { margin-right: auto; display: flex; flex-direction: column; }
.brand .name { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.brand .sub { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tabs { display: flex; gap: 2px; }
.tabs button {
  background: none; border: 1px solid transparent; color: var(--muted); font-size: 13px; padding: 6px 12px;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--rule); background: var(--panel-2); }
.topbar .ghost {
  background: var(--panel-2); border: 1px solid var(--rule); color: var(--ink-2);
  font-size: 12px; padding: 6px 10px;
}
.notice {
  margin: 0; padding: 10px 20px; background: var(--warn-bg); color: var(--warn);
  border-bottom: 1px solid var(--rule); font-size: 14px;
}
.notice.warn { background: var(--warn-bg); color: var(--warn); }

/* ----------------------------------------------------------------- layout */
main, .how { max-width: 1180px; margin: 0 auto; padding: 26px 20px 120px; }
.stagewrap { max-width: 860px; margin: 0 auto; }
.stagewrap.wide { max-width: 1100px; }
.kicker { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0; }
.lede { font-size: 18px; color: var(--ink-2); max-width: 68ch; }
.panel { background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); margin: 18px 0; }
.panel-h {
  padding: 10px 15px; border-bottom: 1px solid var(--rule); font-size: 11px;
  letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  display: flex; justify-content: space-between; gap: 10px;
}
.panel-b { padding: 14px 15px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
.btn {
  background: var(--ui); color: #fff; border: 1px solid var(--ui); padding: 11px 22px;
  font-weight: 600; font-size: 15px;
}
.btn:hover { filter: brightness(1.12); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: none; color: var(--ink-2); border-color: var(--rule); }
.btn.big { padding: 13px 28px; font-size: 16px; }
.tag {
  font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  border: 1px solid var(--rule); color: var(--muted); padding: 1px 7px; margin-right: 6px;
}

/* ------------------------------------------------------------------ brief */
.brief-main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, .55fr); gap: 22px; margin-top: 22px; }
.brief-copy { min-width: 0; }
.memo { background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); padding: 22px 24px; }
.memo-h { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; margin: 0 0 14px;
  padding-bottom: 12px; border-bottom: 2px solid var(--ink); font-size: 13px; }
.memo-h dt { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
.memo-h dd { margin: 0; }
.steps { background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); padding: 18px 22px; margin-top: 18px; }
.steps ol { margin: 0; padding-left: 20px; color: var(--ink-2); }
.steps li { margin-bottom: 6px; }
.deliverable { margin: 14px 0 0; padding: 10px 12px; border-left: 3px solid var(--ui); background: var(--panel-2); font-size: 14px; }
.grade-note { margin: 12px 0 0; padding: 10px 12px; border: 1px solid var(--warn); background: var(--warn-bg); color: var(--ink-2); font-size: 14px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); margin-top: 20px; }
.tiles div { background: var(--panel); padding: 14px 16px; }
.tiles .n { font-size: 24px; font-weight: 700; display: block; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tiles .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: block; margin-top: 3px; }
.tiles .src { font-size: 11px; color: var(--muted); display: block; margin-top: 6px; }
.brief-photos { display: flex; flex-direction: column; gap: 14px; }
.brief-photos figure { margin: 0; border: 1px solid var(--rule); background: var(--panel); box-shadow: var(--shadow); }
.brief-photos img { width: 100%; display: block; }
.brief-photos figcaption { font-size: 11px; color: var(--muted); padding: 6px 8px; }
.startrow { margin-top: 26px; display: grid; gap: 8px; max-width: 640px; }
.startrow label { font-weight: 700; font-size: 14px; }
textarea, input[type="text"] {
  font: inherit; width: 100%; background: var(--panel); color: var(--ink);
  border: 1px solid var(--rule); padding: 10px 12px; resize: vertical;
}
.startrow { background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); padding: 18px 20px; }
.startrow .hint { font-size: 13.5px; color: var(--muted); margin: 0; }
.startrow .namemsg { font-size: 13px; color: var(--muted); margin: 0; min-height: 18px; }
.startrow .btn { justify-self: start; }
.namefix { margin-top: 8px; font-size: 13px; color: var(--muted); }
.namefix summary { cursor: pointer; }
.namefix textarea { margin-top: 6px; }

/* ----------------------------------------------------------------- choose */
.choose { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; margin-top: 18px; }
.options { background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); }
.cat { padding: 14px 16px 0; }
.cat h2 { margin: 6px 0 2px; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.catnote { font-size: 13px; color: var(--ink-2); }
.opt { border-bottom: 1px solid var(--rule-soft); padding: 14px 16px; }
.opt.on { background: var(--panel-2); }
.oh { display: flex; gap: 12px; align-items: flex-start; }
.chk { width: 20px; height: 20px; border: 1.5px solid var(--rule); background: var(--panel); color: #fff; padding: 0; flex: 0 0 auto; }
.opt.on .chk { background: var(--ui); border-color: var(--ui); }
.obody { flex: 1; min-width: 0; }
.opt summary { cursor: pointer; list-style: none; }
.opt summary::-webkit-details-marker { display: none; }
.otitle { font-weight: 600; }
.odesc { font-size: 14px; color: var(--ink-2); margin: 4px 0 0; }
.odetail { font-size: 13.5px; color: var(--ink-2); margin: 6px 0 0; }
.osource { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.orow { font-size: 13.5px; color: var(--ui); margin: 8px 0 0; font-variant-numeric: tabular-nums; }
.otags { margin-top: 8px; }
.orange { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.orange input[type="range"] { flex: 1; accent-color: var(--ui); }
.oscale { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.oval { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.score { position: sticky; top: 76px; background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); padding: 16px; }
.score h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.big-n { padding: 10px 0; border-bottom: 1px solid var(--rule-soft); }
.big-n .k { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: block; }
.big-n .v { font-size: 28px; font-weight: 700; letter-spacing: -.03em; display: block; font-variant-numeric: tabular-nums; }
.big-n .s { font-size: 13px; color: var(--muted); display: block; }
.howlink {
  margin-top: 12px; background: none; border: 0; padding: 0; color: var(--ui);
  font-size: 13px; text-decoration: underline; text-underline-offset: 3px;
}
.flags { margin-top: 12px; display: grid; gap: 8px; }
.flag { display: flex; gap: 8px; font-size: 13px; color: var(--ink-2); }
.flag .fi { flex: 0 0 auto; border: 1px solid currentColor; padding: 0 5px; height: 18px; line-height: 16px; font-size: 11px; }
.flag.bad .fi { color: var(--bad); }
.flag.good .fi { color: var(--good); }
.flag.warn .fi { color: var(--warn); }
/* The bar sticks to the bottom, so the list keeps room under it: without this
   the last choice sits behind the bar on a short screen. */
.choosewrap { padding-bottom: 96px; }
.submitbar {
  position: sticky; bottom: 0; margin-top: 18px; background: var(--panel); border: 1px solid var(--rule);
  padding: 12px 16px; display: flex; align-items: center; gap: 16px; justify-content: space-between;
}

/* ------------------------------------------------------------------- hold */
.hold { text-align: center; padding-top: 6vh; }
.hold .tiles { max-width: 640px; margin-left: auto; margin-right: auto; text-align: left; }
.codebox { max-width: 380px; margin: 26px auto 0; display: grid; gap: 8px; text-align: left; }
.codebox label { font-weight: 700; font-size: 14px; }
.codemsg { min-height: 20px; font-size: 14px; color: var(--muted); margin: 0; }
.codemsg.bad { color: var(--bad); }
.hold .btn.ghost { margin-top: 18px; }

/* --------------------------------------------------------------- surprise */
.stage { position: fixed; inset: 0; z-index: 90; background: #05070b; display: grid; place-items: center; }
.stage[hidden] { display: none; }
.beatframe { position: relative; width: 100%; height: 100%; display: grid; place-items: center; overflow: hidden; }
.beatmedia { position: absolute; inset: 0; }
.beatmedia img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.25) contrast(1.1) brightness(.55); }
.beatmedia .credit { position: absolute; right: 10px; top: 10px; font-size: 10px; color: rgba(255, 255, 255, .55); }
.beattext { position: relative; z-index: 2; max-width: 92vw; padding: 0 6vw; text-align: center; color: #f7f6f3; }
.beattext .stamp { display: block; font-size: 13px; letter-spacing: .24em; text-transform: uppercase; color: #e0754f; margin-bottom: 18px; }
.beattext .figure { display: block; font-size: clamp(48px, 11vw, 130px); font-weight: 700; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.beattext p { font-size: clamp(24px, 4.4vw, 52px); line-height: 1.16; margin: 0 auto; max-width: 20ch; }
.beatframe.slate { background: #05070a; }
.beatframe.slate .beattext p { font-size: clamp(18px, 2.4vw, 30px); max-width: 44ch; line-height: 1.5; }
.beatframe.end { background: #7a1c0d; }
.beatframe.end .beattext p { font-size: clamp(30px, 6vw, 72px); font-weight: 700; max-width: 14ch; }
.simlabel {
  position: absolute; right: 16px; bottom: 16px; z-index: 3; font-size: 11px; letter-spacing: .14em;
  text-transform: uppercase; color: rgba(255, 255, 255, .72); border: 1px solid rgba(255, 255, 255, .3); padding: 4px 8px;
}
.beatctl { position: absolute; top: 16px; right: 16px; z-index: 3; display: flex; gap: 8px; }
.beatctl button {
  background: rgba(0, 0, 0, .5); border: 1px solid rgba(255, 255, 255, .34); color: #fff;
  font-size: 12px; letter-spacing: .1em; text-transform: uppercase; padding: 6px 12px;
}
.beatframe .next {
  position: absolute; left: 50%; bottom: 8vh; transform: translateX(-50%); z-index: 4;
  background: #fff; color: #10141b; border: 0; padding: 15px 26px; font-size: 13px;
  letter-spacing: .14em; text-transform: uppercase; min-width: 280px;
}
.beatframe .next[hidden] { display: none; }

/* ---------------------------------------------------------------- respond */
.strats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-top: 18px; }
.strat {
  background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); padding: 18px;
  text-align: left; color: inherit; display: flex; flex-direction: column; gap: 8px;
}
.strat.picked { border-color: var(--ui); box-shadow: 0 0 0 2px var(--panel-2), var(--shadow); }
.strat .theory { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ui); }
.strat .sn { font-size: 17px; font-weight: 700; }
.strat .sd { font-size: 14px; color: var(--ink-2); }
.strat .sc { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--rule-soft); font-size: 12px; color: var(--muted); display: grid; gap: 3px; }

/* ------------------------------------------------------------------ write */
.guide { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); margin: 18px 0; }
.guide div { background: var(--panel); padding: 12px 14px; }
.guide strong { display: block; font-size: 14px; margin-bottom: 3px; }
.guide span { font-size: 13px; color: var(--ink-2); }
.targets { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.target { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); padding: 14px; }
.target:not(:has(.tmedia)) { grid-template-columns: minmax(0, 1fr); }
.tmedia img { width: 96px; height: 116px; object-fit: cover; border: 1px solid var(--rule); }
.tmedia .credit { font-size: 10px; color: var(--muted); display: block; }
.target .tm { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.target .pos { font-size: 14px; color: var(--ink-2); margin: 0 0 8px; }
.target label { font-weight: 700; font-size: 13px; display: block; margin-bottom: 4px; }
.result { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--rule-soft); font-size: 14px; }
.result.yes strong { color: var(--good); }
.result.no strong { color: var(--bad); }

/* ---------------------------------------------------------------- outcome */
.tally { background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); padding: 20px; text-align: center; margin: 18px 0; }
.tally .tn { font-size: 54px; font-weight: 700; letter-spacing: -.04em; display: block; font-variant-numeric: tabular-nums; }
.tally .tk { font-size: 13px; color: var(--muted); display: block; margin-top: 4px; }
.tbar { height: 12px; background: var(--rule-soft); position: relative; margin-top: 14px; }
.tbar i { position: absolute; left: 0; top: 0; bottom: 0; display: block; background: var(--bad); }
.tbar i.pass { background: var(--good); }
.tbar u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.blocs { display: grid; gap: 10px; }
.bloc { background: var(--panel); border: 1px solid var(--rule); padding: 12px 14px; }
.bh { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.bn { font-weight: 600; }
.bs { font-size: 13px; font-variant-numeric: tabular-nums; }
.bloc.yes .bs { color: var(--good); }
.bloc.no .bs { color: var(--bad); }
.bw { font-size: 13.5px; color: var(--ink-2); margin: 6px 0 0; }
.advice { margin-top: 16px; font-size: 15px; color: var(--ink-2); }

/* ---------------------------------------------------------------- receipt */
.shotnote { border: 1px dashed var(--ui); color: var(--ui); padding: 10px 14px; text-align: center; font-size: 14px; }
.receipt { background: var(--panel); border: 1px solid var(--ink); box-shadow: var(--shadow); padding: 30px 34px; margin-top: 14px; }
.receipt .ex { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.receipt .names { font-weight: 700; font-size: 17px; }
.rsec { margin-top: 20px; }
.rsec h2 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--rule); padding-bottom: 5px; margin-bottom: 8px; }
.rsec ul { margin: 0; padding-left: 20px; }
.rsec li { margin-bottom: 4px; }
.offscreen { position: absolute; left: -9999px; top: 0; }
.fallback { margin-top: 14px; }

/* -------------------------------------------------- how this page works */
.how h2 { margin-top: 26px; }
.how ul { padding-left: 20px; }
.how li { margin-bottom: 8px; }
.how .note { color: var(--muted); font-size: 14px; max-width: 70ch; }
.how .warn { background: var(--warn-bg); color: var(--warn); padding: 10px 14px; }

@media (max-width: 980px) {
  .brief-main, .choose { grid-template-columns: 1fr; }
  .score { position: static; }
}
@media print {
  .topbar, .submitbar, .shotnote, .row, .notice { display: none !important; }
  body { background: #fff; }
  .receipt { border: 1px solid #000; box-shadow: none; }
}

/* stage screens: a briefing, one call with a reason, then the record */
.stagescreen .brief-copy > p { font-size: 16px; line-height: 1.55; max-width: 72ch; }
.stageask { background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); padding: 16px 18px; margin: 22px 0; }
.stageask h2 { margin-top: 0; font-size: 19px; }
.stagepicks { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin: 12px 0 16px; }
.stagepick { text-align: left; background: var(--panel-2); border: 1px solid var(--rule); color: var(--ink); padding: 12px 13px; cursor: pointer; font: inherit; }
.stagepick .pn { display: block; font-weight: 600; margin-bottom: 4px; }
.stagepick .pd { display: block; font-size: 14px; color: var(--ink-2); line-height: 1.45; }
.stagepick.on { border-color: var(--ui); box-shadow: inset 0 0 0 2px var(--ui); }
.stagepick[disabled] { cursor: default; opacity: .8; }
.stagepick.on[disabled] { opacity: 1; }
.stageask textarea { width: 100%; font: inherit; padding: 8px; background: var(--panel-2); color: var(--ink); border: 1px solid var(--rule); }
.stagereveal { border-left: 4px solid var(--ui); background: var(--panel); padding: 14px 18px; margin: 22px 0; box-shadow: var(--shadow); }
.stagereveal h2 { margin-top: 0; }
.stagecompare { font-weight: 600; }
.stagetimeline li { margin: 5px 0; line-height: 1.45; }
.stagelink { background: var(--panel-2); border: 1px solid var(--rule-soft); padding: 10px 14px; margin-top: 14px; }
.stagelink h3 { margin: 0 0 6px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.stagereveal .src, .stagelink .src { font-size: 12px; color: var(--muted); }
#case figure img { max-width: 100%; }
.revealphotos { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 14px; }
.revealphotos figure, .stagescreen .brief-photos figure { margin: 0 0 12px; }
.revealphotos img, .stagescreen .brief-photos img { width: 100%; height: auto; display: block; border: 1px solid var(--rule); background: #fff; }
.revealphotos figcaption, .stagescreen .brief-photos figcaption { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
.stagemap { margin: 18px 0 0; max-width: 640px; background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); }
.stagemap img { width: 100%; display: block; }
.stagemap figcaption { font-size: 12px; color: var(--muted); padding: 6px 10px; }
.strats + .btn, .stagewrap .strats ~ .btn { margin-top: 18px; }
.stagebullets li { margin: 6px 0; line-height: 1.5; font-size: 16px; max-width: 70ch; }
.stagescreen .brief-main { grid-template-columns: minmax(0, 1.15fr) minmax(300px, .85fr); }
.stagescreen .brief-photos .sidemap { background: var(--panel); }
.stagelink ul { margin: 6px 0 0; padding-left: 20px; }
.stagelink li { margin: 6px 0; line-height: 1.5; }
.stagelink h3 { text-transform: none; letter-spacing: 0; font-size: 15px; color: var(--ink); }

/* Photo info: hover, focus or tap shows more about the photo. */

<script>/* core.js — the simulation engine's pure logic.

   No DOM, no network, no randomness, no clock: everything here is a function of
   the state, the simulation data, and the rules the session wrote. The page
   loads it as a plain script; the Node tests and the route runner load it in a
   vm. Both get the same answers, which is the point.

   State shape:
     {version, names, choices: {optionId: size 0..1}, strategy, texts: {targetId},
      moved: {targetId: true}, sent, unlocked, screen}
   Rules signature, written by the session in sim_rules.js:
     RULES[name](state, data, helpers, extra) */
(function (root) {
  "use strict";

  function normalizeCode(value) {
    return String(value == null ? "" : value).replace(/\s+/g, "").toUpperCase();
  }

  function num(value, fallback) {
    var n = Number(value);
    return isFinite(n) ? n : (fallback == null ? 0 : fallback);
  }

  /* An option's size is a factor between 0 and 1 over its low-to-high range.
     An option with no high is all or nothing, so the size cannot shrink it. */
  function amount(option, size) {
    if (!option) return 0;
    var lo = num(option.low, 0);
    if (option.high == null) return lo;
    var hi = num(option.high, lo);
    var f = size == null ? 1 : Math.max(0, Math.min(1, num(size, 1)));
    return lo + (hi - lo) * f;
  }

  function eachOf(data, key, fn) {
    (data && data.screens || []).forEach(function (screen) {
      (screen[key] || []).forEach(fn);
    });
  }

  function index(data) {
    var byId = {};
    ["options", "strategies", "targets"].forEach(function (key) {
      eachOf(data, key, function (item) { if (item && item.id) byId[item.id] = item; });
    });
    return byId;
  }

  function chosen(state, data) {
    var out = [];
    eachOf(data, "options", function (option) {
      if (state && state.choices && state.choices[option.id] != null) out.push(option);
    });
    return out;
  }

  /* What a rule gets as its third argument. Everything a formula needs about
     this group's page, and nothing that could reach outside it. */
  function helpers(state, data) {
    var byId = index(data);
    function option(id) { return typeof id === "string" ? (byId[id] || null) : (id || null); }
    return {
      option: option,
      amount: function (idOrOption) {
        var opt = option(idOrOption);
        if (!opt) return 0;
        return amount(opt, state && state.choices ? state.choices[opt.id] : 1);
      },
      size: function (idOrOption) {
        var opt = option(idOrOption);
        if (!opt || !state || !state.choices) return 0;
        var size = state.choices[opt.id];
        /* The same clamp as amount(): a size out of range would leave a choice
           costing what it costs and doing whatever the store says. */
        return size == null ? 0 : Math.max(0, Math.min(1, num(size, 0)));
      },
      picked: function (id) { return !!(state && state.choices && state.choices[id] != null); },
      chosen: function () { return chosen(state, data); },
      strategy: function () { return state && state.strategy ? option(state.strategy) : null; },
      moved: function () { return Object.keys((state && state.moved) || {}); },
      hasMoved: function (id) { return !!(state && state.moved && state.moved[id]); },
      value: function (item, key, fallback) {
        var obj = option(item);
        if (!obj || !obj.values || obj.values[key] == null) return fallback == null ? 0 : fallback;
        return obj.values[key];
      },
      sum: function (list, fn) {
        return (list || []).reduce(function (total, item) {
          return total + num(fn ? fn(item) : item, 0);
        }, 0);
      },
      clamp: function (value, lo, hi) { return Math.max(lo, Math.min(hi, num(value, lo))); },
      stagePick: function (stageId) {
        var row = state && state.stages ? state.stages[stageId] : null;
        return row && row.revealed ? row.pick : null;
      }
    };
  }

  function emptyState(version) {
    return {
      version: version || "",
      names: "",
      choices: {},
      strategy: null,
      texts: {},
      moved: {},
      sent: 0,
      unlocked: false,
      screen: null,
      stages: {}
    };
  }

  /* A saved state belongs to the build that wrote it. A rebuilt page keeps
     nothing from an older build, and says so on screen rather than silently.
     The saved code comes back too, or a reload after the unlock would land on a
     screen the page can no longer open. Sizes are clamped on the way in: the
     store is the student's own browser and anything can be typed into it. */
  function restore(saved, version) {
    if (!saved || typeof saved !== "object" || saved.version !== version) {
      return { state: emptyState(version), dropped: !!saved };
    }
    var state = emptyState(version);
    ["names", "strategy", "screen", "code"].forEach(function (key) {
      if (saved[key] != null) state[key] = saved[key];
    });
    ["texts", "moved"].forEach(function (key) {
      if (saved[key] && typeof saved[key] === "object") state[key] = saved[key];
    });
    if (saved.choices && typeof saved.choices === "object") {
      Object.keys(saved.choices).forEach(function (id) {
        var size = Number(saved.choices[id]);
        state.choices[id] = isFinite(size) ? Math.max(0, Math.min(1, size)) : 1;
      });
    }
    state.sent = Math.max(0, num(saved.sent, 0));
    state.unlocked = !!saved.unlocked;
    state.quiz = (saved.quiz && typeof saved.quiz === "object") ? saved.quiz : {};
    /* A stage holds the group's call, its reason, and whether the record has
       been shown. A call is never changed after the record is out. */
    if (saved.stages && typeof saved.stages === "object") {
      Object.keys(saved.stages).forEach(function (id) {
        var row = saved.stages[id] || {};
        state.stages[id] = {
          pick: typeof row.pick === "string" ? row.pick : null,
          why: typeof row.why === "string" ? row.why : "",
          revealed: !!row.revealed && typeof row.pick === "string",
          predict: typeof row.predict === "string" ? row.predict : null,
          tag: typeof row.tag === "string" ? row.tag : null
        };
      });
    }
    return { state: state, dropped: false };
  }

  var DEFAULT_POLICY = { maxNewFirst: 2, maxNewRetry: 1, minOneIfWritten: true, minWords: 8 };

  function words(text) {
    return String(text || "").trim().split(/\s+/).filter(Boolean).length;
  }

  function byStrength(a, b) {
    return (b.points - a.points)
      || (b.text.length - a.text.length)
      || String(a.target.name || a.target.id).localeCompare(String(b.target.name || b.target.id));
  }

  /* Holbein's locking policy, and the reasons it exists:
       - nothing written persuades nobody (a group cannot skip the work);
       - a real attempt always moves one (the exercise is not a dead end);
       - never everyone at once, so the count stays hard;
       - a target already moved stays moved and shows up as a yes in the count;
       - a retry can move one more, and shows only the targets still open. */
  function lockPitches(targets, texts, moved, score, policy, sends) {
    var rules = {};
    Object.keys(DEFAULT_POLICY).forEach(function (k) { rules[k] = DEFAULT_POLICY[k]; });
    Object.keys(policy || {}).forEach(function (k) { if (policy[k] != null) rules[k] = policy[k]; });

    var locked = {};
    Object.keys(moved || {}).forEach(function (k) { if (moved[k]) locked[k] = true; });
    var all = targets || [];

    var scored = all.map(function (target) {
      var text = String((texts && texts[target.id]) || "").trim();
      var result = text ? (score(target, text) || {}) : { points: 0, ready: false };
      return {
        target: target, text: text, points: num(result.points, 0), ready: !!result.ready,
        /* A real attempt has substance. Without this a full stop in each box
           moves somebody, and a group can send the same junk again and again
           until everybody has moved. */
        real: words(text) >= rules.minWords
      };
    });
    var anyReal = scored.some(function (row) { return row.real; });
    var open = scored.filter(function (row) { return !locked[row.target.id]; });
    /* The allowance follows how many times the group has pressed send, not how
       many targets happen to have moved. */
    var maxNew = num(sends, 0) > 0 ? rules.maxNewRetry : rules.maxNewFirst;
    maxNew = Math.max(0, Math.min(maxNew, all.length - 1));   // never everybody at once

    var winners = open.filter(function (row) { return row.ready && row.real; }).sort(byStrength).slice(0, maxNew);
    if (!winners.length && anyReal && rules.minOneIfWritten && maxNew > 0) {
      winners = open.filter(function (row) { return row.real; }).sort(byStrength).slice(0, 1);
    }
    winners.forEach(function (row) { locked[row.target.id] = true; });

    var results = {};
    scored.forEach(function (row) {
      results[row.target.id] = {
        moved: !!locked[row.target.id],
        points: row.points,
        ready: row.ready,
        wrote: row.text.length > 0,
        real: row.real
      };
    });
    return { moved: locked, results: results };
  }

  function fill(text, vars) {
    return String(text == null ? "" : text).replace(/\{\{(\w+)\}\}/g, function (whole, key) {
      return vars && vars[key] != null ? String(vars[key]) : whole;
    });
  }

  function group(value) {
    var parts = String(value).split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return parts.join(".");
  }

  function formatValue(value, format, digits) {
    if (value == null || value === "") return "—";
    var n = Number(value);
    if (format === "text" || !isFinite(n)) return String(value);
    switch (format) {
      case "int": return group(String(Math.round(n)));
      case "one": return group(n.toFixed(1));
      case "pct": return Math.round(n) + "%";
      case "pct1": return n.toFixed(1) + "%";
      case "fixed": return group(n.toFixed(num(digits, 0)));
      default: return group(String(Math.round(n * 100) / 100));
    }
  }

  /* The text a group copies into the Blackboard item. Every student's name is
     the first line, because that is what the submission rule asks for. */
  function receiptText(state, data, ctx) {
    ctx = ctx || {};
    var lines = [];
    /* A simulation can leave the names off the page: the group adds them to the
       downloaded file, or types them into Blackboard when it uploads. */
    if (data && data.no_names) lines.push("Group members: (write every name in your group here)");
    else lines.push(String((state && state.names) || "").trim() || "(no names entered)");
    lines.push("");
    lines.push([data && data.course, data && data.title].filter(Boolean).join(" — "));
    if (ctx.stats && ctx.stats.length) {
      lines.push("");
      ctx.stats.forEach(function (row) { lines.push(row.label + ": " + row.value); });
    }
    if (ctx.choices && ctx.choices.length) {
      lines.push("");
      lines.push("What we chose");
      ctx.choices.forEach(function (row) {
        lines.push("- " + row.name + (row.value ? " (" + row.value + ")" : ""));
      });
    }
    if (ctx.stages && ctx.stages.length) {
      lines.push("");
      lines.push("Our choices, stage by stage");
      ctx.stages.forEach(function (row) {
        lines.push("- " + row.title + ": " + (row.pick || "(no call)"));
        if (row.why) lines.push("  Why: " + row.why);
        if (row.real) lines.push("  What really happened: " + row.real);
        if (row.predict) lines.push("  Our guess of what came next: " + row.predict);
        if (row.tag) lines.push("  Explanation that fits best: " + row.tag);
      });
    }
    if (ctx.quizzes && ctx.quizzes.length) {
      lines.push("");
      lines.push("Quick checks");
      ctx.quizzes.forEach(function (q) { lines.push("- " + q); });
    }
    if (ctx.surprise) {
      lines.push("");
      lines.push("What broke: " + ctx.surprise);
    }
    if (ctx.strategy) {
      lines.push("");
      lines.push("Our response: " + ctx.strategy.name
        + (ctx.strategy.theory ? " (" + ctx.strategy.theory + ")" : ""));
    }
    if (ctx.messages && ctx.messages.length) {
      lines.push("");
      lines.push("Our messages");
      ctx.messages.forEach(function (row) {
        lines.push("- " + row.name + ": " + (row.moved ? "moved" : "not moved"));
        if (row.text) lines.push("  " + row.text);
      });
    }
    if (ctx.outcome) {
      lines.push("");
      lines.push("Outcome: " + ctx.outcome.headline);
      if (ctx.outcome.detail) lines.push(ctx.outcome.detail);
    }
    return lines.join("\n");
  }

  /* Every student's name, the way the submission rule asks for it. One name is
     a group that forgot the others, so the page says so before it starts. */
  function nameList(value) {
    return String(value == null ? "" : value)
      .split(/[,\n;]+| and /i)
      .map(function (name) { return name.trim(); })
      .filter(function (name) { return name.length > 1; });
  }

  /* The name of the file a group uploads: the simulation, then the names they
     typed, so a folder of them can be read without opening any. */
  function fileName(state, data) {
    var names = String((state && state.names) || "").toLowerCase()
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60).replace(/-+$/, "");
    var id = String((data && data.id) || "simulation").toLowerCase()
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    return [id, names || "answers"].filter(Boolean).join("-") + ".txt";
  }

  function rule(RULES, name) {
    var fn = RULES && RULES[name];
    if (typeof fn !== "function") throw new Error("rule not found: " + name);
    return fn;
  }

  function run(RULES, name, state, data, extra) {
    return rule(RULES, name)(state, data, helpers(state, data), extra);
  }

  root.SIMCORE = {
    normalizeCode: normalizeCode,
    amount: amount,
    chosen: chosen,
    helpers: helpers,
    index: index,
    emptyState: emptyState,
    restore: restore,
    lockPitches: lockPitches,
    fill: fill,
    formatValue: formatValue,
    receiptText: receiptText,
    fileName: fileName,
    nameList: nameList,
    rule: rule,
    run: run,
    DEFAULT_POLICY: DEFAULT_POLICY
  };
}(typeof globalThis !== "undefined" ? globalThis : this));
</script>
<script>/* sim_rules.js: the one rule this simulation needs.
   The news before stage 9 opens with the group's own call at stage 6.
   Pure function: no chance, no clock. */
RULES = {
  newsFor: function (state, data, H) {
    var pick = H.stagePick("s6");
    return pick || "default";
  }
};
</script>

window.DATA = {"id":"me-s11-islamists","title":"Islamist parties and power: Egypt and Tunisia","course":"Islam, Politics, and the Middle East","session":11,"address":"www.ala-alrababah.com/teaching/me-s11/","label":"A class exercise. Every event shown is real.","illustrative":false,"build":"cd608542ed64","sources":[{"id":"aljazeera_ennahda_results","text":"Al Jazeera, Final Tunisian election results announced (November 2011)","url":""},{"id":"bbc_mb_profile","text":"BBC News, Profile: Egypt's Muslim Brotherhood","url":""},{"id":"cnn_egypt_parliament_results","text":"CNN, Two Islamist parties win big in Egypt election (January 2012)","url":""},{"id":"npr_morsi_president","text":"NPR, Muslim Brotherhood's Mohammed Morsi To Be Egypt's New President (24 June 2012)","url":""},{"id":"wilsoncenter_tunisia_decline_political_islam","text":"Wilson Center, Tunisia and the Decline of Political Islam","url":""},{"id":"MORE1","text":"Carnegie Endowment, profiles of the Muslim Brotherhood, Ennahda, Wasat, and the 2012 Egyptian constitution","url":""},{"id":"MORE2","text":"MERIP, Ghannouchi and the Islamic Tendency Movement (1988), and Egypt's 1984 elections (1985)","url":""},{"id":"MORE3","text":"Sharan Grewal, From Islamists to Muslim Democrats, American Political Science Review (2020)","url":""},{"id":"MORE4","text":"Definitions: Oxford Dictionary of Islam; Encyclopaedia Britannica (Islamism, sharia, secularism, jihad, Sunni); Barbara Geddes, Joseph Wright, and Erica Frantz, Autocratic Breakdown and Regime Transitions, Perspectives on Politics (2014); Alfred Stepan and Juan Linz, Democratization Theory and the Arab Spring, Journal of Democracy (2013); Joas Wagemakers, Salafism, Oxford Research Encyclopedia of Religion (2016); Vali Nasr, The Rise of Muslim Democracy, Journal of Democracy (2005); International IDEA, ACE Electoral Knowledge Network","url":""},{"id":"MORE5","text":"Brookings, Human Rights Watch, Amnesty International, Hudson Institute, Inter-Parliamentary Union, Wilson Center, Washington Institute, Combating Terrorism Center, Encyclopedia.com","url":""},{"id":"MORE6","text":"Al Jazeera, BBC, CNN, NPR, Asharq Al-Awsat, Foreign Policy, and Foreign Affairs news reports, 2011 to 2026, and Lawrence Wright, The Man Behind Bin Laden, The New Yorker (2002)","url":""}],"rules":[],"screens":[{"id":"brief","kind":"brief","kicker":"Islam, Politics, and the Middle East · Session 11","headline":"Islamist parties and power: Egypt and Tunisia","lede":"Your group leads two Islamist movements, Egypt's Muslim Brotherhood and Tunisia's Ennahda, which the Brotherhood inspired. In 10 stages, from the 1970s to 2013, you face the decisions their leaders faced. The stages switch between the two countries in the order the events happened.","steps":["Open this page on one laptop per group and press Start.","At each stage, read the briefing, agree on one choice, and write why.","Save your choice. The page then shows what the real leaders did and what happened afterwards. Then you answer a question about it.","Hover over or tap any underlined name or term, or any photo, to learn more. Twice you get a quick check: Egypt or Tunisia?"],"deliverable":"The tab called The case, at the top of the page, holds the explanations, the terms, and other Islamist movements. At the end, download your file and upload it to Blackboard.","grade_note":"Your choices are not graded.","panels":[{"title":"What moderation means","bullets":["An Islamist party moderates when it accepts two basic rules of democracy, even if it keeps a religious identity. First, laws are made by elected representatives, and no religious authority can overrule them. Second, everyone is free to practice any religion, any version of Islam, or none. Scholars have proposed 4 explanations for why Islamist parties moderate."]},{"title":"4 explanations for moderation","bullets":["**Votes.** To win elections, a party plays down religion to reach voters beyond its religious base and make alliances with other parties.","**Fear of repression.** Under a dictatorship, a party softens its program and avoids confronting the regime, so that the regime does not ban it or jail its members. The aim is to keep the organization alive, not to win votes.","**Inclusion.** When Islamists take part in politics, they must work with people who think very differently (for example, in parliament, in election alliances, at universities, and in civic groups). This contact can make them more tolerant of other views and more accepting of pluralism, the idea that many different views can coexist.","**Living in a secular democracy.** Islamists who studied or lived in exile in Western democracies saw democracy and religious freedom work in practice, met non-Muslims, and learned that a secular state need not repress religion. They tended to come back more accepting of secular democracy than those who stayed home."],"numbered":true},{"title":"Words you will meet","bullets":["**Islamists.** People and groups who want their vision of Islam to shape the state, the law, or society, for example by basing laws on sharia, and who organize to pursue that goal. Devout Muslims are not necessarily Islamists.","**Sharia.** Islamic law: God's law for Muslims as found in the Quran and the Sunna, the Prophet Muhammad's sayings and practice. It covers worship as well as family, trade, and crime. Scholars interpret it in many different ways, so \"applying sharia\" can mean very different things.","**Secular.** Keeping religion separate from the state: religious authorities do not control the laws or the courts, and the state does not impose a religion.","**Civil state.** The term many Arab parties use instead of \"secular,\" because the Arabic word for secularism can sound anti-religious. It usually means a state run neither by the army nor by clerics.","**Salafis.** Sunni Muslims who try to follow \"the pious predecessors,\" the first generations of Muslims, as closely as possible, and reject practices they see as later additions. Many, called quietists, focus on preaching and teaching and stay out of political activism. Some form parties, like Egypt's Nour. A minority, such as al-Qaeda, use violence.","**Jihad.** Arabic for \"effort\" or \"struggle.\" It can mean a Muslim's inner struggle to do right and avoid wrong, or armed fighting. Qutb argued that much of Muslim society was Muslim only in name and that those who stood in the way of God's rule were legitimate targets of armed jihad. Later armed Islamist groups took up this idea."]}],"tiles":[]},{"id":"s1","kind":"stage","kicker":"Stage 1 of 10 · Egypt · 1928 to 1970","headline":"Sadat's offer to the Brotherhood, 1970","receipt_title":"Stage 1, Sadat's offer, 1970","lede":"You lead the Muslim Brotherhood in Egypt. It is 1970, and Egypt has a new president.","panels":[],"tiles":[],"photos":[{"file":"media/hasan_al_banna.jpg","alt":"Hasan al-Banna","credit":"Hasan al-Banna. Photo: Khayr al-Din al-Zirikli, public domain.","info":"Born in 1906 near Alexandria, al-Banna led the Brotherhood with the title General Guide. By the late 1940s it had about 500,000 members in Egypt and branches in Palestine, Syria, Iraq, and Sudan."},{"file":"media/sayyid_qutb_large.jpg","alt":"Sayyid Qutb on trial","credit":"Sayyid Qutb on trial, around 1966. Photo: public domain.","info":"In 1965 Qutb was charged with plotting to overthrow the government. Prosecutors built their case mainly on passages from Milestones. His lawyer called it \"a revolutionary court, with no defense.\""}],"question":"Sadat offers you the right to preach if you give up violence. What do you do?","picks":[{"id":"s1_fight","name":"Refuse and fight the regime","detail":"Qutb called for jihad against governments he saw as un-Islamic. You keep all your goals, and the state keeps hunting your members.","others":{"who":"Al-Jihad, which assassinated Sadat in 1981, and al-Gamaa al-Islamiyya, two armed groups in Egypt inspired by Qutb.","bullets":["**1997.** Al-Gamaa al-Islamiyya killed dozens of tourists at Luxor.","Neither group took power."]}},{"id":"s1_deal","name":"Accept the deal and give up violence","detail":"You can preach in the open and hope your jailed members are freed. You stay illegal and depend on Sadat keeping his word."}],"why_min":10,"reveal":{"real_pick":"s1_deal","bullets":["**In Nasser's prisons.** The Brotherhood's leader, Hasan al-Hudaybi, answered Qutb from his own cell: no Muslim may declare another Muslim an unbeliever. His view won inside the Brotherhood.","**1971 to 1976.** Sadat released Brotherhood prisoners. The Brotherhood gave up violence and backed Sadat against leftists and the supporters of Nasser. In **1976** he let it publish its newspaper, al-Dawa (The Call), again. But the Brotherhood remained illegal.","**1981.** At a military parade, Lieutenant Khaled Islambouli and 3 other conspirators from al-Jihad, a militant group inspired by Qutb, attacked Sadat with grenades and machine-gun fire and killed him. Hosni Mubarak became president. Egypt later tried Islambouli with 23 others and executed 5 of them, Islambouli among them."],"class_link":{"text":["**Fear of repression.** The Brotherhood gave up violence after Nasser's crackdowns of 1954 and 1965. Sadat then let the Brotherhood preach and gradually freed its jailed members, but it stayed illegal.","**Living in a secular democracy.** Qutb's time in the United States did not make him more accepting of secular democracy. Grewal (2020) writes that Qutb \"was so shocked by the loose morals he saw in Colorado that he instead moved toward a stricter form of Islamism.\"","**Discuss:** did the Brotherhood change its beliefs, or only its tactics to survive?"],"reading":"Sources: Grewal (2020), BBC, Carnegie, Council on Foreign Relations.","title":"The explanations at this stage"},"real_label":"accepted the deal and gave up violence.","tag_options":["Votes","Fear of repression","Inclusion","Living in a secular democracy","None of them"],"tag_question":"Which explanation of moderation fits this stage best? Pick one, then discuss your reasons aloud.","actor":"the Brotherhood"},"bullets":["**1928.** Hasan al-Banna founds the Muslim Brotherhood to revive Islam in Egyptians' daily lives and in society. It preaches and does charity, then turns to politics against British control.","**1940s.** Al-Banna builds a secret armed wing, the Special Apparatus, which carries out bombings and assassinations against British targets and Egyptian officials. The government dissolves the Brotherhood in December 1948, and in February 1949 an unknown gunman, believed to be from the security forces, shoots al-Banna dead.","**1948 to 1950.** Sayyid Qutb, a well-known literary critic working for Egypt's Ministry of Education, spends almost two years in the United States, part of it at a college in Colorado. Living in a Western democracy did not win him over: he comes back condemning America as a soulless, materialistic place, and joins the Brotherhood.","**1954.** A Special Apparatus member tries to kill Egypt's leader, Gamal Abdel Nasser. The government dissolves the Brotherhood again, and jails and tortures thousands of its members.","**1964 to 1966.** Qutb, now the Brotherhood's leading thinker, publishes Milestones, which he wrote in prison. It calls for jihad against governments and societies he sees as un-Islamic. Nasser grants him parole in 1964, but the government arrests him again in 1965. A court sentences him to death, and Nasser's regime hangs him in August 1966.","**1970.** Nasser dies. His successor, Anwar Sadat, wants help against leftists and Nasser's supporters. He offers the Brotherhood the right to preach if it gives up violence. Under the deal it stays illegal."],"why_label":"Why? And name a risk to your choice."},{"id":"s2","kind":"stage","kicker":"Stage 2 of 10 · Tunisia · 1956 to 1981","headline":"Bourguiba promises to allow other parties, 1981","receipt_title":"Stage 2, going public, 1981","lede":"You lead the Islamic Group, Tunisia's secret Islamist preaching movement. It is April 1981.","panels":[{"title":"People","bullets":["**Habib Bourguiba.** Tunisia's first president, in power until 1987.","**Rached Ghannouchi.** Co-founder and leader of the Islamic Group.","**Abdelfattah Mourou.** Co-founder of the Islamic Group."]}],"tiles":[],"photos":[{"file":"media/bourguiba.jpg","alt":"Habib Bourguiba","credit":"Habib Bourguiba. Photo: Habib Osman, public domain.","info":"Bourguiba backed the Quranic Preservation Society, a religious group meant to counter the left and other critics of his government. In 1970 Ghannouchi and Mourou joined it."},{"file":"media/ghannouchi.jpg","alt":"Rached Ghannouchi","credit":"Rached Ghannouchi. Photo: Chatham House, CC BY 2.0.","info":"In the 1970s Ghannouchi spread the ideas of al-Banna and Qutb in Tunisia's long-empty mosques. By the early 1980s Islamists were the best-organized student group at the University of Tunis. This photo is from 2012."}],"question":"Bourguiba says he will allow other parties. What do you do?","picks":[{"id":"s2_public","name":"Go public and ask for a party license","detail":"You get a voice in politics, but the police learn who your leaders are."},{"id":"s2_secret","name":"Stay a secret preaching group","detail":"Your members stay hidden and keep preaching, but you have no say in politics.","others":{"who":"Egypt's Salafist Call, a Salafi movement founded in Alexandria in the 1970s, which stayed out of party politics and focused on preaching.","bullets":["The Salafist Call preached in the open. The regime banned it in 1994, and its networks survived by evading the security forces.","**2011.** The Salafist Call entered politics only after President Hosni Mubarak fell, when it founded the Nour party."]}}],"why_min":10,"reveal":{"real_pick":"s2_public","bullets":["**April 1981.** Ghannouchi and Mourou dissolved the secret group and founded a party, the Islamic Tendency Movement, known by its French initials, MTI. Ghannouchi asked for a license and never received an answer.","Ghannouchi called for \"the end of single-party politics and the acceptance of political pluralism and democracy\" and stressed the movement's \"rejection of violence.\"","**July 1981.** By the end of July the regime had arrested Ghannouchi and all the known leaders and members of the MTI in midnight raids. During interrogations, the regime often used torture.","**November 1981.** Bourguiba let 3 opposition movements run (none Islamist), but his ruling party rigged the elections, and its joint list with the main trade union won all 136 seats."],"class_link":{"text":["**Fear of repression.** After Bourguiba promised in April 1981 to open his one-party system, Ghannouchi and Mourou dissolved their secret group, founded a party, the MTI, asked for a license, rejected violence, and called for \"political pluralism and democracy.\" Even so, by the end of July 1981 the regime had arrested its known leaders and members."],"reading":"Sources: MERIP (1988), Wilson Center.","title":"The explanations at this stage"},"real_label":"went public and asked for a party license.","predict":{"question":"Before you read on: what did Bourguiba's regime do next?","options":[{"text":"It granted the movement a party license within 6 months.","real":false,"where":"No. Under Bourguiba the movement never received a license."},{"text":"It arrested the movement's leaders and members within 4 months.","real":true,"where":""},{"text":"It left the request unanswered and the movement alone for 3 years.","real":false,"where":"No. Ghannouchi never received an answer, but the arrests came within 4 months."}]},"tag_options":["Votes","Fear of repression","Inclusion","Living in a secular democracy","None of them"],"tag_question":"Which explanation of moderation fits this stage best? Pick one, then discuss your reasons aloud.","actor":"the Islamic Group"},"bullets":["**1956 to 1962.** Habib Bourguiba, Tunisia's first president, makes secular reforms. The 1956 Personal Status Code bans polygamy and lets women seek divorce. In 1962, during Ramadan, the month of fasting, he drinks orange juice on television.","**1970s.** Rached Ghannouchi, a preacher and philosophy teacher, and Abdelfattah Mourou lead the Islamic Group, a preaching movement relatively close to quietist Salafis, the Salafis who focus on preaching and avoid party politics.","**1979.** The group becomes a secret organization.","**April 1981.** Bourguiba says he will open his one-party system to other parties."],"map":{"file":"media/map_region.svg","alt":"Map of North Africa","credit":"Egypt and Tunisia, with Libya between them. Map: Natural Earth."},"why_label":"Why? And name a risk to your choice."},{"id":"s3","kind":"stage","kicker":"Stage 3 of 10 · Egypt · 1984","headline":"Egypt's 1984 election","receipt_title":"Stage 3, the 1984 election","lede":"You lead the Muslim Brotherhood. It is 1984, and Hosni Mubarak is president.","panels":[{"title":"People","bullets":["**Hosni Mubarak.** President of Egypt from 1981 to 2011."]}],"tiles":[],"photos":[{"file":"media/mubarak.jpg","alt":"Hosni Mubarak","credit":"Hosni Mubarak. Photo: Ricardo Stuckert/PR, CC BY 3.0 br.","info":"Mubarak kept Egypt under emergency law for his entire time in office, giving the state sweeping powers of arrest."}],"question":"What do you do in the 1984 election?","picks":[{"id":"s3_boycott","name":"Boycott the election","detail":"You refuse to make an unfair election look legitimate, and you have no one in parliament."},{"id":"s3_ally","name":"Ally with a secular party and run on its list","detail":"You get people into parliament, but under a secular party's name and in an unfair vote."}],"why_min":10,"reveal":{"real_pick":"s3_ally","bullets":["**1984.** The Brotherhood allied with the New Wafd, a secular liberal party. The alliance won 58 seats.","**1987.** The Brotherhood allied with the Socialist Labor and Socialist Liberal parties. The alliance won 78 seats, and Brotherhood members won 36 of them.","**1990.** The Brotherhood and most other opposition parties boycotted the election, saying the new election law would not make it free. The Brotherhood did not run again until 1995.","**1995 to 2005.** Brotherhood members ran as independents: 17 seats in 2000, 88 seats in 2005, about 20% of parliament. In 1996 younger members tried to found a new party, Wasat (the Center), that would separate preaching from politics. The Brotherhood's leaders expelled every member who joined Wasat.","**After 2005.** The government arrested hundreds of Brotherhood members and changed the constitution to ban parties based on religion."],"class_link":{"text":["**Fear of repression.** Under Mubarak the Brotherhood generally avoided confronting the regime. Even so, after its members won 88 seats in 2005, the government arrested hundreds of them and changed the constitution to ban parties based on religion.","**Inclusion.** In 1984 the Brotherhood ran on the list of the secular New Wafd, which accepted only 18 of the roughly 70 candidates it proposed, and 8 of them won seats. MERIP called it \"a tactical electoral alliance on terms largely dictated by the Wafd.\" In 1987 it allied with the Socialist Labor and Socialist Liberal parties. Yet in 1996 its leaders expelled every member who joined Wasat, the party young members founded to separate preaching from politics.","**Discuss:** did working with other parties change its leaders, or only its tactics?"],"reading":"Sources: MERIP (1985), Carnegie, BBC, Al Jazeera.","title":"The explanations at this stage"},"real_label":"allied with a secular party, the New Wafd, and ran on its list.","tag_options":["Votes","Fear of repression","Inclusion","Living in a secular democracy","None of them"],"tag_question":"Which explanation of moderation fits this stage best? Pick one, then discuss your reasons aloud."},"bullets":["**1984.** Mubarak holds parliamentary elections. The Brotherhood is still illegal and cannot run as a party. Egypt is not a democracy, and Mubarak's ruling party wrote the election law."],"why_label":"Why? And name a risk to your choice."},{"id":"s4","kind":"stage","kicker":"Stage 4 of 10 · Tunisia · 1984 to 1991","headline":"Tunisia's 1989 election","receipt_title":"Stage 4, the 1989 election","lede":"You lead the MTI, now called Ennahda. It is April 1989.","panels":[{"title":"People","bullets":["**Zine el-Abidine Ben Ali.** President of Tunisia from 1987 to 2011."]}],"tiles":[],"photos":[{"file":"media/ben_ali.jpg","alt":"Zine el-Abidine Ben Ali","credit":"Zine el-Abidine Ben Ali. Photo: CC BY 2.0.","info":"Ben Ali removed Bourguiba, then 84, by declaring him mentally unfit to rule. He then abolished the State Security Court, which had tried Ghannouchi in 1987, and had radio and television broadcast the Muslim call to prayer."}],"question":"What do you do in the 1989 election?","picks":[{"id":"s4_boycott","name":"Boycott the election","detail":"The regime refused you a license and the vote will not be fair. You keep your members out of sight."},{"id":"s4_run","name":"Run as independents across the country","detail":"You show your strength and that you accept elections, but the police learn who your people are."}],"why_min":10,"reveal":{"real_pick":"s4_run","bullets":["**April 1989.** Ennahda's members ran as independents. By official figures they won more than 10% of the vote but no seats. Under the electoral law, the list with the most votes in each district took every seat, so the ruling party took all of them. There are reports that the government also falsified the results. Police attended every Ennahda rally and photographed who was on the stage and in the crowd.","**1989.** Ghannouchi left Tunisia for exile. He lived in London until 2011.","After Ennahda's strong showing in the April 1989 election, Ben Ali ended the brief opening.","**February 1991.** Young Ennahda members attacked a local office of the RCD, Ben Ali's ruling party, in Bab Souika in Tunis, and killed a security guard. Government attempts to link Ennahda's senior leaders to the attack failed. In 2011 Ennahda said the young members had acted on their own.","**1991.** Ben Ali's government used the attack as a pretext to ban Ennahda and arrest thousands of its members. Some of its leaders went into exile. In August 1992 military courts sentenced 265 alleged Ennahda members to terms of 1 year to life in prison.","In these arrests the police used the names on Ennahda's license application and its electoral lists."],"class_link":{"text":["**Fear of repression.** The MTI renamed itself Ennahda to conform to a 1988 law that banned parties founded on religious or ethnic grounds, and it was still refused a license. Its members ran as independents in April 1989. In 1991 the government banned Ennahda and arrested thousands of its members, using the names on its license application and electoral lists to decide whom to arrest."],"reading":"Sources: Meddeb (2019), Grewal (2020), Wilson Center, Inter-Parliamentary Union.","title":"The explanations at this stage"},"real_label":"ran their members as independents across the country.","predict":{"question":"Before you read on: how did Ennahda's members do in 1989?","options":[{"text":"Under 5% of the vote and 2 seats, by official figures.","real":false,"where":"No. By official figures they won more than 10% of the vote, but no seats."},{"text":"More than 10% of the vote, but no seats, by official figures.","real":true,"where":""},{"text":"Most of the seats in the first round, and then the army stepped in.","real":false,"where":"Not in Tunisia. In Algeria, the Islamic Salvation Front won most seats in the first round in December 1991, and the army cancelled the second round."}]},"tag_options":["Votes","Fear of repression","Inclusion","Living in a secular democracy","None of them"],"tag_question":"Which explanation of moderation fits this stage best? Pick one, then discuss your reasons aloud."},"bullets":["**1984.** Bourguiba pardons Ghannouchi after 3 years in prison. Ghannouchi says he will accept democracy even if voters reject his party. He keeps the movement's leadership secret so that it can survive new arrests.","**1986.** The MTI and a secular party, the Socialist Democrats, boycott the parliamentary elections. They call them \"neither free nor fair.\"","**1987.** The regime bans Ghannouchi from preaching and publishing. He keeps preaching, and the police arrest him. A court sentences him to life at forced labor for leading an Iranian-backed plot to overthrow the government. Observers call it a show trial.","**November 1987.** Zine el-Abidine Ben Ali, the prime minister, removes Bourguiba (84), by having him declared medically unfit to rule. Ben Ali becomes president, opens up politics for a short time, and pardons Ghannouchi in May 1988.","**1989.** To comply with a 1988 law that bans religious parties, the MTI renames itself Ennahda (Renaissance). The government still refuses it a license.","**April 1989.** Parliamentary elections. Ennahda cannot run as a party."],"why_label":"Why? And name a risk to your choice."},{"id":"s5","kind":"stage","kicker":"Stage 5 of 10 · Tunisia · 1991 to 2011","headline":"Forming Tunisia's government, 2011","receipt_title":"Stage 5, forming a government, 2011","lede":"You lead Ennahda. It is October 2011, 9 months after Tunisians forced Ben Ali out.","panels":[{"title":"Parties","bullets":["**Ennahda.** The Islamist party. **89 seats.**","**Congress for the Republic (CPR).** Secular and left-wing, led by the human rights activist Moncef Marzouki. **29 seats.**","**Popular Petition.** A populist party, unknown before the election and led by a London-based millionaire. **26 seats.**","**Ettakatol.** Secular and center-left, led by Mustapha Ben Jaafar. **20 seats.**","**Progressive Democratic Party (PDP).** Secular and center-left. It campaigned on the claim that Ennahda would lead Tunisia back to the Middle Ages. **16 seats.**","**Democratic Modernist Pole.** A small alliance of parties, among them Ettajdid. Like the PDP, it campaigned on the claim that Ennahda would lead Tunisia back to the Middle Ages. **5 seats.**","**Others.** Independent lists and small parties. **32 seats.**"]}],"tiles":[{"value":"89 of 217","label":"Ennahda's seats in the assembly elected in October 2011. A majority needs 109.","source":"aljazeera_ennahda_results"}],"photos":[{"file":"media/tunis_vote_2011.jpg","alt":"Voting in Tunisia, October 2011","credit":"Voting in Tunisia's election, October 2011. Photo: Habib M'henni, CC BY-SA 3.0.","info":"Tunisia's first free election since independence in 1956, with about 4 million voters. Every party list had to alternate men and women candidates."},{"file":"media/tunisia_2011.jpg","alt":"Protest in Tunis, January 2011","credit":"Protest in Tunis, January 2011. Photo: VOA Photo/L. Bryant, public domain.","info":"The protests began after Mohamed Bouazizi, a fruit seller in Sidi Bouzid, set himself on fire on 17 December 2010. On 14 January Ben Ali and his family fled the country, into exile in Saudi Arabia."},{"file":"media/assembly_2011_seats.svg","alt":"Pie chart of seats in Tunisia's assembly elected in October 2011","credit":"Seats in the assembly elected in October 2011. Data: Al Jazeera, final results."}],"question":"How do you form a government?","picks":[{"id":"s5_minority","name":"Govern alone as a minority","detail":"You won more than 3 times as many seats as the next party. Keep all 3 top posts and find votes bill by bill."},{"id":"s5_cpr","name":"Govern with the CPR only","detail":"Together you hold 118 seats, a majority. Give the CPR 1 of the 3 top posts and keep the other 2."},{"id":"s5_troika","name":"Share power with the CPR and Ettakatol","detail":"Together you hold 138 seats, more than you need. Give them 2 of the 3 top posts."}],"why_min":10,"reveal":{"real_pick":"s5_troika","bullets":["**24 October 2011.** The day after the vote, Ali Laarayedh, a senior Ennahda leader, said the party was considering a coalition with Ettakatol and the CPR.","**November to December 2011.** The coalition, called the troika, took office. Mustapha Ben Jaafar of Ettakatol became head of the assembly in November. In December Moncef Marzouki of the CPR became president and Hamadi Jebali of Ennahda head of government."],"class_link":{"text":["**Fear of repression.** Before the October 2011 election, Ghannouchi pledged that Ennahda would govern in coalition even if it won a majority. Making the case for sharing power, Ennahda's leaders often cited Algeria in 1990 and 1991, where the military regime stopped elections that Islamists were winning and cracked down on them.","**Inclusion.** In 2005 Ennahda joined the CPR, Ettakatol, and other secular parties in the 18 October Collective. All of them, Ennahda included, backed Tunisia's liberal family code, and their joint statement said \"there can be no compulsion in religion.\" In 2011 Ennahda gave the CPR and Ettakatol 2 of the 3 top posts (the CPR got the presidency, Ettakatol the head of the assembly, and Ennahda the head of government)."],"reading":"Sources: Stepan (2012), Marks (2015), Carnegie (2014), Al Jazeera.","title":"The explanations at this stage"},"real_label":"shared power with the CPR and Ettakatol.","tag_options":["Votes","Fear of repression","Inclusion","Living in a secular democracy","None of them"],"tag_question":"Which explanation of moderation fits this stage best? Pick one, then discuss your reasons aloud."},"bullets":["**1991 to 2011.** Ennahda is split: one part in prison or underground in Tunisia, the other in exile.","**2005.** Ennahda joins secular opponents of Ben Ali in the 18 October Collective, a forum where opposition parties write joint positions on a future political system.","**January to March 2011.** Ennahda plays almost no part in the protests that force Ben Ali out on 14 January. Ghannouchi returns from London on 30 January. On 1 March the interim government legalizes Ennahda.","**23 October 2011.** Tunisians elect an assembly to write a new constitution. Ennahda wins 37% of the vote and 89 of 217 seats.","A majority needs 109 of 217 seats.","The 3 top posts are president, head of government, and head of the assembly."],"why_label":"Why? And name a risk to your choice."},{"id":"quiz1","kind":"custom","quiz":true,"text":"Quick check 1","kicker":"Quick check","headline":"Egypt or Tunisia?","receipt_title":"Quick check 1","lede":"Halfway point. For each fact, click the country it belongs to.","choices":["Egypt","Tunisia"],"items":[{"text":"The movement's leading thinker spent almost two years in the United States, part of it at a college.","answer":"Egypt","note":"Sayyid Qutb, 1948 to 1950. He came back condemning America."},{"text":"Young members of the movement attacked an office of the ruling party and killed a security guard.","answer":"Tunisia","note":"Bab Souika, February 1991."},{"text":"The police used the movement's own electoral lists to arrest its members.","answer":"Tunisia","note":"Ennahda, after 1989."},{"text":"The movement's leader answered from prison that no Muslim may declare another an unbeliever.","answer":"Egypt","note":"Hasan al-Hudaybi, answering Qutb."},{"text":"Islamist candidates ran as independents and won 88 seats, about a fifth of parliament.","answer":"Egypt","note":"The Brotherhood, 2005."},{"text":"Islamist candidates ran as independents, won more than 10% of the vote by official figures, and got no seats.","answer":"Tunisia","note":"Ennahda, April 1989."}]},{"id":"s7","kind":"stage","kicker":"Stage 6 of 10 · Tunisia · 2012","headline":"Islamic law in Tunisia's new constitution, 2012","receipt_title":"Stage 6, sharia and the constitution, 2012","lede":"You lead Ennahda, now heading the government. It is March 2012.","panels":[{"title":"Article 1 of Tunisia's 1959 constitution","bullets":["It says that Tunisia is a free, independent, and sovereign state and that its religion is Islam. It does not name Islam as a source of legislation."]}],"tiles":[],"photos":[{"file":"media/tunisia_assembly.jpg","alt":"Tunisia's National Constituent Assembly","credit":"Tunisia's National Constituent Assembly. Photo: Parti Mouvement Ennahdha, CC BY 2.0.","info":"Of the 49 women elected to the assembly in October 2011, 42 were Ennahda members. Before the election, Ennahda and most other main parties had agreed to finish the constitution within 1 year."}],"question":"What do you put in the constitution?","picks":[{"id":"s7_sharia","name":"Name sharia as a source of legislation","detail":"You satisfy Ellouze, Chourou, and the Salafis, and Ettakatol may leave your government."},{"id":"s7_article1","name":"Keep the old Article 1 and add nothing on sharia","detail":"You keep Ettakatol, and disappoint part of your base."}],"why_min":10,"reveal":{"real_pick":"s7_article1","bullets":["**November 2011.** Ghannouchi had already said that Article 1 would stay, with \"no other references to religion in the constitution.\"","**26 March 2012.** Ennahda announced that it would not include sharia. Article 1 stayed as it was.","**August 2012.** A draft article of the new constitution said that the roles of men and women \"should complement each other within the household,\" instead of calling them equal. Critics said it would weaken the equal rights women had held since 1956, and thousands marched in Tunis against it. Ennahda later replaced it with wording that guaranteed equality. It also agreed to drop a proposal to make blasphemy a crime."],"class_link":{"text":["**Living in a secular democracy.** Rached Ghannouchi, who had lived in exile in London, pledged to keep sharia out of the constitution.","**Fear of repression.** Grewal argues that having been in prison may heighten a person's fear of repression. Yet Habib Ellouze and Sadok Chourou, who had spent much of the previous 20 years in Tunisian prisons, still pushed for sharia.","**Inclusion.** Ennahda dropped sharia while its secular partner Ettakatol threatened to leave the government over it."],"reading":"Sources: Grewal (2020).","title":"The explanations at this stage"},"real_label":"kept the old Article 1 and added nothing on sharia.","tag_options":["Votes","Fear of repression","Inclusion","Living in a secular democracy","None of them"],"tag_question":"Which explanation of moderation fits this stage best? Pick one, then discuss your reasons aloud."},"bullets":["**Early 2012.** Two Ennahda leaders, Habib Ellouze and Sadok Chourou, who spent much of the previous 20 years in Tunisian prisons, push to name sharia, Islamic law, as a source of legislation.","**25 March 2012.** Salafi demonstrators in Tunis demand sharia.","Ennahda's coalition partner Ettakatol threatens to leave the government if sharia appears in the constitution in any form."],"why_label":"Why? And name a risk to your choice."},{"id":"s6","kind":"stage","kicker":"Stage 7 of 10 · Egypt · 2011 to 2012","headline":"The Brotherhood and the presidency, 2012","receipt_title":"Stage 7, the presidential race, 2012","lede":"You lead the Muslim Brotherhood. It is March 2012.","panels":[{"title":"Parties","bullets":["**Democratic Alliance.** Led by the Brotherhood's Freedom and Justice Party (FJP), which holds 213 of its seats. **235 seats.**","**Islamist Bloc.** Salafi parties led by Nour. **123 seats.**","**New Wafd.** Liberal and nationalist. **41 seats.**","**Egyptian Bloc.** Secular center-left and liberal parties, among them the Social Democrats and the Free Egyptians. **35 seats.**","**Wasat.** A moderate Islamist party, founded by young members who left the Brotherhood. **10 seats.**","**Revolution Continues.** A leftist alliance. **9 seats.**","**Reform and Development.** Liberal. **9 seats.**","**Parties of Mubarak's former ruling party.** Small parties formed by its former members. **17 seats.**","**Others.** Small parties and independents. **19 seats.**"]},{"title":"People and groups","bullets":["**SCAF.** The army's Supreme Council of the Armed Forces, which has ruled Egypt since Mubarak fell.","**Nour party.** A Salafi party."]}],"tiles":[],"photos":[{"file":"media/tahrir_2011.jpg","alt":"Tahrir Square, 2011","credit":"Tahrir Square, Cairo, 2011. Photo: Alisdare Hickson from Canterbury, United Kingdom, CC BY-SA 2.0.","info":"Crowds greet soldiers on 29 January 2011. Troops had been ordered onto the streets the day before. On 31 January the army said it \"will not resort to use of force against our great people.\""},{"file":"media/egypt_parliament_2011_seats.svg","alt":"Pie chart of seats in Egypt's lower house elected from November 2011 to January 2012","credit":"Elected seats in the lower house, November 2011 to January 2012. Data: Wikipedia, from official results."}],"question":"Do you run a candidate for president?","picks":[{"id":"s6_keep","name":"Keep the promise and stay out of the race","detail":"You reassure those who fear an Islamist takeover, and leave the presidency to someone else."},{"id":"s6_run","name":"Break the promise and run your own candidate","detail":"You lead the largest party in parliament and can win, but critics will say you cannot be trusted."}],"why_min":10,"reveal":{"real_pick":"s6_run","bullets":["**31 March 2012.** The Brotherhood's Shura Council, its internal governing body, voted 56 to 52 to run a candidate, breaking its promise.","**April 2012.** The election commission disqualified the Brotherhood's first choice, Khairat al-Shater, a businessman and Brotherhood leader. A law barred candidates for 6 years after their release from prison, and Shater had been released in March 2011. Mohamed Morsi, a Brotherhood leader and its back-up candidate, ran instead.","**May 2012.** About 23 million Egyptians voted in the first round. Morsi came first with about 5.8 million votes and Ahmed Shafiq second with about 5.5 million. The leftist Hamdeen Sabahi and Abdel Moneim Aboul Fotouh, a moderate who had left the Brotherhood, came close behind.","**14 June 2012.** The Supreme Constitutional Court ruled the parliamentary election law unconstitutional, because it let party members run for seats meant for independent candidates, and the Islamist-led lower house was dissolved. This was 2 days before the presidential run-off, the second round between the top 2 candidates.","**24 June 2012.** The election commission declared Morsi the winner of the run-off with 51.7% against Ahmed Shafiq, a former air force commander and Mubarak's last prime minister, whom many saw as the candidate of the old regime.","**12 August 2012.** Morsi retired the army's top 2 generals and made Abdel Fattah al-Sisi, the head of military intelligence, defense minister. He also canceled SCAF's 17 June amendment, which had kept control of the army for SCAF and given it a say over war and the new constitution."],"class_link":{"text":["**Votes.** After Mubarak fell in February 2011, the Brotherhood stopped using its traditional slogan, \"Islam is the solution,\" in favor of \"civil state.\" In the elections of November 2011 to January 2012 its party, the FJP, and its allies won 235 of 498 seats.","**Fear of repression.** On 31 March 2012 the Brotherhood's Shura Council voted 56 to 52 to run a candidate. A Brotherhood official said those against it feared the repercussions. Al Jazeera reported that the decision was likely to escalate the Brotherhood's confrontation with SCAF."],"reading":"Sources: Kantz Feder (2014), FairVote, Atlantic Council, Al Jazeera.","title":"The explanations at this stage"},"real_label":"ran their own candidate.","predict":{"question":"Before you read on: the Brotherhood's governing council, the Shura Council, voted on running a candidate. How did it vote?","options":[{"text":"100 to 8 to run.","real":false,"where":"No. The council was split almost in half: 56 to 52."},{"text":"56 to 52 to run.","real":true,"where":""},{"text":"58 to 50 against running, and the top leaders overruled it.","real":false,"where":"No. The council itself voted to run, 56 to 52."}]},"tag_options":["Votes","Fear of repression","Inclusion","Living in a secular democracy","None of them"],"tag_question":"Which explanation of moderation fits this stage best? Pick one, then discuss your reasons aloud."},"bullets":["**25 January to 11 February 2011.** Mass protests force Mubarak out. The Brotherhood does not organize the first protest but joins officially on 28 January. SCAF takes control.","**February 2011.** The Brotherhood promises not to run for president, to reassure progressives and Western countries that fear an Islamist takeover.","**Spring 2011.** It founds a party, the Freedom and Justice Party (FJP).","**November 2011 to January 2012.** In the lower house of parliament the FJP and its allies win 235 of 498 elected seats. The Salafi Nour party and its allies win 123. Liberal and secular parties together win just under 30% of the seats.","Parliament is now elected, but SCAF still holds the president's powers. It has promised to hand them to a civilian president once one is elected, in June 2012."],"why_label":"Why? And name a risk to your choice."},{"id":"s8","kind":"stage","kicker":"Stage 8 of 10 · Egypt · November to December 2012","headline":"Egypt's new constitution, 2012","receipt_title":"Stage 8, the constitution, 2012","lede":"You are President Mohamed Morsi, elected in June 2012, and the Brotherhood leaders who back him. It is November 2012.","panels":[],"tiles":[],"question":"How do you get the constitution through?","picks":[{"id":"s8_decree","name":"Bar the courts from overturning your decisions","detail":"No court can overturn your decisions until a constitution passes and a new parliament is elected. Expect street protests."},{"id":"s8_bargain","name":"Bargain with the opposition","detail":"Delay the referendum and reopen the panel to the parties and churches that left. The courts may dissolve it in the meantime."}],"why_min":10,"reveal":{"real_pick":"s8_decree","bullets":["**22 November 2012.** Morsi issued a declaration that barred co
