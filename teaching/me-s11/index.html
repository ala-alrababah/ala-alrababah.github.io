urts from challenging his decisions. Protesters in Tahrir Square called it a coup.","**5 to 6 December.** Clashes between his supporters and opponents outside the presidential palace killed 7 people and injured more than 770. 7 of his senior advisers resigned, 4 of them after the clashes.","**8 December.** Morsi annulled the declaration but kept the referendum date. A spokesman for the National Salvation Front, one of the largest opposition parties, called the annulment \"relatively meaningless.\"","**December 2012.** Like Egypt's 1971 constitution, the new one made the principles of sharia, Islamic law, the main source of legislation. Unlike it, the new constitution also defined those principles, using the terms of Islamic legal scholarship, and said al-Azhar, Egypt's leading center of Sunni Islamic learning, would be consulted on Islamic law. Voters approved it with 63.8% yes, on a turnout of 32.9%."],"class_link":{"text":["**Inclusion.** Here the cooperation broke down. By 17 November 2012 the secular and liberal members and the churches had left the panel writing the constitution, in protest at Islamist members' efforts to draft an \"Islamic\" constitution. Morsi kept the referendum date, and the main opposition parties rejected his call for dialogue.","**Votes.** The constitution Morsi pushed through did not play religion down. It defined the principles of sharia in the terms of Islamic legal scholarship and said al-Azhar would be consulted on Islamic law. Voters approved it with 63.8% yes, on a turnout of 32.9%.","**Discuss:** did the courts leave Morsi no other way, or did he choose not to share the writing of the constitution with his opponents?"],"reading":"Sources: Egypt Independent, Al Jazeera.","title":"The explanations at this stage"},"real_label":"Morsi barred the courts from overturning his decisions.","tag_options":["Votes","Fear of repression","Inclusion","Living in a secular democracy","None of them"],"tag_question":"Which explanation of moderation fits this stage best? Pick one, then discuss your reasons aloud.","photos":[{"file":"media/egypt_2012_protest.jpg","alt":"Protest in Cairo, 2012","credit":"Protest in Cairo, late 2012. Photo: Yuli Weeks for VOA, public domain.","info":"Opponents of the draft constitution on 12 December 2012, 3 days before voting began. In the clashes at the palace a week earlier, opponents chanted \"No to dictatorship\" and Morsi's supporters \"Defending Morsi is defending Islam.\""}]},"bullets":["**November 2012.** Secular and liberal members have left the panel writing the constitution or stopped taking part in it. They say its Islamist majority is drafting an \"Islamic\" constitution that gives the president too much power. On 17 November Egypt's churches withdraw their 3 members, saying the draft \"does not reflect the pluralistic identity of Egypt.\"","The courts have already dissolved the lower house. They may dissolve the panel next.","Once written, the constitution must pass a referendum, a national vote."],"photos":[],"why_label":"Why? And name a risk to your choice."},{"id":"s9","kind":"stage","kicker":"Stage 9 of 10 · Egypt · June to July 2013","headline":"Morsi and the army, 2013","receipt_title":"Stage 9, the army's ultimatum, 2013","lede":"You are President Mohamed Morsi and the Brotherhood leaders who back him. It is 1 July 2013.","panels":[],"tiles":[],"photos":[{"file":"media/june2013_march.jpg","alt":"Anti-Morsi march in Cairo, June 2013","credit":"Anti-Morsi march in Cairo, 28 June 2013. Photo: Lilian Wagdy, CC BY 2.0.","info":"Protesters march against Morsi in Cairo 2 days before the mass protests of 30 June, the first anniversary of the day he took office. Many protesters waved red cards and chanted \"irhal,\" Arabic for \"leave.\""}],"question":"What do you do in the 48 hours?","picks":[{"id":"s9_early","name":"Call an early presidential election","detail":"You give the protesters what they ask for and risk losing the presidency at the polls."},{"id":"s9_refuse","name":"Refuse to step down","detail":"You were elected a year ago. Giving way would show that protests and an army deadline can remove an elected president."},{"id":"s9_resign","name":"Resign now","detail":"You give up the presidency so the army does not move against you, and hope to keep the movement legal."}],"why_min":10,"reveal":{"real_pick":"s9_refuse","bullets":["**2 July.** In a speech, Morsi refused to resign. By the next day his supporters had vowed to \"face a coup with martyrdom.\"","**3 July.** As the deadline ran out, Morsi still refused to step down. His office proposed a consensus coalition government to oversee the next parliamentary election. The army removed him the same day and suspended the constitution. Sisi announced the removal on television beside the liberal leader Mohamed ElBaradei, the head of al-Azhar, and the Coptic pope, who leads Egypt's largest Christian church.","**14 August 2013.** Security forces broke up a pro-Morsi sit-in at Rabaa Square in Cairo, killing at least 817 people and likely more than 1,000.","**December 2013.** Egypt's interim government declared the Brotherhood a terrorist organization. In **June 2019** Morsi, by then a prisoner, collapsed in court and died."],"class_link":{"text":["**Fear of repression.** Given 48 hours by the army, Morsi refused to step down. The army removed him on 3 July 2013. On 14 August security forces killed at least 817 people at the Rabaa sit-in, and in December the government declared the Brotherhood a terrorist organization.","**Inclusion.** As the deadline ran out, Morsi's office offered a consensus coalition government to oversee the next parliamentary election. When Sisi announced Morsi's removal, the liberal leader Mohamed ElBaradei stood beside him.","**Discuss:** was the Brotherhood brought down by its own choices, or by an army that would have acted anyway?"],"reading":"Sources: BBC, Al Jazeera, NPR, Human Rights Watch.","title":"The explanations at this stage"},"real_label":"Morsi refused to step down.","tag_options":["Votes","Fear of repression","Inclusion","Living in a secular democracy","None of them"],"tag_question":"Which explanation of moderation fits this stage best? Pick one, then discuss your reasons aloud.","predict":{"question":"Before you read on: as the army's deadline ran out on 3 July, what did Morsi's office propose?","options":[{"text":"An early presidential election within 6 months.","real":false,"where":"No. His office proposed a consensus coalition government instead."},{"text":"A referendum on whether he should stay in office.","real":false,"where":"No. His office proposed a consensus coalition government instead."},{"text":"A consensus coalition government to oversee the next parliamentary election.","real":true,"where":""}]},"photos":[{"file":"media/rabaa.jpg","alt":"The Rabaa sit-in, 2013","credit":"The Rabaa sit-in, Cairo, 2013. Photo: H. Elrasam for VOA, public domain.","info":"Human Rights Watch used aerial photos to estimate that about 85,000 protesters were here on 2 August 2013. The organizers vowed to stay until Morsi was back in office."}]},"bullets":["**30 June 2013.** Mass protests against Morsi. The Tamarod campaign behind them wants an early presidential election.","**1 July 2013.** The army gives Morsi 48 hours to meet the protesters' demands.","Abdel Fattah al-Sisi, whom Morsi made defense minister, commands the army."],"why_label":"Why? And name a risk to your choice."},{"id":"s10","kind":"stage","kicker":"Stage 10 of 10 · Tunisia · 2012 to 2013","headline":"Tunisia after two assassinations, 2013","receipt_title":"Stage 10, the assassinations, 2013","lede":"You lead Ennahda. It is late July 2013. In Egypt, the army removed Morsi on 3 July.","panels":[{"title":"People","bullets":["**Chokri Belaid** and **Mohamed Brahmi.** Leftist politicians, killed in 2013. In March 2024 a Tunisian court sentenced 4 people to death and 2 to life in prison for Belaid's killing.","**Ansar al-Sharia.** A Salafi jihadist group."]}],"tiles":[],"photos":[{"file":"media/belaid_funeral.jpg","alt":"After Chokri Belaid's killing, February 2013","credit":"Tunis after Chokri Belaid's killing, February 2013. Photo: Emnamizouni, CC BY-SA 3.0.","info":"Belaid headed the leftist Democratic Patriots party and accused Ennahda of ignoring violence against secularists. His funeral drew one of the largest crowds in Tunisia's history."}],"question":"The opposition wants you out. What do you do?","picks":[{"id":"s10_hold","name":"Stay in government until the next election","detail":"You won the election. Forcing you out would be a coup.","others":{"who":"Egypt's Brotherhood, a few weeks earlier.","bullets":["Morsi refused to step down when the army gave him 48 hours.","The army removed him on 3 July 2013, and security forces killed at least 817 people at the Rabaa sit-in."]}},{"id":"s10_early","name":"Call early elections and stay in government until then","detail":"You let voters decide, before the constitution is finished."},{"id":"s10_handover","name":"Hand power to non-party experts","detail":"Agree with the opposition on a temporary government of non-party experts."}],"why_min":10,"reveal":{"real_pick":"s10_handover","bullets":["**29 July 2013.** The head of government, Ali Laarayedh, refused to resign and proposed an election for 17 December.","Days after Brahmi's killing, Ennahda's spokeswoman said: \"The Egyptian scenario indeed proves that the disruption of a political process only leads to further division, instability, chaos and violence.\"","**Early August 2013.** Rached Ghannouchi offered to bring opposition parties into a broader government. The opposition refused. On 6 August the assembly suspended its work.","**From August 2013.** Rached Ghannouchi held talks with Beji Caid Essebsi, leader of the secular Nidaa Tounes party. Tunisia's main trade union and 3 other groups that are not political parties, known together as the Quartet, ran a national dialogue, talks among the parties.","**Late September 2013.** Ennahda accepted the Quartet's plan: its government would resign and hand power to non-party experts. Rached Ghannouchi said later: \"We have exported revolution ... to Egypt, and we don't want to import from Egypt a coup.\"","**26 January 2014.** The assembly approved the constitution by a large majority. It named Islam as Tunisia's religion but not as a source of legislation, and guaranteed freedom of conscience, the freedom to hold any religion or none. On **29 January** Laarayedh handed power to a government of non-party experts."],"class_link":{"text":["**Fear of repression.** One analyst noted that Ennahda said the Rabaa killings in Egypt reminded them of the repression they had suffered under Ben Ali in the 1990s and made them fear it could happen again in Tunisia. Another analyst claimed that Ennahda \"didn't have to worry about the intervention of a powerful army.\" Ennahda agreed to resign and hand power to non-party experts.","**Inclusion.** In August 2013 Ghannouchi met Beji Caid Essebsi, leader of the secular Nidaa Tounes party, in Paris. The Quartet, formed in the summer of 2013, mediated among the parties. The constitution they agreed on in January 2014 guaranteed freedom of conscience (the freedom to hold any religion or none).","**Discuss:** did the compromise help Ennahda survive?"],"reading":"Sources: Marks (2015), Wilson Center, Al Jazeera, Nobel Prize.","title":"The explanations at this stage"},"real_label":"proposed an election for 17 December and offered a broader government, then agreed to hand power to non-party experts.","tag_options":["Votes","Fear of repression","Inclusion","Living in a secular democracy","None of them"],"tag_question":"Which explanation of moderation fits this stage best? Pick one, then discuss your reasons aloud.","actor":"Ennahda"},"bullets":["**2012.** Ennahda lets peaceful Salafis organize and tries to bring members of Ansar al-Sharia, the group the authorities later blamed in part for the killings below, into politics.","**14 September 2012.** Several hundred protesters, angry over an anti-Islam film made in the United States, storm the US embassy compound in Tunis, and 4 people die. Members of Ansar al-Sharia take part.","**6 February 2013.** Gunmen shoot dead Chokri Belaid, a leftist opposition leader, in his car outside his home. That day Hamadi Jebali, Ennahda's head of government, proposes a cabinet of non-party experts. Ennahda refuses. Jebali resigns on 19 February, and Ali Laarayedh replaces him.","**25 July 2013.** Gunmen shoot dead Mohamed Brahmi, a leftist member of the assembly and a critic of Ennahda, outside his house. The government blames radical extremists, some from Ansar al-Sharia, for both killings. The opposition demands that the government resign."],"why_label":"Why? And name a risk to your choice."},{"id":"quiz2","kind":"custom","quiz":true,"text":"Quick check 2","kicker":"Quick check","headline":"Egypt or Tunisia?","receipt_title":"Quick check 2","lede":"Last step before your file. For each fact, click the country it belongs to.","choices":["Egypt","Tunisia"],"items":[{"text":"The Islamist party's own head of government proposed a cabinet of non-party experts, and the party refused.","answer":"Tunisia","note":"Jebali and Ennahda, February 2013."},{"text":"The movement's governing council voted, by a margin of 4 votes, to break a public promise.","answer":"Egypt","note":"The Brotherhood's Shura Council, 56 to 52, March 2012."},{"text":"The new constitution said a leading center of Islamic learning would be consulted on Islamic law.","answer":"Egypt","note":"Al-Azhar, in the constitution of December 2012."},{"text":"The Islamist leader's office offered to bring other parties into government, and the army removed him the same day.","answer":"Egypt","note":"Morsi's office, 3 July 2013."},{"text":"Thousands marched against a draft article saying that the roles of men and women complement each other within the household.","answer":"Tunisia","note":"Tunis, August 2012."},{"text":"The Islamist-led government offered to bring other parties into government, was refused, and months later agreed to resign.","answer":"Tunisia","note":"Ennahda, July to October 2013."}]},{"id":"receipt","kind":"receipt","title":"Egypt and Tunisia: Your choices","shot_note":"Click Download to get a text file. Open it, add the names of everyone in your group at the top, and upload it to Blackboard. Or click Copy and paste the text into Blackboard, with everyone's name at the top.","grade_note":"None of these choices is graded."}],"how_it_works":{"intro":"This page tells the real history of two Islamist movements. At each stage your group makes a choice, and then sees what really happened. This exercise is inspired by John Holbein's President's Budget simulation (johnholbein.org/teaching-activities/presidents-budget).","model_note":"Nothing on this page is graded.","notes":[]},"reference":{"title":"The case","sections":[{"title":"What moderation means","items":["An Islamist party moderates when it accepts two basic rules of democracy, even if it keeps a religious identity. First, laws are made by elected representatives, and no religious authority can overrule them. Second, everyone is free to practice any religion, any version of Islam, or none. Scholars have proposed 4 explanations for why Islamist parties moderate."]},{"title":"4 explanations for moderation","items":["**Votes.** To win elections, a party plays down religion to reach voters beyond its religious base and make alliances with other parties.","**Fear of repression.** Under a dictatorship, a party softens its program and avoids confronting the regime, so that the regime does not ban it or jail its members. The aim is to keep the organization alive, not to win votes.","**Inclusion.** When Islamists take part in politics, they must work with people who think very differently (for example, in parliament, in election alliances, at universities, and in civic groups). This contact can make them more tolerant of other views and more accepting of pluralism, the idea that many different views can coexist.","**Living in a secular democracy.** Islamists who studied or lived in exile in Western democracies saw democracy and religious freedom work in practice, met non-Muslims, and learned that a secular state need not repress religion. They tended to come back more accepting of secular democracy than those who stayed home."],"numbered":true},{"title":"Kinds of Islamist movements","items":["**Islamists.** People and groups who want their vision of Islam to shape the state, the law, or society, for example by basing laws on sharia, and who organize to pursue that goal. Devout Muslims are not necessarily Islamists.","**The Muslim Brotherhood.** Founded in Egypt in 1928. It combines preaching, social services, and running in elections. It inspired movements elsewhere, among them Ennahda.","**Salafis.** Sunni Muslims who try to follow \"the pious predecessors,\" the first generations of Muslims, as closely as possible, and reject practices they see as later additions. Many, called quietists, focus on preaching and teaching and stay out of political activism. Some form parties, like Egypt's Nour. A minority, such as al-Qaeda, use violence.","**Muslim Democrats.** Islamists who keep a religious identity but accept secular democracy: laws are made by elected representatives, and everyone may practice any religion or none. The name echoes Europe's Christian Democratic parties."]},{"title":"Terms","items":["**Sharia.** Islamic law: God's law for Muslims as found in the Quran and the Sunna, the Prophet Muhammad's sayings and practice. It covers worship as well as family, trade, and crime. Scholars interpret it in many different ways, so \"applying sharia\" can mean very different things.","**Secular.** Keeping religion separate from the state: religious authorities do not control the laws or the courts, and the state does not impose a religion.","**Civil state.** The term many Arab parties use instead of \"secular,\" because the Arabic word for secularism can sound anti-religious. It usually means a state run neither by the army nor by clerics.","**Jihad.** Arabic for \"effort\" or \"struggle.\" It can mean a Muslim's inner struggle to do right and avoid wrong, or armed fighting. Qutb argued that much of Muslim society was Muslim only in name and that those who stood in the way of God's rule were legitimate targets of armed jihad. Later armed Islamist groups took up this idea.","**Referendum.** A vote in which all voters decide a single question directly, such as whether to approve a new constitution.","**Run-off.** A second round of voting, held when no candidate wins a majority in the first round, usually between the top 2 candidates."]},{"title":"Other paths: Algeria","open_after":"s4","items":["**December 1991.** The Islamic Salvation Front (FIS) won 188 of the 231 seats decided in the first round. **January 1992.** The army cancelled the second round, which led to a civil war. In 2005 the government acknowledged 150,000 deaths."]},{"title":"Other paths: Turkey and Morocco","items":["**Turkey.** In 1997 the army forced a government led by the Islamist Welfare Party out of power. In 2001 Erdogan founded the AKP with former Welfare members. It won the 2002 election.","**Morocco.** The Islamist PJD led the government under the king from 2011 to 2021, fell to 13 seats in 2021, and won 54 in September 2026 by provisional results."]},{"title":"Ennahda after 2013","open_after":"s10","items":["**4 January 2014.** The assembly voted on making the Quran and the Sunna, the sayings and practice of the Prophet Muhammad, the main sources of legislation. Ennahda asked its members to abstain. Of Ennahda's 89 members of the assembly, 38 abstained, 22 voted for, 17 against, and 12 were absent. The proposal failed.","**October 2014.** Ennahda came second in the election and joined the governing coalition.","**May 2016.** 93.5% of the party's delegates voted to separate the party's political activity from its religious activity. Ennahda said it was no longer an Islamist party but a party of Muslim Democrats.","**2021 to 2026.** On 25 July 2021 President Kais Saied dismissed the head of government and suspended parliament. Critics called it a coup. In April 2023 security forces arrested Ghannouchi at his home, and in June 2026 a court sentenced him to life in prison plus 30 years on terrorism-related charges."]},{"title":"Egypt after 2013","open_after":"s9","items":["**2014 to 2016.** Mohamed Kamal, a member of the Brotherhood's top leadership, approved limited violent action in early 2014. In spring 2015 older leaders began to speak of non-violence and accused Kamal's wing of abandoning it, and the leadership split into quarreling factions.","Courts sentenced hundreds to death in mass trials, among them the head of the Brotherhood, Mohamed Badie. Security forces arrested tens of thousands of government critics."]}]},"no_names":true,"glossary":[{"term":"Hasan al-Banna","info":"A schoolteacher who founded the Muslim Brotherhood in 1928 and led it until 1949. The Brotherhood held that there could be no Islamic society without an Islamic state. But in the 1930s and 1940s, al-Banna sought to reform society through education and to gain influence within the existing government."},{"term":"Sayyid Qutb","info":"An Egyptian writer who became the Muslim Brotherhood's chief thinker. Arrested and tortured in 1954, he was sentenced to life in prison, and his prison writings show his views hardening."},{"term":"Qutb","info":"An Egyptian writer who became the Muslim Brotherhood's chief thinker. Arrested and tortured in 1954, he was sentenced to life in prison, and his prison writings show his views hardening."},{"term":"Hasan al-Hudaybi","info":"The Muslim Brotherhood's leader after al-Banna, a respected judge from outside the movement. The Brotherhood chose him as a gesture to the king and to keep any one faction from dominating. His book Preachers, Not Judges refuted Qutb's ideas without naming him."},{"term":"Gamal Abdel Nasser","info":"An army colonel who led the Free Officers, the group that forced King Farouk from power in July 1952, and then ruled Egypt until 1970. According to fellow plotters, he had secretly promised the Brotherhood to impose sharia, Islamic law. Instead, the two became rivals."},{"term":"Anwar Sadat","info":"Egypt's president from 1970 and one of the Free Officers who took power in 1952. He had been the Free Officers' link to the Brotherhood. After the 1954 crackdown, he was one of the 3 judges who tried Sayyid Qutb."},{"term":"Hosni Mubarak","info":"Sadat's successor as Egypt's president, from 1981 to 2011. After taking office, he gave the Brotherhood more freedom, and its membership soared."},{"term":"Mohamed Morsi","info":"A Brotherhood leader who headed its Freedom and Justice Party and won Egypt's presidency in June 2012. He earned an engineering PhD in California in 1982 and taught there until 1985. On winning, he resigned as party head and left the Brotherhood, saying, \"I am president for all Egyptians.\""},{"term":"Abdel Fattah al-Sisi","info":"Egypt's defense minister and commander of the armed forces from August 2012. Before that, he headed military intelligence and was the youngest member of SCAF, the army council that ruled Egypt after Mubarak fell."},{"term":"Khairat al-Shater","info":"The Muslim Brotherhood's deputy leader, a businessman said to be its main funder. He resigned the post in March 2012 to run as its presidential candidate. He had left prison in March 2011, and a law barred candidates until 6 years after release or pardon."},{"term":"Ahmed Shafiq","info":"Mubarak's last prime minister and Morsi's opponent in the June 2012 presidential run-off. A former air force commander and longtime friend of Mubarak, he campaigned on a promise to restore stability. Egypt's Christians mostly backed him."},{"term":"Habib Bourguiba","info":"Tunisia's first president, who ruled from independence in 1956 until 1987. In 1975 he was declared president for life. His ruling party had badly weakened the labor unions and the secular opposition."},{"term":"Zine el-Abidine Ben Ali","info":"President of Tunisia from 1987 to 2011. Before that he headed Tunisia's military security and then its national security, and put down the unrest of 1978 and 1984. In 1988, after saying he would ease Bourguiba's measures against the opposition, he signed a national pact with opposition leaders."},{"term":"Ben Ali","info":"President of Tunisia from 1987 to 2011. Before that he headed Tunisia's military security and then its national security, and put down the unrest of 1978 and 1984. In 1988, after saying he would ease Bourguiba's measures against the opposition, he signed a national pact with opposition leaders."},{"term":"Rached Ghannouchi","info":"Leader and co-founder of the Islamist movement that became Ennahda. After the army crushed a general strike in January 1978, he concluded that \"remaining on the sidelines\" had cut the movement off from the young, workers, and the poor. In the main trade union, he preached that Islam is not only prayer and fasting but activism \"on the side of the poor and the oppressed.\""},{"term":"Ghannouchi","info":"Leader and co-founder of the Islamist movement that became Ennahda. After the army crushed a general strike in January 1978, he concluded that \"remaining on the sidelines\" had cut the movement off from the young, workers, and the poor. In the main trade union, he preached that Islam is not only prayer and fasting but activism \"on the side of the poor and the oppressed.\""},{"term":"Abdelfattah Mourou","info":"Co-founder, with Ghannouchi, of the Islamist movement that became Ennahda, and a lawyer. Sayida Ounissi, an Ennahda member of parliament, says his \"spiritual father\" was not Sayyid Qutb but Hmed Ben Miled, a scholar from the Islamic university Zaytouna who supported the institutions of the modern Tunisian state."},{"term":"Hamadi Jebali","info":"Ennahda's secretary-general and Tunisia's head of government from December 2011. Like most Ennahda leaders who stayed in Tunisia, he was in prison for most of the years from 1991 to 2011. The analyst Duncan Pickard wrote that he was known as \"conciliatory and an avoider of conflict.\""},{"term":"Ali Laarayedh","info":"A senior Ennahda leader, Tunisia's interior minister from December 2011, and head of government from 2013. A state security court under Bourguiba sentenced him to death in 1987. Under Ben Ali he served 14 years in prison, more than 11 of them in solitary confinement."},{"term":"Beji Caid Essebsi","info":"Leader of Nidaa Tounes, \"the Call of Tunisia,\" a secular party founded in 2012 to oppose Ennahda. He had been Bourguiba's interior minister and led Tunisia's interim government in 2011. In 2013 he called for dissolving the assembly elected under that government."},{"term":"Habib Ellouze","info":"An Ennahda leader and, after 2011, the most outspoken figure in its conservative wing. He was a founding member of the MTI in 1981. A member of Ennahda's policymaking council said in 2013 that Ellouze and Chourou were \"the big voices\" for sharia and \"managed to persuade more people.\""},{"term":"Special Apparatus","info":"The Muslim Brotherhood's secret armed wing, whose members fought British rule. Al-Banna set it up around 1940, and his control over it was weak. In the 1948 war with Israel, militant members refused his deal with the government to merge the Brotherhood's fighters into Egypt's army."},{"term":"Milestones","info":"A manifesto by Sayyid Qutb, in Arabic Ma'alim fi al-Tariq. It called for a vanguard, a group that leads the way, to start an Islamic revival in a Muslim country. Egypt soon banned it, and anyone caught with a copy could be charged with sedition, stirring up revolt."},{"term":"Wasat","info":"A party that younger Muslim Brotherhood members, led by Abu al-Ila Madi, founded in 1996. It included Christians and backed equality between men and women. The government turned down its requests for a party license in 1996, 1998, 2004, and 2009."},{"term":"New Wafd","info":"A secular party, founded in 1978 by Fuad Serag al-Din and Ibrahim Farag to revive the Wafd, which had championed Egypt's independence and won every free election before 1952. In 1984 it took only 18 of some 70 proposed Brotherhood candidates, and put only 8 in winnable list positions."},{"term":"SCAF","info":"The Supreme Council of the Armed Forces, a council of senior military leaders that took power when Mubarak fell in February 2011. Its head, Hussein Tantawi, had been Mubarak's defense minister for 2 decades. It promised to hand power to civilians in June 2012, once a president was elected."},{"term":"Freedom and Justice Party","info":"The Muslim Brotherhood's political party, formed in 2011. Parties with a religious identity were still banned, so the Brotherhood registered it as a \"civil\" party. Its platform called for a parliamentary system, with a government led by a prime minister and only a symbolic role for the president."},{"term":"Nour party","info":"A Salafi party, founded in 2011 as the political wing of the Salafist Call. It left the Democratic Alliance, formed by the Brotherhood's party, in September 2011 and became the largest party in the Islamist Alliance. It officially supports democracy, but senior members have called democracy apostasy, abandoning Islam."},{"term":"Tamarod","info":"A petition campaign against Morsi, set up by opposition activists in late April 2013. Its name is Arabic for \"rebellion.\" The petition blamed Morsi for failing to restore security and fix the economy, and by late June the campaign claimed 22 million signatures, which cannot be verified."},{"term":"al-Azhar","info":"A mosque and university in Cairo, founded in 970, Egypt's leading center of Sunni Islamic learning. In 2010 Mubarak made Ahmed al-Tayeb its head, the Grand Imam. Tayeb was a member of Mubarak's ruling party and at first refused to quit it, saying the two roles did not conflict."},{"term":"Tahrir Square","info":"A square in Cairo, the heart of the 2011 revolution that forced Mubarak out. During those protests, Brotherhood members kept their group's slogans out of the square but brought food and water and set up checkpoints to keep pro-government forces out."},{"term":"MTI","info":"The Islamic Tendency Movement, the party Ghannouchi and Mourou founded in April 1981, which called itself \"a political movement based on Islam.\" A government spokesman called it an Iranian puppet. After the July 1981 arrests, non-Islamist groups, among them the Communist Party, rallied behind Ghannouchi."},{"term":"troika","info":"The 3-party coalition of Ennahda, the CPR, and Ettakatol that governed Tunisia from late 2011. Ennahda also offered ministries to other party leaders, such as Hamma Hammami of the Workers' Party, who refused. Only the CPR and Ettakatol, which had not run hard anti-Islamist campaigns, agreed."},{"term":"Congress for the Republic","info":"A secular, left-wing party founded in 2001 by Moncef Marzouki, a human rights activist and critic of Ben Ali. Ben Ali banned it in 2002. Marzouki's human rights record and his support for Arab unity drew supporters from the left, from nationalists, and from people leaning toward Islamism."},{"term":"Ettakatol","info":"The Democratic Forum for Labor and Liberties, a secular, center-left party founded by Mustapha Ben Jaafar in 1994. Before the 2011 election it proposed a unity government of secular and Islamist parties. In the campaign, Ben Jaafar defended its secular character more clearly than the CPR's leader, Marzouki."},{"term":"18 October Collective","info":"A coalition of Islamists, secularists, and communists against Ben Ali's dictatorship, named after a hunger strike that 8 opposition and civic figures began on 18 October 2005. In joint statements, all its parties, Ennahda included, backed Tunisia's liberal family law and the right to hold any religion or none."},{"term":"Ansar al-Sharia","info":"A Salafi jihadist group, its name Arabic for \"supporters of Islamic law,\" founded in April 2011 by Abu Iyadh, who had fought against the United States in Afghanistan. It said it opposed democracy because democracy went against Islam and put men on the same level as God."},{"term":"Quartet","info":"Tunisia's main trade union, employers' union, Human Rights League, and Order of Lawyers. They formed the Quartet in summer 2013, when the move to democracy was in danger of collapsing. The trade union backed the opposition's demand for a new government but not for dissolving the assembly."},{"term":"Salafis","info":"Sunni Muslims who try to follow al-salaf al-salih, Arabic for \"the pious predecessors,\" the first generations of Muslims. Salafis have generally rejected taking part in democracy because it does not rest on God's sovereignty, and they fault the Muslim Brotherhood for embracing it."},{"term":"Salafi","info":"Sunni Muslims who try to follow al-salaf al-salih, Arabic for \"the pious predecessors,\" the first generations of Muslims. Salafis have generally rejected taking part in democracy because it does not rest on God's sovereignty, and they fault the Muslim Brotherhood for embracing it."},{"term":"sharia","info":"Islamic law, which Muslims see as God's law and as unchanging. Fiqh, the scholars' work of spelling out its rules, is open to debate, reinterpretation, and change."},{"term":"Sunni","info":"The larger of Islam's two main branches, the other being Shia. The split began over who should lead Muslims after the Prophet Muhammad died in 632. Sunnis are the majority of Muslims in Egypt and Tunisia, as in all but a few countries."},{"term":"Sunna","info":"The Prophet Muhammad's sayings and practice, which with the Quran express God's will, the basis of sharia. It is known through hadith, stories about the Prophet passed down orally and written down 1 to 2 centuries after his death. Not all scholars agreed on which stories were certainly true."},{"term":"Personal Status Code","info":"Tunisia's family law of 1956, a key piece of women's rights legislation under Bourguiba. It still said a wife should \"obey\" her husband and left sharia inheritance rules in place. Ghannouchi criticized the code, raising doubts among progressive Tunisians about how free women would be under his movement."},{"term":"Ramadan","info":"The Islamic month of fasting, whose fast is among the 5 pillars of Islam. From 1960 Bourguiba urged Tunisians to break the fast to fight poverty. The Tunisian journalist Ahmed Nadhif writes that this call to break the fast shocked most Tunisians and helped spark the Islamic revival that led the opposition in the 1970s."},{"term":"British control","info":"British rule over Egypt, which began when Britain occupied the country in 1882. In 1922 Britain declared Egypt independent but kept the final say over its foreign relations, communications, military, and Sudan. Only in 1954 did Britain agree to withdraw its last troops, within 20 months."}]};
window.LOCKED = {};
</script>
<script>/* ui.js — everything the student sees and clicks.

   The pure logic lives in core.js; this file renders screens, keeps the state
   in localStorage, opens the locked screens when the classroom code is typed,
   plays the surprise, and writes the receipt. It touches no network: there is
   no fetch, no font, and no image that is not beside the page. */
(function (root) {
  "use strict";

  const CORE = root.SIMCORE;
  const RULES = root.RULES || {};
  const DATA = root.DATA;
  const LOCKED = root.LOCKED;
  const KEY = "sim:" + DATA.id;

  let state = CORE.emptyState(DATA.build);
  let screens = [];
  let opened = null;          // the after-screens, once the code is in
  let soundOn = false;
  let stageRun = 0;

  /* ---------------------------------------------------------------- tools */
  const $ = (sel, node) => (node || document).querySelector(sel);
  const $$ = (sel, node) => Array.prototype.slice.call((node || document).querySelectorAll(sel));

  /* A photo can carry "info": more about who or what it shows. It opens over the
     photo on hover, on keyboard focus, and on a tap (phones have no hover). */
  function addInfo(figure, p) {
    if (!p || !p.info) return;
    figure.classList.add("hasinfo");
    figure.tabIndex = 0;
    figure.setAttribute("aria-label", (p.alt || "") + ". " + p.info);
    const box = el("div", "photoinfo", rich(p.info));
    figure.appendChild(box);
    figure.addEventListener("click", () => figure.classList.toggle("open"));
  }

  /* Glossary terms already explained on the screen being drawn. */
  let glossShown = new Set();

  function el(tag, cls, html) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (html != null) node.innerHTML = html;
    return node;
  }

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function fromBase64(value) {
    const binary = atob(value);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  function notice(text, kind) {
    const node = $("#notice");
    if (!node) return;
    if (!text) { node.hidden = true; node.textContent = ""; return; }
    node.className = "notice" + (kind ? " " + kind : "");
    node.textContent = text;
    node.hidden = false;
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (err) {
      notice("This browser is not saving your work. Keep the tab open until you have copied your answers.", "warn");
    }
  }

  function load() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (err) { saved = null; }
    const restored = CORE.restore(saved, DATA.build);
    if (restored.dropped) {
      notice("This page was rebuilt since you last opened it, so the earlier answers were cleared.", "warn");
    }
    return restored.state;
  }

  function rule(name, extra) {
    return CORE.run(RULES, name, state, dataForRules(), extra);
  }

  /* Rules see the screens that are open. Before the code, the locked screens
     are not there, which is also true for the student. */
  function dataForRules() {
    return Object.assign({}, DATA, { screens: screens });
  }

  function screenById(id) {
    for (let i = 0; i < screens.length; i += 1) if (screens[i].id === id) return screens[i];
    return null;
  }

  function optionById(id) {
    return CORE.index(dataForRules())[id] || null;
  }

  function value(spec) {
    if (!spec) return "";
    const raw = spec.rule ? rule(spec.rule) : spec.value;
    if (raw && typeof raw === "object") return String(raw.text == null ? "" : raw.text);
    const body = CORE.formatValue(raw, spec.format, spec.digits);
    return (spec.prefix || "") + body + (spec.suffix ? " " + spec.suffix : "");
  }

  function sourceLine(id) {
    const source = (DATA.sources || []).filter(s => s.id === id)[0];
    return source ? source.text : "";
  }

  /* ------------------------------------------------------------ the shell */
  function go(id) {
    state.screen = id;
    save();
    render();
    window.scrollTo({ top: 0, behavior: "instant" });
  }

  function currentScreen() {
    return screenById(state.screen) || screens[0];
  }

  function render() {
    glossShown = new Set();
    const screen = currentScreen();
    const app = $("#app");
    app.innerHTML = "";
    const kinds = {
      brief: renderBrief, choose: renderChoose, hold: renderHold, respond: renderRespond,
      write: renderWrite, outcome: renderOutcome, receipt: renderReceipt, surprise: renderSurpriseGate,
      custom: renderCustom, stage: renderStage, record: renderRecord, quiz: renderQuiz
    };
    (kinds[screen.kind] || renderCustom)(screen, app);
  }

  function nextScreenId(id) {
    for (let i = 0; i < screens.length; i += 1) {
      if (screens[i].id === id && screens[i + 1]) return screens[i + 1].id;
    }
    return id;
  }

  function panel(title, meta) {
    const box = el("section", "panel");
    const head = el("div", "panel-h");
    head.appendChild(el("span", null, esc(title)));
    if (meta) head.appendChild(el("span", "mono", esc(meta)));
    box.appendChild(head);
    const body = el("div", "panel-b");
    box.appendChild(body);
    return { box: box, body: body };
  }

  /* ------------------------------------------------------------ 1. brief */
  function renderBrief(screen, app) {
    const wrap = el("div", "stagewrap brief");
    if (screen.kicker) wrap.appendChild(el("p", "kicker", esc(screen.kicker)));
    wrap.appendChild(el("h1", null, esc(screen.headline)));
    if (screen.lede) wrap.appendChild(el("p", "lede", esc(screen.lede)));

    const columns = el("div", "brief-main");
    const left = el("div", "brief-copy");

    if (screen.memo) {
      const memo = el("div", "memo");
      const head = el("dl", "memo-h");
      [["To", screen.memo.to], ["From", screen.memo.from], ["Re", screen.memo.re]].forEach(pair => {
        if (!pair[1]) return;
        const row = el("div");
        row.appendChild(el("dt", null, esc(pair[0])));
        row.appendChild(el("dd", null, esc(pair[1])));
        head.appendChild(row);
      });
      memo.appendChild(head);
      (screen.memo.paragraphs || []).forEach(p => memo.appendChild(el("p", null, esc(p))));
      left.appendChild(memo);
    }

    if (screen.steps && screen.steps.length) {
      const steps = el("div", "steps");
      steps.appendChild(el("h2", null, "What your group does"));
      const list = el("ol");
      screen.steps.forEach(s => list.appendChild(el("li", null, esc(s))));
      steps.appendChild(list);
      if (screen.deliverable) steps.appendChild(el("p", "deliverable", esc(screen.deliverable)));
      if (screen.grade_note) steps.appendChild(el("p", "grade-note", esc(screen.grade_note)));
      left.appendChild(steps);
    }

    (screen.panels || []).forEach(p => {
      const box = panel(p.title, p.meta);
      const list = el(p.numbered ? "ol" : "ul"); // "numbered": true draws a numbered list (5 Oct 2026)
      (p.bullets || []).forEach(b => list.appendChild(el("li", null, rich(b))));
      box.body.appendChild(list);
      left.appendChild(box.box);
    });

    if (screen.tiles && screen.tiles.length) {
      const tiles = el("div", "tiles");
      screen.tiles.forEach(t => {
        const tile = el("div");
        tile.appendChild(el("span", "n", esc(t.value)));
        tile.appendChild(el("span", "k", esc(t.label)));
        if (t.source) tile.appendChild(el("span", "src", esc(sourceLine(t.source))));
        tiles.appendChild(tile);
      });
      left.appendChild(tiles);
    }
    columns.appendChild(left);

    if (screen.photos && screen.photos.length) {
      const right = el("div", "brief-photos");
      screen.photos.forEach(p => {
        const figure = el("figure");
        const img = el("img");
        img.src = p.file;
        img.alt = p.alt || "";
        figure.appendChild(img);
        addInfo(figure, p);
        figure.appendChild(el("figcaption", null, esc(p.credit || "")));
        right.appendChild(figure);
      });
      columns.appendChild(right);
    }
    wrap.appendChild(columns);

    if (DATA.no_names) {
      const start = el("div", "startrow");
      const go1 = el("button", "btn big", esc(screen.start_label || "Start"));
      go1.type = "button";
      go1.addEventListener("click", () => go(nextScreenId(screen.id)));
      start.appendChild(go1);
      wrap.appendChild(start);
      app.appendChild(wrap);
      return;
    }
    const start = el("div", "startrow");
    const label = el("label", null, esc(screen.names_label || "Every student's name in your group"));
    label.setAttribute("for", "names");
    const hint = el("p", "hint", esc(screen.names_hint
      || "Separate them with commas. Every name here goes on what you hand in."));
    const box = el("textarea");
    box.id = "names";
    box.rows = 2;
    box.placeholder = "Amal Hourani, Rami Odeh, Sara Nasser";
    box.value = state.names || "";
    const said = el("p", "namemsg");
    const button = el("button", "btn big", "Start");
    button.type = "button";

    function paintNames() {
      const names = CORE.nameList(box.value);
      button.disabled = names.length < 2;
      said.textContent = names.length >= 2
        ? names.length + " names"
        : (box.value.trim() ? "Add the rest of the group, separated by commas." : "");
    }
    box.addEventListener("input", () => {
      state.names = box.value;
      paintNames();
      save();
    });
    button.addEventListener("click", () => go(nextScreenId(screen.id)));
    paintNames();
    start.appendChild(label);
    start.appendChild(hint);
    start.appendChild(box);
    start.appendChild(said);
    start.appendChild(button);
    wrap.appendChild(start);
    app.appendChild(wrap);
  }

  /* ----------------------------------------------------------- 2. choose */
  function renderChoose(screen, app) {
    const wrap = el("div", "choosewrap");
    const head = el("div", "stagewrap");
    if (screen.intro) head.appendChild(el("p", "lede", esc(screen.intro)));
    wrap.appendChild(head);

    const grid = el("div", "choose");
    const list = el("div", "options");
    const cats = screen.categories && screen.categories.length
      ? screen.categories
      : [{ id: null, name: "" }];

    cats.forEach(cat => {
      if (cat.name) {
        const catHead = el("div", "cat");
        catHead.appendChild(el("h2", null, esc(cat.name)));
        if (cat.note) catHead.appendChild(el("p", "catnote", esc(cat.note)));
        list.appendChild(catHead);
      }
      (screen.options || [])
        .filter(o => (cat.id == null ? true : o.category === cat.id))
        .forEach(option => list.appendChild(optionCard(option, screen)));
    });
    grid.appendChild(list);
    grid.appendChild(scoreboard(screen));
    wrap.appendChild(grid);

    const bar = el("div", "submitbar");
    const count = el("span", "mono", esc(CORE.chosen(state, dataForRules()).length + " chosen"));
    const submit = el("button", "btn", esc(screen.submit_label || "Submit"));
    submit.type = "button";

        return;
      }
      notice("");
      go(nextScreenId(screen.id));

    bar.appendChild(count);
    bar.appendChild(submit);

  function optionCard(option, screen) {
    const on = state.choices[option.id] != null;
    const card = el("div", "opt" + (on ? " on" : ""));
    const row = el("div", "oh");

    const tick = el("button", "chk", on ? "✓" : "");
    tick.type = "button";
    tick.setAttribute("aria-pressed", on ? "true" : "false");
    tick.setAttribute("aria-label", (on ? "Remove " : "Add ") + option.name);
    tick.addEventListener("click", () => {
      if (state.choices[option.id] != null) delete state.choices[option.id];
      else state.choices[option.id] = option.high == null ? 1 : 0.5;
      save();
      render();
    });
    row.appendChild(tick);

    const body = el("div", "obody");
    const details = el("details");
    const summary = el("summary");
    summary.appendChild(el("span", "otitle", esc(option.name)));
    details.appendChild(summary);
    if (option.description) details.appendChild(el("p", "odesc", esc(option.description)));
    (option.detail || []).forEach(d => {
      const line = el("p", "odetail");
      line.appendChild(el("strong", null, esc(d.label) + ": "));
      line.appendChild(document.createTextNode(d.text));
      details.appendChild(line);
    });
    if (option.source) details.appendChild(el("p", "osource", esc(sourceLine(option.source))));
    body.appendChild(details);

    if (option.tags && option.tags.length) {
      const tags = el("div", "otags");
      option.tags.forEach(t => tags.appendChild(el("span", "tag", esc(t))));
      body.appendChild(tags);
    }

    /* What this one choice does, on the row where the choice is made. A total a
       student cannot take apart is a total nobody trusts. */
    if (on && screen.row_rule) {
      let line = "";
      try { line = rule(screen.row_rule, { option: option }); } catch (err) { line = ""; }
      if (line) body.appendChild(el("p", "orow", esc(line)));
    }

    if (on && option.high != null) {
      const range = el("div", "orange");
      range.appendChild(el("span", "oscale", esc(CORE.formatValue(option.low, option.format || "int"))));
      const slider = el("input");
      slider.type = "range";
      slider.min = "0";
      slider.max = "1";
      slider.step = "0.05";
      slider.value = String(state.choices[option.id]);
      slider.setAttribute("aria-label", "How big: " + option.name);
      slider.addEventListener("input", () => {
        state.choices[option.id] = parseFloat(slider.value);
        save();
        paintScore();
        const shown = card.querySelector(".oval");
        if (shown) shown.textContent = amountText(option);
      });
      range.appendChild(slider);
      range.appendChild(el("span", "oscale", esc(CORE.formatValue(option.high, option.format || "int"))));
      body.appendChild(range);
    }
    row.appendChild(body);
    row.appendChild(el("div", "oval", esc(amountText(option))));
    card.appendChild(row);
    return card;
  }

  function amountText(option) {
    const size = state.choices[option.id];

    return (option.prefix || "") + CORE.formatValue(amount, option.format || "int")
      + (option.unit ? " " + option.unit : "");

  /* ------------------------------------------------------------- 3. hold */
  function renderHold(screen, app) {
    const wrap = el("div", "stagewrap hold");
    wrap.appendChild(el("h1", null, esc(screen.headline || "Wait here.")));
    if (screen.text) wrap.appendChild(el("p", "lede", esc(screen.text)));

    if (screen.tiles && screen.tiles.length) {
      const tiles = el("div", "tiles");
      screen.tiles.forEach(t => {
        const tile = el("div");
        tile.appendChild(el("span", "n", esc(value(t))));
        tile.appendChild(el("span", "k", esc(t.label)));
        tiles.appendChild(tile);
      });
      wrap.appendChild(tiles);
    }

    const form = el("div", "codebox");
    const label = el("label", null, esc(screen.code_label || "The code on the screen at the front"));
    label.setAttribute("for", "code");
    const input = el("input");
    input.id = "code";
    input.type = "text";
    input.autocomplete = "off";
    input.setAttribute("aria-label", "The code on the screen");
    const button = el("button", "btn", "Continue");
    button.type = "button";
    const said = el("p", "codemsg");

    async function tryCode() {
      said.textContent = "Checking…";
      const ok = await unlock(input.value);
      if (!ok) {
        said.textContent = "That code is not right. Check the screen.";
        said.className = "codemsg bad";
        return;
      }
      said.textContent = "";
      go(nextScreenId(screen.id));
    }
    button.addEventListener("click", tryCode);
    input.addEventListener("keydown", event => { if (event.key === "Enter") tryCode(); });

    form.appendChild(label);
    form.appendChild(input);
    form.appendChild(button);
    form.appendChild(said);
    wrap.appendChild(form);

    /* A saved stage call cannot be changed, so there is nothing to go back to. */
    const previous = screens[screens.indexOf(screen) - 1];
    if (previous && previous.kind !== "stage") {
      const back = el("button", "btn ghost", "Go back and change our answers");
      back.type = "button";
      back.addEventListener("click", () => go(previous.id));
      wrap.appendChild(back);
    }
    app.appendChild(wrap);
  }

  /* The locked screens are AES-GCM ciphertext until the classroom code opens
     them, so a student who opens the address early sees nothing of what comes. */
  async function unlock(code) {
    const clean = CORE.normalizeCode(code);
    if (!clean || !LOCKED || !LOCKED.data) return false;
    try {
      const enc = new TextEncoder();
      const raw = await crypto.subtle.importKey("raw", enc.encode(clean), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: fromBase64(LOCKED.salt), iterations: LOCKED.iter, hash: "SHA-256" },
        raw, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: fromBase64(LOCKED.iv) }, key, fromBase64(LOCKED.data));
      opened = JSON.parse(new TextDecoder().decode(plain));
      state.unlocked = true;
      state.code = clean;
      mergeOpened();
      save();
      return true;
    } catch (err) {
      return false;
    }
  }

  function mergeOpened() {
    if (!opened || !opened.screens) return;
    const byId = {};
    opened.screens.forEach(s => { byId[s.id] = s; });
    screens = screens.map(s => (byId[s.id] ? byId[s.id] : s));
  }

  /* --------------------------------------------------------- 4. surprise */
  function renderSurpriseGate(screen, app) {
    const wrap = el("div", "stagewrap");
    wrap.appendChild(el("h1", null, esc(screen.headline || "Watch the screen.")));
    const play = el("button", "btn big", "Play it");
    play.type = "button";
    play.addEventListener("click", () => playSurprise(screen));
    wrap.appendChild(play);
    app.appendChild(wrap);
    playSurprise(screen);
  }

  function variantFor(screen) {
    let key = null;
    try { key = screen.pick_rule ? rule(screen.pick_rule) : null; } catch (err) { key = null; }
    const variants = screen.variants || {};
    return variants[key] || variants.default || variants[Object.keys(variants)[0]] || { beats: [] };
  }

  function playSurprise(screen) {
    const run = ++stageRun;
    const stage = $("#stage");
    const variant = variantFor(screen);
    const picked = variant.option ? optionById(variant.option) : null;
    const vars = {
      names: state.names || "your group",
      option: picked ? picked.name : (variant.label || ""),
      amount: picked ? amountText(picked) : ""
    };
    const beats = (variant.beats || []).map(beat => Object.assign({}, beat, {
      text: CORE.fill(beat.text, vars),
      say: CORE.fill(beat.say || beat.text, vars)
    }));

    stage.innerHTML = "";
    stage.hidden = false;
    stage.setAttribute("aria-hidden", "false");
    document.body.classList.add("staged");

    const frame = el("div", "beatframe");
    const media = el("div", "beatmedia");
    const text = el("div", "beattext");
    const label = el("div", "simlabel", esc(DATA.label || "Simulated for a class exercise"));
    const controls = el("div", "beatctl");
    const sound = el("button", null, soundOn ? "Sound on" : "Sound off");
    const replay = el("button", null, "Play it again");
    const skip = el("button", null, esc(screen.skip_label || "Skip ahead"));
    const next = el("button", "next", esc(screen.continue_label || "Continue"));
    next.hidden = true;
    controls.appendChild(sound);
    controls.appendChild(replay);
    controls.appendChild(skip);
    frame.appendChild(media);
    frame.appendChild(text);
    frame.appendChild(label);
    frame.appendChild(controls);
    frame.appendChild(next);
    stage.appendChild(frame);

    sound.addEventListener("click", () => {
      soundOn = !soundOn;
      sound.textContent = soundOn ? "Sound on" : "Sound off";
      if (!soundOn) stopSpeech();
    });
    replay.addEventListener("click", () => playSurprise(screen));
    skip.addEventListener("click", () => finish());
    next.addEventListener("click", () => finish());

    function finish() {
      if (run !== stageRun) return;
      stopSpeech();
      stage.hidden = true;
      stage.setAttribute("aria-hidden", "true");
      document.body.classList.remove("staged");
      go(nextScreenId(screen.id));
    }

    let index = 0;
    function beat() {
      if (run !== stageRun) return;
      if (index >= beats.length) {
        next.hidden = false;
        next.focus();
        return;
      }
      const item = beats[index];
      index += 1;
      frame.className = "beatframe " + (item.kind || "line");
      media.innerHTML = "";
      if (item.file) {
        const img = el("img");
        img.src = item.file;
        img.alt = item.alt || "";
        media.appendChild(img);
        if (item.credit) media.appendChild(el("span", "credit", esc(item.credit)));
      }
      text.innerHTML = "";
      if (item.stamp) text.appendChild(el("span", "stamp", esc(item.stamp)));
      if (item.figure_rule) {
        let figure = "";
        try { figure = CORE.formatValue(rule(item.figure_rule), item.format || "int"); } catch (err) { figure = ""; }
        text.appendChild(el("span", "figure", esc(figure)));
      }
      text.appendChild(el("p", null, esc(item.text)));
      const ms = Math.max(item.min || 3200, estimateMs(item.text));
      speak(item.say, () => {});
      window.setTimeout(beat, ms);
    }
    beat();
  }

  function estimateMs(text) {
    const words = String(text || "").split(/\s+/).filter(Boolean).length;
    return 900 + words * 340;
  }

  /* Browser narration, with the four fixes Holbein's notes record: no blank
     utterance (it wedges Chrome's queue), a generation guard so a cancelled
     line cannot resume over the next one, a watchdog because onend sometimes
     never fires, and no resume() after a cancel. */
  let speechRun = 0;
  function speak(text, done) {
    const clean = String(text || "").trim();
    if (!soundOn || !clean || !("speechSynthesis" in window)) { if (done) done(); return; }
    const run = ++speechRun;
    try { window.speechSynthesis.cancel(); } catch (err) { /* nothing to cancel */ }
    const utterance = new SpeechSynthesisUtterance(clean);
    utterance.rate = 0.95;
    let finished = false;
    const finish = () => {
      if (finished || run !== speechRun) return;
      finished = true;
      if (done) done();
    };
    utterance.onend = finish;
    utterance.onerror = finish;
    window.setTimeout(finish, Math.max(2000, clean.length * 80));
    try { window.speechSynthesis.speak(utterance); } catch (err) { finish(); }
  }

  function stopSpeech() {
    speechRun += 1;
    try { if ("speechSynthesis" in window) window.speechSynthesis.cancel(); } catch (err) { /* fine */ }
  }

  /* ------------------------------------------------------------ 6. write */
  function renderWrite(screen, app) {
    const wrap = el("div", "stagewrap wide");
    if (screen.headline) wrap.appendChild(el("h1", null, esc(screen.headline)));
    if (screen.intro) wrap.appendChild(el("p", "lede", esc(screen.intro)));

      });

    }

    const sent = state.sent > 0;
    const targets = (screen.targets || []).filter(t => !(sent && state.moved[t.id]));
    const cards = el("div", "targets");
    targets.forEach(target => {
      const card = el("div", "target");
      if (target.file) {

      }
      const body = el("div");
      body.appendChild(el("h3", null, esc(target.name)));
      if (target.role || target.size != null) {
        body.appendChild(el("div", "tm", esc([target.role, target.size != null ? target.size + " votes" : ""].filter(Boolean).join(" · "))));
      }
      if (target.position) {
        const p = el("p", "pos");
        p.appendChild(el("strong", null, "What they say now: "));
        p.appendChild(document.createTextNode(target.position));
        body.appendChild(p);
      }
      if (target.needs) {
        const p = el("p", "pos");
        p.appendChild(el("strong", null, "What they want: "));
        p.appendChild(document.createTextNode(target.needs));
        body.appendChild(p);
      }
      if (target.source) body.appendChild(el("p", "osource", esc(sourceLine(target.source))));
      const label = el("label", null, esc(screen.box_label || "Your message"));
      label.setAttribute("for", "t-" + target.id);
      const box = el("textarea");
      box.id = "t-" + target.id;
      box.rows = 4;
      box.value = state.texts[target.id] || "";
      box.addEventListener("input", () => {
        state.texts[target.id] = box.value;
        save();
      });
      body.appendChild(label);
      body.appendChild(box);
      card.appendChild(body);
      cards.appendChild(card);
    });
    wrap.appendChild(cards);

    if (sent) wrap.appendChild(resultsPanel(screen));

    const row = el("div", "row");
    const send = el("button", "btn", sent ? "Send these too" : (screen.send_label || "Send the messages"));
    send.type = "button";
    send.disabled = targets.length === 0;
    send.addEventListener("click", () => {
      const all = screen.targets || [];
      const scored = CORE.lockPitches(all, state.texts, state.moved,
        (target, text) => rule(screen.score_rule, { target: target, text: text }),
        screen.policy, state.sent);
      state.moved = scored.moved;
      state.sent += 1;
      save();
      render();
    });
    row.appendChild(send);
    if (sent) {
      const next = el("button", "btn", esc(screen.continue_label || "See where the count stands"));
      next.type = "button";
      next.addEventListener("click", () => go(nextScreenId(screen.id)));
      row.appendChild(next);
    }
    wrap.appendChild(row);
    app.appendChild(wrap);
  }

  function resultsPanel(screen) {
    const box = panel("What came back", null);
    (screen.targets || []).forEach(target => {
      const moved = !!state.moved[target.id];
      const row = el("div", "result " + (moved ? "yes" : "no"));
      row.appendChild(el("strong", null, esc(target.name)));
      /* A group that gets nothing but "not moved" learns nothing. When the
         score rule says what was missing, that line is the answer. */
      /* What happened decides the line. The score rule's own sentence explains
         it only when the two agree: a target that moved on the fallback must
         not be told it stayed put. */
      let why = moved ? (target.moved_line || "Comes with you.")
        : (target.open_line || "Still not with you.");
      if (screen.score_rule && !moved) {
        const text = String(state.texts[target.id] || "").trim();
        let scored = null;
        try { scored = rule(screen.score_rule, { target: target, text: text }); } catch (err) { scored = null; }
        if (scored && scored.why && !scored.ready) why = scored.why;
      }
      row.appendChild(el("span", null, esc(why)));
      box.body.appendChild(row);
    });
    return box.box;
  }

  function renderOutcome(screen, app) {
    const wrap = el("div", "stagewrap wide");

    const blocs = rule(screen.blocs_rule) || [];

    const tally = el("div", "tally");

    tally.appendChild(el("span", "tk", esc((screen.tally_label || "with you")

    fill.className = yes >= screen.threshold ? "pass" : "fail";
    bar.appendChild(fill);
    const mark = el("u");
    mark.style.left = ((screen.threshold / (screen.total || 100)) * 100) + "%";
    bar.appendChild(mark);
    tally.appendChild(bar);
    wrap.appendChild(tally);

    const list = el("div", "blocs");
    blocs.forEach(bloc => {

      row.appendChild(head);
      if (bloc.why) row.appendChild(el("p", "bw", esc(bloc.why)));
      list.appendChild(row);
    });
    wrap.appendChild(list);

    if (screen.advice_rule) {

      back.type = "button";

      row.appendChild(back);
    }
    const next = el("button", "btn", esc(screen.continue_label || "Finish"));
    next.type = "button";
    next.addEventListener("click", () => go(nextScreenId(screen.id)));
    row.appendChild(next);
    wrap.appendChild(row);
    app.appendChild(wrap);
  }

  /* ---------------------------------------------------------- 8. receipt */
  function receiptContext() {
    const chosen = CORE.chosen(state, dataForRules()).map(option => ({
      name: option.name, value: amountText(option)
    }));
    const strategyScreen = screens.filter(s => s.kind === "respond")[0];
    const strategy = strategyScreen
      ? (strategyScreen.strategies || []).filter(s => s.id === state.strategy)[0]
      : null;
    const writeScreen = screens.filter(s => s.kind === "write")[0];
    const messages = writeScreen
      ? (writeScreen.targets || []).map(target => ({
        name: target.name, moved: !!state.moved[target.id], text: (state.texts[target.id] || "").trim()
      }))
      : [];
    const outcomeScreen = screens.filter(s => s.kind === "outcome")[0];
    let outcome = null;
    if (outcomeScreen) {
      const blocs = rule(outcomeScreen.blocs_rule) || [];
      const yes = blocs.filter(b => b.yes).reduce((total, b) => total + (Number(b.size) || 0), 0);
      outcome = {
        headline: yes + " of " + outcomeScreen.total + ", " + outcomeScreen.threshold + " needed",
        detail: yes >= outcomeScreen.threshold ? "It passes as it stands." : "It does not pass as it stands."
      };
    }
    const surpriseScreen = screens.filter(s => s.kind === "surprise")[0];
    let surprise = "";
    if (surpriseScreen && state.unlocked) {
      const variant = variantFor(surpriseScreen);
      surprise = variant.label || (variant.option ? (optionById(variant.option) || {}).name : "") || "";
    }
    const quizzes = screens.filter(x => x.quiz).map(x => {
      const ans = (state.quiz || {})[x.id] || {}; const items = x.items || [];
      const right = items.filter((it, i) => ans[i] === it.answer).length;
      return (x.receipt_title || x.headline) + ": " + right + " of " + items.length + " right";
    });
    return { choices: chosen, strategy: strategy, messages: messages, outcome: outcome, surprise: surprise, stages: stageContext(), quizzes: quizzes };
  }

  function renderReceipt(screen, app) {
    const ctx = receiptContext();
    ctx.stats = (screen.stats || []).map(stat => ({ label: stat.label, value: value(stat) }));
    const wrap = el("div", "stagewrap receiptwrap");
    wrap.appendChild(el("p", "shotnote", esc(screen.shot_note
      || "This is what your group hands in. Copy the text into the Blackboard item.")));

    const sections = [

    ];
    sections.forEach(pair => {

    if (screen.grade_note) card.appendChild(el("p", "grade-note", esc(screen.grade_note)));
    wrap.appendChild(card);

    const row = el("div", "row");
    const copy = el("button", "btn", "Copy the text for Blackboard");
    copy.type = "button";
    copy.addEventListener("click", () => {
      const text = CORE.receiptText(state, DATA, ctx);
      const area = el("textarea", "offscreen");
      area.value = text;
      document.body.appendChild(area);
      area.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
      document.body.removeChild(area);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => { copy.textContent = "Copied"; }, () => {});

      copy.textContent = ok ? "Copied" : "Select the text below and copy it";
      if (!ok) {

    /* The other way to hand it in: a file the group uploads to Blackboard, for
       a room where pasting into a text box goes wrong. */
    const download = el("button", "btn ghost", esc(screen.download_label || "Download our choices"));
    download.type = "button";
    download.addEventListener("click", () => {
      const text = CORE.receiptText(state, DATA, ctx);
      const blob = new Blob([text], { type: "text/plain" });
      const link = el("a");
      link.href = URL.createObjectURL(blob);
      link.download = CORE.fileName(state, DATA);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      window.setTimeout(() => URL.revokeObjectURL(link.href), 1000);

    const print = el("button", "btn ghost", "Print");
    print.type = "button";
    print.addEventListener("click", () => window.print());
    if (DATA.no_names) {
      download.className = "btn";
      copy.className = "btn ghost";
      row.appendChild(download);
      row.appendChild(copy);

      row.appendChild(copy);
      row.appendChild(download);

    row.appendChild(print);
