    wrap.appendChild(row);
    app.appendChild(wrap);
  }

  /* ------------------------------------------------------------ 8b. stage
     One stage of a case told in order: the briefing, one call with the
     group's reason, then what really happened and what it shows for class.
     The record stays hidden until the call is locked, and a locked call is
     never changed, so the group always meets the record after deciding. */
  /* More about a photo or map: shown on hover, and on a tap for touch screens. */
  function addInfo(figure, info) {
    if (!info) return;
    figure.classList.add("hasinfo");
    figure.tabIndex = 0;
    const box = el("div", "figinfo", rich(info));
    figure.appendChild(box);
    figure.addEventListener("click", () => figure.classList.toggle("open"));
  }

  /* Names, groups, places, and terms the group can hover over or tap for a short
     note. Only the first mention on each screen is marked, so the text stays calm. */
  let glossSeen = new Set();
  let glossRe = null;
  function glossPattern() {
    if (glossRe !== null) return glossRe;
    const terms = Object.keys(DATA.glossary || {}).sort((x, y) => y.length - x.length);
    glossRe = terms.length
      ? new RegExp("(^|[^A-Za-zÀ-ÿ])(" + terms.map(t => esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")(?![A-Za-zÀ-ÿ])", "g")
      : false;
    return glossRe;
  }
  function gloss(html) {
    const re = glossPattern();
    if (!re) return html;
    const byEsc = {};
    Object.keys(DATA.glossary || {}).forEach(t => { byEsc[esc(t)] = t; });
    return html.replace(re, (whole, pre, term) => {
      const key = byEsc[term] || term;
      const note = (DATA.glossary || {})[key];
      if (!note || glossSeen.has(key)) return whole;
      glossSeen.add(key);
      return pre + '<span class="gl" tabindex="0">' + term + '<span class="gltip">' + esc(note) + "</span></span>";
    });
  }
  function rich(text) {
    return String(text == null ? "" : text).split("**")
      .map((part, i) => (i % 2 ? "<strong>" + gloss(esc(part)) + "</strong>" : gloss(esc(part)))).join("");
  }

  /* Which idea fits? One click, saved with the calls. The course box opens
     only after the group has picked, so it never answers the question first. */
  function tagBox(box, row, conf) {
    const opts = conf.tag_options || DATA.tag_options || [];
    if (!opts.length) return false;
    const tg = el("div", "tagbox");
    tg.appendChild(el("h3", null, esc(conf.tag_question || DATA.tag_question || "Which idea fits this stage best?")));
    const r3 = el("div", "tagopts");
    opts.forEach(t => {
      const b = el("button", "tagopt" + (row.tag === t ? " on" : ""));
      b.type = "button";
      b.textContent = t;
      b.addEventListener("click", () => { row.tag = t; save(); render(); });
      r3.appendChild(b);
    });
    tg.appendChild(r3);
    const pending = !row.tag;
    if (pending) tg.appendChild(el("p", "namemsg", esc("Pick one to go on. It is saved with your calls.")));
    box.appendChild(tg);
    return pending;
  }

  function renderStage(screen, app) {
    const wrap = el("div", "stagewrap stagescreen");
    if (screen.kicker) wrap.appendChild(el("p", "kicker", esc(screen.kicker)));
    wrap.appendChild(el("h1", null, esc(screen.headline)));
    /* Who the group is and when: set apart so nobody reads past it. */
    if (screen.lede) {
      const role = el("div", "rolebox");
      role.appendChild(el("span", "rolelabel", "Your role"));
      role.appendChild(el("p", null, rich(screen.lede)));
      wrap.appendChild(role);
    }

    const columns = el("div", "brief-main");
    const left = el("div", "brief-copy");
    (screen.paragraphs || []).forEach(p => left.appendChild(el("p", null, rich(p))));
    if (screen.bullets && screen.bullets.length) {
      const list = el("ul", "stagebullets");
      screen.bullets.forEach(b => list.appendChild(el("li", null, rich(b))));
      left.appendChild(list);
    }
    (screen.panels || []).forEach(p => {
      const box = panel(p.title, p.meta);
      const list = el("ul");
      (p.bullets || []).forEach(b => list.appendChild(el("li", null, rich(b))));
      box.body.appendChild(list);
      left.appendChild(box.box);
    });
    if (screen.tiles && screen.tiles.length) {
      const tiles = el("div", "tiles");
      screen.tiles.forEach(t => {
        const tile = el("div");
        tile.appendChild(el("span", "n", esc(t.value)));
        tile.appendChild(el("span", "k", esc(t.label)));
        if (t.source) tile.appendChild(el("span", "src", esc(sourceLine(t.source))));
        tiles.appendChild(tile);
      });
      left.appendChild(tiles);
    }
    columns.appendChild(left);
    if ((screen.photos && screen.photos.length) || (screen.map && screen.map.file)) {
      const right = el("div", "brief-photos");
      if (screen.map && screen.map.file) {
        const figure = el("figure", "sidemap");
        const img = el("img");
        img.src = screen.map.file;
        img.alt = screen.map.alt || "";
        figure.appendChild(img);
        figure.appendChild(el("figcaption", null, esc(screen.map.credit || "")));
        addInfo(figure, screen.map.info);
        right.appendChild(figure);
      }
      (screen.photos || []).forEach(p => {
        const figure = el("figure");
        const img = el("img");
        img.src = p.file;
        img.alt = p.alt || "";
        figure.appendChild(img);
        figure.appendChild(el("figcaption", null, esc(p.credit || "")));
        addInfo(figure, p.info);
        right.appendChild(figure);
      });
      columns.appendChild(right);
    }
    wrap.appendChild(columns);

    state.stages = state.stages || {};
    const row = state.stages[screen.id] || { pick: null, why: "", revealed: false };
    state.stages[screen.id] = row;
    const picks = screen.picks || [];

    const ask = el("div", "stageask");
    if (screen.question) ask.appendChild(el("h2", null, rich(screen.question)));
    const list = el("div", "stagepicks");
    const buttons = [];
    picks.forEach(pick => {
      const card = el("button", "stagepick");
      card.type = "button";
      card.appendChild(el("span", "pn", esc(pick.name)));
      if (pick.detail) card.appendChild(el("span", "pd", rich(pick.detail)));
      card.disabled = row.revealed;
      if (row.pick === pick.id) card.classList.add("on");
      card.addEventListener("click", () => {
        if (row.revealed) return;
        row.pick = pick.id;
        buttons.forEach(b => b.classList.toggle("on", b === card));
        save();
        paint();
      });
      buttons.push(card);
      list.appendChild(card);
    });
    ask.appendChild(list);

    const minWords = Number(screen.why_min || 10);
    const whyLabel = el("label", null, esc(screen.why_label || "Why? Use a fact from this page."));
    whyLabel.setAttribute("for", "why-" + screen.id);
    const why = el("textarea");
    why.id = "why-" + screen.id;
    why.rows = 3;
    why.value = row.why || "";
    why.disabled = row.revealed;
    const said = el("p", "namemsg");
    const lock = el("button", "btn big", esc(screen.lock_label || "Save our call"));
    lock.type = "button";
    function wordCount(text) { return String(text || "").trim().split(/\s+/).filter(Boolean).length; }
    function paint() {
      const n = wordCount(why.value);
      lock.disabled = row.revealed || !row.pick || n < minWords;
      if (row.revealed) said.textContent = "";
      else if (!row.pick) said.textContent = "Pick one call first.";
      else if (n < minWords) said.textContent = "Write at least " + minWords + " words on why.";
      else said.textContent = "";
    }
    why.addEventListener("input", () => { row.why = why.value; save(); paint(); });
    lock.addEventListener("click", () => {
      if (lock.disabled) return;
      row.why = why.value;
      row.revealed = true;
      save();
      render();
    });
    ask.appendChild(whyLabel);
    ask.appendChild(why);
    ask.appendChild(said);
    if (!row.revealed) ask.appendChild(lock);
    wrap.appendChild(ask);
    paint();

    if (row.revealed && !screen.reveal) {
      if (screen.wait_note) wrap.appendChild(el("p", "lede", rich(screen.wait_note)));
      const next = el("button", "btn big", esc(screen.continue_label || "Continue"));
      next.type = "button";
      next.addEventListener("click", () => go(nextScreenId(screen.id)));
      wrap.appendChild(next);
    }
    if (row.revealed && screen.reveal) {
      const r = screen.reveal;
      const box = el("div", "stagereveal");
      box.appendChild(el("h2", null, esc(r.headline || "What really happened")));
      const mine = picks.filter(p => p.id === row.pick)[0];
      const real = picks.filter(p => p.id === r.real_pick)[0];
      if (mine) {
        const line = "Your call: " + mine.name + "."
          + (real ? " What they did: " + real.name + "." : (r.real_label ? " What they did: " + r.real_label : ""));
        box.appendChild(el("p", "stagecompare", esc(line)));
      }
      (r.paragraphs || []).forEach(p => box.appendChild(el("p", null, rich(p))));
      if (r.bullets && r.bullets.length) {
        const ul = el("ul", "stagetimeline");
        r.bullets.forEach(b => ul.appendChild(el("li", null, rich(b))));
        box.appendChild(ul);
      }
      /* Calls the FARC did not make: what happened to a real group that made them.
         Shown after the FARC's record, in a grey box tagged as not the FARC's story,
         so nobody reads it as what really happened. */
      function othersBox(o, title) {
        const other = el("div", "stageothers");
        const head = el("h3");
        head.appendChild(el("span", "otag", "Not what the FARC did"));
        head.appendChild(document.createTextNode(" " + title));
        other.appendChild(head);
        other.appendChild(el("p", "othersnote", rich(o.who)));
        const ol = el("ul");
        (o.bullets || []).forEach(t => ol.appendChild(el("li", null, rich(t))));
        other.appendChild(ol);
        return other;
      }
      if (mine && mine.others && mine.id !== r.real_pick) {
        box.appendChild(othersBox(mine.others, mine.others.title || "Your call was not the FARC's. What happened to others who made it"));
      }
      /* The other paths, read only. The saved call never changes. */
      const rest = picks.filter(p => p.others && p.id !== row.pick && p.id !== r.real_pick);
      if (rest.length) {
        const more = el("details", "otherpaths");
        more.appendChild(el("summary", null, "What happened to groups that made the other calls"));
        rest.forEach(p => more.appendChild(othersBox(p.others, "Call: " + p.name)));
        box.appendChild(more);
      }
      const tagPending = r.class_link ? tagBox(box, row, Object.assign({}, DATA, r.class_link)) : false;
      if (r.class_link && !tagPending) {
        const link = el("div", "stagelink");
        link.appendChild(el("h3", null, esc(r.class_link.title || "How this connects to the readings")));
        const ll = el("ul");
        (Array.isArray(r.class_link.text) ? r.class_link.text : [r.class_link.text])
          .filter(Boolean).forEach(t => ll.appendChild(el("li", null, rich(t))));
        link.appendChild(ll);
        if (r.class_link.reading) link.appendChild(el("p", "src", esc(r.class_link.reading)));
        box.appendChild(link);
      }
      if (r.source) box.appendChild(el("p", "src", esc(sourceLine(r.source))));
      /* Photographs of what happened stay hidden with the record. */
      if (r.photos && r.photos.length) {
        const row2 = el("div", "revealphotos");
        r.photos.forEach(p => {
          const figure = el("figure");
          const img = el("img");
          img.src = p.file;
          img.alt = p.alt || "";
          figure.appendChild(img);
          figure.appendChild(el("figcaption", null, esc(p.credit || "")));
        addInfo(figure, p.info);
          row2.appendChild(figure);
        });
        box.appendChild(row2);
      }
      wrap.appendChild(box);
      const next = el("button", "btn big", esc(screen.continue_label || "Continue"));
      next.type = "button";
      next.disabled = tagPending;
      next.addEventListener("click", () => { if (!next.disabled) go(nextScreenId(screen.id)); });
      wrap.appendChild(next);
    }
    app.appendChild(wrap);
  }

  /* A record screen: what really happened after a stage whose record waited
     behind the code, with the group's own call beside it. */
  function renderRecord(screen, app) {
    const wrap = el("div", "stagewrap stagescreen");
    if (screen.kicker) wrap.appendChild(el("p", "kicker", esc(screen.kicker)));
    wrap.appendChild(el("h1", null, esc(screen.headline)));
    const box = el("div", "stagereveal");
    const of = screenById(screen.stage) || {};
    const row = (state.stages || {})[screen.stage] || {};
    const mine = (of.picks || []).filter(p => p.id === row.pick)[0];
    const real = (of.picks || []).filter(p => p.id === screen.real_pick)[0];
    if (mine && screen.show_call !== false) {
      box.appendChild(el("p", "stagecompare", esc("Your call: " + mine.name + "."
        + (real ? " What they did: " + real.name + "." : (screen.real_label ? " What they did: " + screen.real_label : "")))));
    }
    (screen.paragraphs || []).forEach(p => box.appendChild(el("p", null, rich(p))));
    if (screen.bullets && screen.bullets.length) {
      const ul = el("ul", "stagetimeline");
      screen.bullets.forEach(b => ul.appendChild(el("li", null, rich(b))));
      box.appendChild(ul);
    }
    state.stages = state.stages || {};
    const trow = state.stages[screen.id] || {};
    state.stages[screen.id] = trow;
    const tagPending = screen.class_link ? tagBox(box, trow, Object.assign({}, DATA, screen.class_link)) : false;
    if (screen.class_link && !tagPending) {
      const link = el("div", "stagelink");
      link.appendChild(el("h3", null, esc(screen.class_link.title || "How this connects to the readings")));
      const ll = el("ul");
      (Array.isArray(screen.class_link.text) ? screen.class_link.text : [screen.class_link.text])
        .filter(Boolean).forEach(t => ll.appendChild(el("li", null, rich(t))));
      link.appendChild(ll);
      if (screen.class_link.reading) link.appendChild(el("p", "src", esc(screen.class_link.reading)));
      box.appendChild(link);
    }
    if (screen.photos && screen.photos.length) {
      const row2 = el("div", "revealphotos");
      screen.photos.forEach(p => {
        const figure = el("figure");
        const img = el("img");
        img.src = p.file;
        img.alt = p.alt || "";
        figure.appendChild(img);
        figure.appendChild(el("figcaption", null, esc(p.credit || "")));
        addInfo(figure, p.info);
        row2.appendChild(figure);
      });
      box.appendChild(row2);
    }
    wrap.appendChild(box);
    const next = el("button", "btn big", esc(screen.continue_label || "Continue"));
    next.type = "button";
    next.disabled = tagPending;
    next.addEventListener("click", () => { if (!next.disabled) go(nextScreenId(screen.id)); });
    wrap.appendChild(next);
    app.appendChild(wrap);
  }

  function stageContext() {
    return screens.filter(s => s.kind === "stage").map(screen => {
      const row = (state.stages || {})[screen.id] || {};
      const picks = screen.picks || [];
      const mine = picks.filter(p => p.id === row.pick)[0];
      const recordScreen = screens.filter(x => x.kind === "record" && x.stage === screen.id)[0];
      const r = screen.reveal || recordScreen || {};
      const real = picks.filter(p => p.id === r.real_pick)[0];
      return {
        title: screen.receipt_title || screen.headline,
        pick: row.revealed && mine ? mine.name : "",
        why: row.revealed ? String(row.why || "").trim() : "",
        real: row.revealed ? (real ? real.name : (r.real_label || "")) : "",
        tag: row.revealed ? (row.tag || (recordScreen && ((state.stages || {})[recordScreen.id] || {}).tag) || "") : ""
      };
    });
  }

  /* ----------------------------------------------------------- 9. custom */
  function renderCustom(screen, app) {
    const wrap = el("div", "stagewrap");
    if (screen.headline) wrap.appendChild(el("h1", null, esc(screen.headline)));
    if (screen.render_rule && typeof RULES[screen.render_rule] === "function") {
      const html = rule(screen.render_rule);
      wrap.appendChild(el("div", "custombody", String(html == null ? "" : html)));
    } else if (screen.text) {
      wrap.appendChild(el("p", "lede", esc(screen.text)));
    }
    const next = el("button", "btn", esc(screen.continue_label || "Continue"));
    next.type = "button";
    next.addEventListener("click", () => go(nextScreenId(screen.id)));
    wrap.appendChild(next);
    app.appendChild(wrap);
  }

  /* ------------------------------------------- how this page works (tab) */
  function renderHow() {
    const box = $("#how");
    box.innerHTML = "";
    const how = DATA.how_it_works || {};
    box.appendChild(el("h1", null, "How this page works"));
    if (how.intro) box.appendChild(el("p", "lede", esc(how.intro)));
    if (DATA.illustrative) {
      box.appendChild(el("p", "warn", "The numbers on this page are illustrative. It is an example build, not a class exercise."));
    }

    box.appendChild(el("h2", null, "What the page works out for you"));
    const rules = el("ul");
    (DATA.rules || []).forEach(r => {
      const item = el("li");
      item.appendChild(el("strong", null, esc(r.label || r.name)));
      item.appendChild(document.createTextNode(" " + (r.describe || "")));
      rules.appendChild(item);
    });
    box.appendChild(rules);
    box.appendChild(el("p", "note", esc(how.model_note
      || "These are a classroom model. The numbers they read are real and sourced below. The weights are the instructor's, chosen so the exercise is hard and fair, not to predict what would happen.")));

    box.appendChild(el("h2", null, "Where the numbers come from"));
    const sources = el("ul");
    (DATA.sources || []).forEach(source => {
      const item = el("li");
      if (source.url) {
        const link = el("a", null, esc(source.text));
        link.href = source.url;
        link.target = "_blank";
        link.rel = "noopener";
        item.appendChild(link);
      } else {
        item.appendChild(document.createTextNode(source.text));
      }
      sources.appendChild(item);
    });
    box.appendChild(sources);

    if (how.notes && how.notes.length) {
      box.appendChild(el("h2", null, "Worth knowing"));
      const notes = el("ul");
      how.notes.forEach(n => notes.appendChild(el("li", null, esc(n))));
      box.appendChild(notes);
    }
  }

  /* The case tab: the timeline, the people, the armed groups and the terms,
     one click away from every screen. Shown only when the simulation has one. */
  function renderCase() {
    glossSeen = new Set();
    const box = $("#case");
    if (!box) return;
    box.innerHTML = "";
    const ref = DATA.reference || {};
    box.appendChild(el("h1", null, esc(ref.title || "The case")));
    if (ref.intro) box.appendChild(el("p", "lede", rich(ref.intro)));
    /* A section tied to a stage stays hidden until that stage's record is
       out, so the tab never tells a group what happened before it decides. */
    (ref.sections || []).filter(section => !section.open_after
      || ((state.stages || {})[section.open_after] || {}).revealed).forEach(section => {
      box.appendChild(el("h2", null, esc(section.title)));
      (section.paragraphs || []).forEach(p => box.appendChild(el("p", null, rich(p))));
      if (section.items && section.items.length) {
        const list = el("ul");
        section.items.forEach(item => list.appendChild(el("li", null, rich(item))));
        box.appendChild(list);
      }
      (section.photos || []).forEach(p => {
        const figure = el("figure");
        const img = el("img");
        img.src = p.file;
        img.alt = p.alt || "";
        figure.appendChild(img);
        figure.appendChild(el("figcaption", null, esc(p.credit || "")));
        addInfo(figure, p.info);
        box.appendChild(figure);
      });
    });
  }

  function showTab(which) {
    $("#app").hidden = which !== "run";
    $("#how").hidden = which !== "how";
    const caseBox = $("#case");
    if (caseBox) caseBox.hidden = which !== "case";
    ["run", "case", "how"].forEach(name => {
      const tab = $("#tab-" + name);
      if (tab) tab.setAttribute("aria-selected", which === name ? "true" : "false");
    });
    if (which === "how") renderHow();
    if (which === "case") renderCase();
  }

  document.addEventListener("click", ev => {
    const g = ev.target.closest ? ev.target.closest(".gl") : null;
    document.querySelectorAll(".gl.open").forEach(x => { if (x !== g) x.classList.remove("open"); });
    if (g) g.classList.toggle("open");
  });

  /* ------------------------------------------------------------- 10. boot */
  async function boot() {
    screens = (DATA.screens || []).slice();
    state = load();
    if (state.unlocked && state.code) {
      const ok = await unlock(state.code);
      if (!ok) { state.unlocked = false; state.code = null; save(); }
    }
    if (!state.screen || !screenById(state.screen)) state.screen = screens[0] ? screens[0].id : null;
    /* A screen that is still locked cannot be rendered. That happens when a
       reload arrives before the code has been typed, so the group goes back to
       the waiting screen rather than onto an empty one. */
    const here = screenById(state.screen);
    if (here && here.locked) {
      const hold = screens.filter(screen => screen.kind === "hold")[0];
      state.screen = hold ? hold.id : screens[0].id;
      notice("Type the code again to open the rest.", "warn");
      save();
    }
    $("#tab-run").addEventListener("click", () => showTab("run"));
    $("#tab-how").addEventListener("click", () => showTab("how"));
    const caseTab = $("#tab-case");
    if (caseTab && DATA.reference) {
      caseTab.hidden = false;
      caseTab.addEventListener("click", () => showTab("case"));
    }
    const restart = $("#restart");
    if (restart) {
      restart.addEventListener("click", () => {
        if (!window.confirm("This clears everything your group has entered. Start over?")) return;
        try { localStorage.removeItem(KEY); } catch (err) { /* nothing to remove */ }
        state = CORE.emptyState(DATA.build);
        opened = null;
        screens = (DATA.screens || []).slice();
        state.screen = screens[0] ? screens[0].id : null;
        notice("");
        render();
      });
    }
    showTab("run");
    render();
  }

  root.SIMUI = { boot: boot, render: render, go: go };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
}(typeof globalThis !== "undefined" ? globalThis : this));
</script>
</body>
</html>
