ntly by the state's protection agency and the FARC's new party, to protect former fighters. A UN mission to verify the ceasefire and the handover of weapons. The text says what happened to the Patriotic Union must never happen again.","**Voters said no.** On 2 October 2016 they rejected the deal, 50.2% to 49.8%, with turnout under 38%. Those who voted No objected that fighters who confessed would avoid prison, and to the payments and the guaranteed seats. Many said they did not trust the FARC to disarm for good.","**A revised deal.** It was signed on 24 November 2016, and Congress later approved it. In June 2017 the FARC handed 7,132 weapons to the UN."],"class_link":{"text":["**Commitment problem.** Both sides kept fighting during the talks, the FARC was widely seen as using the zone to rearm, and the US Congress funded Plan Colombia (all above). The Truth Commission writes that for the FARC a ceasefire was where the talks would end and disarming was not even considered, and that distrust persisted because of the paramilitaries, whose close ties to members of the armed forces had been exposed. The 2016 deal added the security body and the UN mission above, whose observers the deal describes as unarmed.","**Indivisible stakes.** The 1993 plan to close in on the cities and the FARC's wish to be recognized as a political force are above. The Truth Commission writes that in the zone, where it had its rear base, the FARC sought to set up a power of its own alongside the state, and that what it sought from the talks was to make its military power legitimate in politics. In 2016, after its losses, it accepted guaranteed seats in Congress (above).","**Discuss:** the FARC was near its peak in 1998 and signed a deal only in 2016, after the losses above. Is a rebel group more likely to make peace when it is strong or when it is losing, and why?"],"reading":"Truth Commission, No matarás (2022), pp. 348 to 349. Final Agreement (2016), pp. 60 and 70 to 71. US Congressional Research Service, Colombia's Peace Process Through 2016 (2016). National Center for Historical Memory, ¡Basta ya! (2013), pp. 154 to 155.","title":"How this connects to the course","tag_question":"The talks in Pastrana's zone failed in 2002. Which explanation of why peace fails fits this best? Pick one, then argue it out.","tag_options":["Commitment problem","Indivisible stakes","Something else"]},"photos":[{"file":"media/santos_timochenko_signing.jpg","alt":"A crowd watches the signing of the peace deal on a giant screen","credit":"A crowd in Cartagena watches the signing on a giant screen, 26 September 2016. Photo: US Department of State, public domain.","info":"Santos and Timochenko signed with a pen made from a .50-caliber bullet casing, engraved: 'Bullets marked our past. Education, our future.'"}]},"lock_label":"Save our call and see what happened","photos":[{"file":"media/pastrana.jpg","alt":"President Andrés Pastrana, 2001","credit":"President Andrés Pastrana, 2001. Photo: US Department of Defense, public domain.","info":"He won the June 1998 runoff against the Liberal Horacio Serpa, 50.3% to 46.6%, after making peace talks with the guerrillas his priority. The FARC and the ELN made no secret of preferring him."},{"file":"media/caguan_farc.jpg","alt":"FARC commanders raise their rifles at the Caguán peace talks","credit":"FARC commanders at the Caguán peace talks, held in the zone, 1998 to 2002. Photo: US Drug Enforcement Administration, public domain.","info":"Pastrana's decree of 14 October 1998 cleared the army out of San Vicente del Caguán and 4 municipalities in Meta, La Uribe, Mesetas, La Macarena, and Vistahermosa, for 90 days at first."}],"map":{"file":"media/map_stage5.svg","alt":"Map of Colombia for stage 5","credit":"Shaded: the 5 municipalities of the 1998 to 2002 zone. Map: Natural Earth, geoBoundaries, and GeoNames.","info":"**Dots**: the FARC's attacks at Las Delicias, El Billar, and Mitú, and the paramilitary massacre at Mapiripán. In a straight line, Mitú lies about 570 km southeast of Bogotá, and San Vicente del Caguán about 290 km south."},"bullets":["**The FARC goes on the offensive.** In 1993 it decided to fight in larger units that take and hold ground, and to close in on the cities, Bogotá first.","**Major attacks.** At Las Delicias, Putumayo, in August 1996, 28 soldiers died (Truth Commission count) and 60 were taken prisoner. At El Billar, Caquetá, in March 1998, it killed dozens of soldiers. In November 1998 it held Mitú, capital of Vaupés, for 3 days. It was collecting prisoners to trade.","**The paramilitaries unite.** In 1997 regional paramilitary groups formed a national federation, the AUC. That July paramilitaries killed about 49 people in Mapiripán, Meta.","**A new president seeks talks.** Andrés Pastrana, elected in 1998, met Marulanda in the jungle on 9 July, before taking office.","**The offer.** The army will leave 5 municipalities, 42,000 square kilometers, about the size of Switzerland, while the talks go on. It begins to leave on 7 November 1998.","**How the FARC sees it.** The Truth Commission writes that the FARC wanted the zone as recognition as a political force, and still distrusted the state."],"why_label":"Why? And name the risk you accept."},{"id":"s6","kind":"stage","kicker":"Stage 6 of 6 · 2017 to today","headline":"2017: After the peace deal","receipt_title":"Stage 6, after the deal","lede":"It is 2017. You are a former FARC fighter who has just handed your rifle to the UN.","paragraphs":[],"question":"What do you do?","picks":[{"id":"s6_stay","name":"Stay in the deal","detail":"Work in your cooperative, back the party, and confess to the court. You keep a legal life, and you rely on a state that has been slow to deliver land and safety."},{"id":"s6_dissident","name":"Go back to the jungle with the dissidents","detail":"Join the former FARC units that refused or left the deal. You are armed and among comrades again, and the army and rival groups hunt you.","others":{"who":"FARC commanders who left the deal and their followers, now separate armed groups. Not the FARC's party.","bullets":["**July 2016.** The 1st Front, under Iván Mordisco, left the peace process. Gentil Duarte joined it.","**August 2019.** Iván Márquez, Jesús Santrich, and El Paisa announced a new group, the Second Marquetalia.","**2021 to 2022.** Santrich, El Paisa, and another commander, Romaña, were killed in Venezuela. Gentil Duarte was killed there in May 2022."]}},{"id":"s6_criminal","name":"Join a drug-trafficking group that pays","detail":"Sell your skills as a fighter for a salary. The pay is real, and you fight for traffickers, not a cause.","others":{"who":"Former FARC fighters at the Gallo camp in Córdoba, some of whom may have left the deal for a drug-trafficking group. The FARC as a group stayed in the deal.","bullets":["**By early 2018.** Officials and farmers believed 30 to 40 former fighters at Gallo may have joined the Urabeños, a drug-trafficking group that offered about 1,800,000 pesos (about $610) to those who switched. It threatened some who said no.","Later, many former fighters in the camps were forced to move or join criminal groups, according to InSight Crime."]}}],"why_min":12,"reveal":{"real_pick":"s6_stay","bullets":["**Most stayed.** Most former fighters stayed in the deal. A minority rearmed. The dissident groups grew mostly through new recruits. Estimates of former FARC fighters among them range from hundreds to thousands.","**The chief negotiator left.** In April 2018 negotiator Jesús Santrich was arrested on US drug charges, and in protest the chief negotiator, Iván Márquez, refused his Senate seat and demanded that unkept promises be met. In August 2019 Márquez announced a return to arms 'in response to the State's betrayal' of the deal.","**What the state has delivered.** By mid-2026 the UN counted 493 former FARC fighters killed since they signed the deal. By early 2026, 323,579 of a promised 3 million hectares of land had been handed out.","**The court.** In September 2025 the JEP handed down its first sentences: 8 years of reparation work, such as clearing land mines, for 7 former FARC leaders, for kidnapping.","**The party.** In March 2026, the first election without its guaranteed seats, the former FARC's party, Comunes, ran in a left coalition that got about 114,000 votes, far below the 500,000 needed to keep its legal status. It won no seats. The party said threats in several regions hindered its campaign.","**A new president.** In June 2026 Abelardo de la Espriella, a right-wing critic of the deal, won the presidency, 49.7% to 48.7% for left-wing senator Iván Cepeda. He announced plans to close the office that implements the deal, and his government has proposed cutting the JEP's budget."],"class_link":{"text":["**Grievances.** Márquez said he took up arms again in August 2019 'in response to the State's betrayal' of the deal. Most former fighters stayed in the deal, and in some camps land and projects had not arrived (all above). At Gallo, InSight Crime reported in January 2018 that, unlike many other camps, not a single productive project was moving forward.","**Selective incentives.** At Gallo, in Córdoba, InSight Crime reported in January 2018 that the Urabeños, a drug-trafficking group, were offering 1,800,000 pesos (about $610) to former fighters who switched sides, and that officials and small farmers believed 30 to 40 may have joined them. Gentil Duarte's $1.35 million and the dissidents' growth mostly through new recruits are above.","**Force.** InSight Crime reported in January 2018 that the Urabeños had threatened some former fighters at Gallo who refused to join. It also reports that pressure from armed groups, among them the ELN and the FARC dissidents themselves, forced many former fighters in the camps to move or to join these groups."],"reading":"Vanguardia (29 August 2019), on Márquez. InSight Crime (2 January 2018), on Gallo. InSight Crime, on Gentil Duarte. InSight Crime, FARC profile, on the camps.","title":"How this connects to the course","tag_question":"Some former FARC fighters took up arms again after 2016. Which motive fits best? Pick one, then argue it out.","tag_options":["Grievances","Selective incentives","Force","Something else"]},"photos":[]},"lock_label":"Save our call and see what happened","photos":[{"file":"media/etcr_icononzo.jpg","alt":"A camp for former FARC fighters in Icononzo, Tolima, 2018","credit":"A camp for former FARC fighters in Icononzo, Tolima, 2018. Photo: Juan Sebastian GilM, CC BY-SA 4.0.","info":"One of 26 FARC camps in 2017. After the fighters handed in their rifles, the UN let some weapons stay in the camps for security until 1 August 2017."}],"map":{"file":"media/map_stage6.svg","alt":"Map of Colombia for stage 6","credit":"Shaded: Guaviare, base of the first FARC unit to reject the deal. Dots: two camps for former fighters. Map: Natural Earth, geoBoundaries, and GeoNames.","info":"In a straight line, the Icononzo camp lies about 70 km southwest of Bogotá, and the Gallo camp, in the municipality of Tierralta, about 450 km northwest."},"bullets":["**What you were promised.** Land for peasants. A special court, the JEP, where those who confess do reparation work, such as clearing land mines, instead of prison. A party with 10 guaranteed seats in Congress for 2 terms, 2018 to 2026. 90% of the minimum wage for 24 months for each former fighter without a paid job.","**What you have.** Your weapons are with the UN. Former fighters are setting up cooperatives, farms, and businesses.","**What you do not have.** In some camps land and projects have not arrived. 'There is no land,' says a former fighter in Córdoba. After a former fighter was murdered in Caquetá, a local leader said no one protects them. Former fighters fear being killed if they visit their families.","**Offers to rearm.** Criminal groups offer money and salaries. Gentil Duarte, a FARC commander, left the peace process at the end of 2016 with $1.35 million and some of his men, and kept control of drug trafficking in the south."],"why_label":"Why? And name the risk you accept."},{"id":"receipt","kind":"receipt","title":"Colombia's war: our calls","shot_note":"Download this file, then upload it to the Blackboard item. Add every name in your group at the top of the file, or type the names into Blackboard when you upload. If your group wrote the essay, add it at the end of the file.","grade_note":"Your calls are not graded."}],"how_it_works":{"intro":"This page describes the history of Colombia's war. Throughout, you need to make calls with your groups and afterwards you will see what really happened. This exercise is inspired by John Holbein's President's Budget simulation (johnholbein.org/teaching-activities/presidents-budget).","model_note":"Nothing on this page is scored. Your calls do not change the history you see.","notes":[]},"reference":{"title":"The case","intro":"This tab starts almost empty and fills up as you go. After each stage, it adds what happened at that stage and the terms you need.","sections":[{"title":"The armed groups","items":["**FARC.** Revolutionary Armed Forces of Colombia. A Communist peasant guerrilla group, Colombia's largest."]},{"title":"Terms","items":["**La Violencia.** The killing between Liberals and Conservatives, about 1946 to 1958.","**Front.** A regional unit of the FARC.","**Self-defense groups.** The Communist Party's term for armed peasant groups formed to defend their own communities."]},{"title":"Terms, stage 1","open_after":"s1","items":["**National Front.** The 1957 pact in which the two major parties shared power and excluded everyone else."]},{"title":"Terms, stage 2","open_after":"s1","items":["**Independent republics.** A senator's name in 1961 for the Communist zones, which he said the army could not enter."]},{"title":"The armed groups, from stage 3","open_after":"s2","items":["**ELN.** National Liberation Army. A guerrilla group whose first attack was in 1965.","**EPL.** Popular Liberation Army. A Maoist guerrilla group, formed in 1967.","**M-19.** An urban guerrilla group named after the disputed election of 19 April 1970.","**Paramilitaries.** Militias of ranchers and drug traffickers, often helped by the army, that fought the guerrillas and attacked civilians they saw as guerrilla supporters."]},{"title":"Terms, stage 4","open_after":"s4b","items":["**Patriotic Union (UP).** The party born from the 1984 to 1985 peace talks."]},{"title":"Terms, stage 5","open_after":"s5","items":["**AUC.** United Self-Defense Forces of Colombia, the national federation of paramilitary groups from 1997.","**Plan Colombia.** A Colombian plan funded by US aid from 2000, first against drugs and from 2002 also against armed groups.","**False positives.** Civilians killed by the security forces, mostly the army, and presented as guerrillas killed in combat.","**JEP.** Special Jurisdiction for Peace, the court created by the 2016 deal."]},{"title":"Terms, stage 6","open_after":"s6","items":["**Dissidents.** Former FARC units and commanders who rejected or left the 2016 deal.","**Total Peace.** President Petro's policy, from 2022, of talking with many armed groups at once."]},{"title":"Timeline, stage 1","open_after":"s1","items":["**1946.** Conservatives win the presidency. Party violence grows.","**9 April 1948.** Gaitán killed. Riots across the country.","**1949.** Congress closed. Communists form self-defense groups.","**1953.** Rojas Pinilla's coup and amnesty.","**1955.** Villarrica bombed. Marquetalia founded.","**1957.** National Front approved by plebiscite."]},{"title":"Timeline, stage 2","open_after":"s2","items":["**11 January 1960.** Charro Negro killed.","**1961.** The 'independent republics' speech.","**May 1964.** Operation Marquetalia.","**20 July 1964.** Agrarian Program.","**1965 to 1967.** ELN and EPL begin.","**1966.** The FARC takes its name.","**1974.** M-19's first action."]},{"title":"Timeline, stage 3","open_after":"s3","items":["**November 1981.** Marta Nieves Ochoa kidnapped. MAS formed weeks later.","**May 1982.** Seventh Conference: FARC-EP, plan to take power.","**1982.** The FARC has 16 fronts.","**1980s.** Ranchers and traffickers build paramilitaries in the Magdalena Medio."]},{"title":"Timeline, stage 4","open_after":"s4b","items":["**28 March 1984.** La Uribe accords.","**28 May 1985.** Patriotic Union founded.","**June 1987.** Truce breaks down.","**11 October 1987.** Pardo Leal killed.","**22 March 1990.** Jaramillo killed.","**March to April 1990.** M-19 disarms. Pizarro killed.","**1991.** New Constitution."]},{"title":"Timeline, stage 5","open_after":"s5","items":["**1997.** AUC formed. Mapiripán massacre.","**1999 to 2002.** Talks in the southern zone.","**2000.** Plan Colombia.","**2002 to 2010.** Uribe's offensive. False positives.","**2008 to 2011.** FARC leaders killed.","**2012 to 2016.** Havana talks and deal. Voters reject it, a revised deal passes.","**2017.** FARC disarms."]},{"title":"Timeline, stage 6","open_after":"s6","items":["**2019.** Iván Márquez rearms.","**2022.** Petro elected. Total Peace.","**January 2025.** Catatumbo fighting.","**2026.** Comunes loses its seats. De la Espriella elected."]},{"title":"Evidence for the essay","open_after":"s6","paragraphs":["Each explanation, with facts from this page that support it and facts that cut against it."],"items":["**Commitment problem, for.** People who laid down arms or entered politics were killed: Salcedo in 1957, thousands of Patriotic Union members after 1985, Pizarro in 1990, and 493 former FARC fighters since 2016. **Against.** The M-19 disarmed and never went back to war, and most FARC fighters stayed in the 2016 deal.","**Exclusion, for.** The National Front shut every other party out of power from 1958. The Communist Party was outlawed in 1954. When the FARC tried politics in 1985, its party's members were killed by the thousands.","**Exclusion, against.** Though left out of the National Front, the Communists regained a legal party in 1957 and moved into politics. Cederman and colleagues study the exclusion of ethnic groups, and the FARC was a Communist peasant guerrilla, not an ethnic movement. The FARC grew fastest in the 1980s and 1990s, after the National Front had ended.","**Opportunity, for.** The war began in remote zones outside state control. In 1998 the state handed the FARC a zone of its own.","**Opportunity, against.** The FARC stayed small from 1966 until the late 1970s. Its mountains and remote plains had not changed.","**Selective incentives, for.** The FARC grew from about 3,000 fighters in 1982 to between 16,000 and 28,000 by about 2002 (estimates differ) as coca and kidnapping money came in. Dissidents after 2016 offered pay.","**Selective incentives, against.** Only about 25% of former FARC members said they expected a material reward. Its leaders argued about the morality of drug money for years."]}]},"no_names":true,"glossary":{"Gaitán":"Jorge Eliécer Gaitán, head of the Liberal Party and its sole candidate for the 1950 presidential election. His movement drew peasants, workers, and small property owners. The Truth Commission writes that victims remember his murder as a way of keeping popular leaders from power.","Rojas Pinilla":"Gustavo Rojas Pinilla, a general who took power in a coup in June 1953. The Truth Commission writes that his rule was a temporary way to settle disputes between Liberals and Conservatives, not a political project of its own. His amnesty covered soldiers jailed for an earlier coup attempt.","Ospina":"Mariano Ospina Pérez, Conservative president of Colombia from 1946 to 1950, whom the Truth Commission calls more moderate than Laureano Gómez. In April 1947 Gaitán sent him and his interior minister a formal list of grievances over the killings of Liberals and the lack of punishment for them.","Marulanda":"Manuel Marulanda, born Pedro Antonio Marín, a Liberal guerrilla in southern Tolima who joined the Communists and later led the FARC. As a young trader he saw Conservative gunmen kill about 150 people at Ceilán, Valle, in October 1949, which he said made him join the Liberal guerrillas.","Jacobo Arenas":"Luis Alberto Morantes, known as Jacobo Arenas, a trade unionist and Communist Party leader who headed the FARC's political wing. The party had sent him as its political officer to the fighters at what became Marquetalia, and he had been with the Communists at Villarrica.","Charro Negro":"Jacobo Prías Alape, known as Charro Negro, a Liberal guerrilla who went over to the Communists and became one of their main commanders in southern Tolima. The Colombian magazine Sur calls him the most prominent Communist guerrilla leader of his time and a member of the party's Central Committee.","Mariachi":"Jesús María Oviedo, known as Mariachi, a commander of the limpios, the armed Liberals loyal to their party, in southern Tolima. He had once hidden at El Davis with the Communists. The Truth Commission writes that, though officially disarmed, he kept attacking them with local bosses and security forces.","Salcedo":"Guadalupe Salcedo, commander of the Liberal guerrillas of the Llanos, the eastern plains, which the Truth Commission calls the largest and best-armed guerrilla movement of the time. Its fighters seized military bases and towns, and by 1952 much of the movement had declared a revolution to overthrow the government.","Gómez Hurtado":"Álvaro Gómez Hurtado, a Conservative senator and son of Laureano Gómez, president from 1950 to 1951. In his October 1961 speech he blamed President Alberto Lleras Camargo's National Front government for failing to bring peace, and named Sumapaz, Planadas, and Riochiquito among the 'independent republics'.","Betancur":"Belisario Betancur, Conservative president of Colombia elected in 1982, who offered the FARC peace talks. The Truth Commission writes that his 1982 amnesty set no conditions, not even disarmament, which angered the army, and that many guerrillas it freed went back to their groups.","Landazábal":"General Fernando Landazábal, Betancur's first defense minister. In October 1982, as Congress debated the amnesty, he said that just as the army neared final victory, the government was turning the guerrillas' defeats into victories: 'Let us hope this is the last amnesty.'","Pardo Leal":"Jaime Pardo Leal, president of the Patriotic Union (UP) and its candidate in the May 1986 presidential election, where he won 4.5% of the vote. A member of the Communist Party's Central Committee, he campaigned for land reform, nationalizing the banks and oil, and disbanding paramilitary groups.","Jaramillo":"Bernardo Jaramillo Ossa, Pardo Leal's successor as president of the Patriotic Union (UP) and its 1990 presidential candidate. In March 1990 the interior minister said voters had defeated the UP, 'the FARC's political arm'. Jaramillo said the remark had marked them for death.","Pizarro":"Carlos Pizarro, top commander of the M-19, an urban guerrilla group. In 1984 he arrived wounded to sign a ceasefire, after the army attacked his delegation on the way. When the M-19 disarmed, he laid his pistol on top of its weapons and said: 'We have done our part.'","Navarro":"Antonio Navarro Wolff, an M-19 leader who signed its 1990 peace deal and replaced Pizarro as its presidential candidate. In 1985 undercover members of the security forces threw a grenade at him, and he lost a leg. In 1991 he co-chaired the constitutional assembly.","Pastrana":"Andrés Pastrana, president of Colombia elected in 1998 on a promise of peace with the FARC. The Truth Commission writes that in October 1998 he recognized the FARC as a political force and accepted 3 negotiators from its richest bloc, the one behind attacks such as Las Delicias.","Uribe":"Álvaro Uribe, president of Colombia from 2002 to 2010, elected as an independent on promises of a hard line against the FARC and the ELN. His 'democratic security' policy aimed to bring the whole country under state control, and in 2016 he led the campaign against the peace deal.","Santos":"Juan Manuel Santos, Uribe's defense minister, then president of Colombia from 2010. His government kept up the military offensive against the guerrillas but made the victims and a negotiated end to the war its 2 main goals. He won the 2016 Nobel Peace Prize.","Timochenko":"Rodrigo Londoño, known as Timochenko, the FARC's third and last commander-in-chief, from November 2011. InSight Crime writes that he had a reputation as a hardliner. A US Congressional Research Service report says that he quickly offered Santos's government a political dialogue.","Raúl Reyes":"Luis Édgar Devia, known as Raúl Reyes, the FARC's second-in-command and its international spokesman. Pastrana accepted him as one of 3 FARC negotiators in the 1998 talks. The 2008 raid that killed him was the first time the government had killed a member of the FARC's 7-member ruling secretariat.","Alfonso Cano":"Guillermo León Sáenz, known as Alfonso Cano, who replaced Marulanda as the FARC's top leader in 2008. The Truth Commission writes that he took over Jacobo Arenas's central role in the FARC's political strategy after Arenas died in 1990, and that he negotiated in failed peace talks in Mexico.","Iván Márquez":"Luciano Marín Arango, known as Iván Márquez, the FARC's former second-in-command and head of its negotiating team in Havana. In the 1980s he was a Patriotic Union emissary and alternate member of Congress, until the FARC recalled him in 1987 as persecution of the party intensified.","Santrich":"Seuxis Hernández, known as Jesús Santrich, one of the FARC's 2 main negotiators in Havana, with Iván Márquez. The Truth Commission writes that analysts saw the 2 men as the hard-line wing most skeptical of the talks, and that both had lived in Venezuela for at least a decade.","Gentil Duarte":"Miguel Botache Santillana, known as Gentil Duarte, a FARC commander of more than 30 years and a negotiator in the talks from 2012. In 2016 the FARC's leaders sent him from the talks in Cuba to restore discipline in the 1st Front, the first unit to reject the deal.","Mordisco":"Néstor Gregorio Vera Fernández, known as Iván Mordisco, commander of the FARC's 1st Front, in Guaviare. When his front left the peace process, it said it would keep fighting the root causes of the war. He went on to lead one of the 2 main dissident groups.","Petro":"Gustavo Petro, a former member of the M-19 guerrilla group, elected in June 2022 as Colombia's first left-wing president. Under his Total Peace policy his government held talks with both main FARC dissident groups. InSight Crime reports that the dissidents grew stronger during those talks and ceasefires.","De la Espriella":"Abelardo de la Espriella, a right-wing lawyer who became president of Colombia on 7 August 2026. On 7 September 2026 his government shut down the remaining talks with criminal groups that had run since 2022 under President Gustavo Petro.","Cepeda":"Iván Cepeda, a left-wing senator of the Historic Pact (Pacto Histórico) coalition, who pledged to continue peace talks with armed groups and narrowly lost the June 2026 runoff. His father, Manuel Cepeda, the Patriotic Union's only member of Congress in 1994, was murdered in Bogotá in August 1994.","Castaño":"Carlos Castaño, a paramilitary leader who with his brother Fidel commanded a paramilitary group based in Córdoba. The brothers began working with the army as informants in 1981, after their father died while held hostage by the FARC.","Escobar":"Pablo Escobar, one of the main partners of the Medellín cartel, which processed coca paste and smuggled it to the United States. In 1983 he sat in Congress, until a newspaper revived an old arrest of his and he went into hiding.","Argemiro":"Commander of the FARC's 3rd Front, in Caquetá. He called his tax on coca growers 'gramaje,' a fee on each gram of semi-processed cocaine. The leaders wrote that by taxing poor growers he favored 'the big export mafias.'","ELN":"National Liberation Army, a Marxist-Leninist guerrilla group formed in July 1964 by radical student and social activists influenced by the Cuban Revolution. Its program centered on armed struggle to take power. It announced itself on 7 January 1965 by seizing Simacota, in Santander.","EPL":"Popular Liberation Army, a Maoist guerrilla group founded in 1967 as the armed wing of a breakaway from Colombia's Communist Party. It believed in a long people's war carried from the countryside to the cities. Its strongest bases were in the cattle lands of Córdoba and Sucre.","M-19":"The 19th of April Movement, an urban guerrilla group formed in 1973. Its leaders came from the left wing of Rojas's party, supporters of Golconda, a group of Catholic priests, and disillusioned members of FARC and the Communist Party. In 1974, it stole Simón Bolívar's sword from a Bogotá museum.","AUC":"United Self-Defense Forces of Colombia, a national federation formed in 1997 when the heads of 9 paramilitary groups united under a single command. It called itself an anti-guerrilla movement. Led by Carlos Castaño, it then began the largest paramilitary expansion yet, across the whole country.","MAS":"Death to Kidnappers (Muerte a Secuestradores), an armed group that cocaine traffickers created in late 1981 rather than pay the M-19 a $12 million ransom. On 2 December a plane dropped its letter over a Cali football stadium, promising to find and execute kidnappers, criminal and guerrilla alike.","Patriotic Union":"Unión Patriótica (UP), a party founded on 28 May 1985 out of the FARC's peace talks with the government. By its own count, it formed 2,229 local committees in 209 municipalities that year. Its November 1985 congress drew the FARC, the Communist Party, and independent Liberals and Conservatives.","Comunes":"The political party formed by the FARC's former leaders under the 2016 peace deal. It was first called the Common Alternative Revolutionary Force, keeping the initials FARC, and later renamed Comunes, Spanish for 'the common people.' In September 2017 it elected Timochenko, the FARC's last commander, as its president.","Urabeños":"Spanish for 'the men from Urabá,' a region of Antioquia, and the name of a drug-trafficking armed group also called the Gulf Clan or the Gaitanist Self-Defense Forces. It formed in 2006, when the paramilitary commander Vicente Castaño left the AUC's demobilization and rearmed a paramilitary unit.","chulavitas":"A police force set up in Boyacá, which the Truth Commission calls the instrument of violence of Ospina's Conservative government. After Gaitán's murder in 1948, a union leader recalled, the state sent the chulavitas as its elite force to Barrancabermeja, a Santander oil town whose workers had risen up.","limpios":"Spanish for 'the clean ones,' the Liberal fighters of southern Tolima in La Violencia. Many were sharecroppers, tenants, and day laborers on Liberal landowners' estates, serving them even with arms. The Truth Commission writes that they used methods like the chulavitas' and went out to hunt Conservatives.","bandoleros":"Spanish for 'bandits,' the name party leaders gave to local rebels who stayed in arms, to distance themselves from them. The label was used for Liberal, Conservative, and Communist bands. Historians cited by the Truth Commission write that they had local support and served local bosses as enforcers.","paramilitaries":"Armed groups that fought the guerrillas and attacked civilians they saw as enemies within. They grew out of a December 1965 decree, made permanent law in 1968, that let civilians arm themselves in support of the security forces.","Paramilitaries":"Armed groups that fought the guerrillas and attacked civilians they saw as enemies within. They grew out of a December 1965 decree, made permanent law in 1968, that let civilians arm themselves in support of the security forces.","Tolima":"A department, or province, in the Andean region of west-central Colombia, crossed by the Central Mountain Range. The memory center writes that in La Violencia, landowners there took revenge on peasants for the land struggles of the 1920s and 1930s.","Sumapaz":"An area of Cundinamarca and a center of peasant land struggles since the 1920s. Its best-known peasant leader, Juan de la Cruz Varela, moved from the Liberals to the Communists. He recalled that nobody recruited him: he asked to join, drawn by a comrade's praise of the Soviet Union.","Llanos":"Spanish for 'plains,' Colombia's eastern plains, in Meta, Casanare, Arauca, and Vichada. Their Liberal guerrillas were the best armed of La Violencia and seized military bases and towns. Landowners first backed them, then broke with them when they took up the defense of land and farmhands.","Marquetalia":"A remote Communist peasant settlement in Planadas, in the far south of Tolima. Its founders went there to regain influence in Tolima and Huila. The place, first called El Támaro, lay near the Nevado del Huila, a snow-capped volcano.","Riochiquito":"A Communist peasant settlement in Tierradentro, Cauca, led by Ciro Trujillo, a Liberal guerrilla who had turned Communist. He founded a farmers' union there that gave land to former fighters and built schools and roads.","El Pato":"A Communist peasant settlement on the border of Huila and Caquetá. After the army attacked Villarrica in 1955, Communist guerrillas led hundreds of families down the Duda River in 'marching columns,' modeled on Mao's Long March, and settled new land there while keeping their weapons.","Guayabero":"A Communist peasant settlement in Meta, near El Pato. Like El Pato, it was settled after 1955 by families who fled the army's attack on Villarrica and came down the Duda River with Communist guerrillas.","Magdalena Medio":"Spanish for 'Middle Magdalena,' the lowland middle valley of the Magdalena River, between Antioquia, Bolívar, and Santander. The memory center writes that it had a reputation as a rebellious region, and that by the early 1980s the FARC was expanding into it.","Caquetá":"A department, or province, of southern Colombia, on the farming frontier where settlers fleeing repression and landlords' pressure took up new land. After the army's 1955 attack on Villarrica, Communist families settled at El Pato, on its border with Huila.","Catatumbo":"A region of Norte de Santander, in northeastern Colombia on the Venezuelan border, and Colombia's largest coca-growing area, by UN figures. In January 2025 the ELN attacked a FARC dissident group there. Dozens were killed, among them former FARC fighters, and thousands of civilians fled.","Villarrica":"A town in eastern Tolima where the Sumapaz leader Juan de la Cruz Varela kept a self-defense group, handing in only some weapons in 1953. After the army's 1955 attack, guerrillas led hundreds of families down the Duda River in 'marching columns,' modeled on Mao's Long March.","La Uribe":"A town in Meta, home of Casa Verde ('Green House'), the FARC's central camp, and the place that gave its name to the 1984 accords between the FARC and the government. Casa Verde sat in the upper canyon of the Duda River, at the edge of the Sumapaz moorland.","Mitú":"The capital of Vaupés, in the Amazon basin of southeastern Colombia, reachable only by air or river. On 1 November 1998 more than 1,000 FARC fighters surrounded it, knowing help would be slow: the nearest bases were 300 and 450 km away, beyond the air force's range.","National Front":"The 1957 pact in which the Liberals and Conservatives shared power equally and kept other parties out. The Truth Commission writes that the Communists backed it anyway, but that it led some on the left to see arms as the only route to the reforms blocked before.","La Violencia":"Spanish for 'the Violence,' the killing between Liberals and Conservatives that the memory center dates from 1946 to 1958. Armed groups on all sides committed massacres. In some areas landowners also took revenge for earlier peasant land struggles, seizing about 2 million hectares, by the analyst Paul Oquist's estimate.","Bogotazo":"The riots in Bogotá after the Liberal leader Jorge Eliécer Gaitán was shot dead on 9 April 1948, named from 'Bogotá' plus a Spanish ending for a violent outburst. The 10-hour riot left much of downtown Bogotá destroyed, and crowds sacked ministries and other public buildings.","Truth Commission":"Colombia's Truth Commission, which investigated the armed conflict and released its final report on 28 June 2022. In 4 years of work it held about 14,000 interviews. This page draws much of its history from that report.","National Center for Historical Memory":"Colombia's National Center for Historical Memory, a state body created in 2011 by the law on victims of the armed conflict. Its 2013 report, ¡Basta Ya! (Enough Already!), counted at least 220,000 people killed in the war from 1958 to 2012, about 8 in 10 of them civilians.","memory center":"Colombia's National Center for Historical Memory, a state body created in 2011 by the law on victims of the armed conflict. Its 2013 report, ¡Basta Ya! (Enough Already!), counted at least 220,000 people killed in the war from 1958 to 2012, about 8 in 10 of them civilians.","JEP":"The Special Jurisdiction for Peace, the court the 2016 deal created to try crimes of the war by FARC members and state agents. Reparation work for those who confess lasts 5 to 8 years. For the gravest crimes, those convicted without confessing face 15 to 20 years in prison.","Plan Colombia":"A plan President Andrés Pastrana launched in 1999 to end the war, stop drug trafficking, and promote development. It was to cost $7.5 billion, with Colombia paying $4 billion. In all, the US Congress gave it about $10 billion.","InSight Crime":"A think tank and media group that studies organized crime in the Americas, with main offices in Medellín and Washington. This page draws on its reporting on the FARC and on the armed groups that broke away from it.","Plan Lazo":"The army's early-1960s plan to defeat the guerrillas (lazo means a rope or snare). Its designer, War Minister Alberto Ruiz Novoa, said its aim was 'taking the water from the fish': cutting the guerrillas off from peasant support, with army aid to villages mattering more than combat.","Casa Verde":"The FARC's central headquarters (Casa Verde means Green House), in La Uribe, Meta, in the Duda River canyon at the edge of the Sumapaz highlands. The general who led the attack on it recalled helicopters bringing politicians, church representatives, and international delegations there during President Belisario Betancur's peace process.","Second Marquetalia":"An armed group of former FARC commanders led by Iván Márquez. Its name recalls Marquetalia, where the army's 1964 attack is taken as the birth of the FARC. InSight Crime reports that its base since 2019 has been Venezuela's Apure state.","False positives":"Civilians killed by soldiers and presented as guerrillas killed in combat. The scandal broke in 2008, when the bodies of 19 young men from Soacha and southern Bogotá were found in a mass grave in Ocaña, Norte de Santander. In October 2008, 27 members of the military were dismissed.","de la Espriella":"Abelardo de la Espriella, a right-wing lawyer who became president of Colombia on 7 August 2026. On 7 September 2026 his government shut down the remaining talks with criminal groups that had run since 2022 under President Gustavo Petro.","Gabriel Turbay":"A Liberal politician and one of the party's 2 candidates for president in 1946. The Truth Commission writes that the Liberals together were a majority of voters. Turbay then left the country and died, which left Gaitán as party leader.","Marta Nieves Ochoa":"A woman kidnapped on the University of Antioquia campus in Medellín on 12 November 1981. Her kidnappers asked her brothers, the Ochoas, known members of the Medellín cocaine cartel, for $12 million in ransom. Her brothers did not pay.","Íngrid Betancourt":"A presidential candidate of the Green Oxygen Party. Her captivity kept France's government interested in her release, which gave the FARC political leverage. In July 2008 the security forces rescued her, 3 Americans, and 11 soldiers and police without bloodshed.","Manuel Pérez":"A Spanish priest, known as 'El Cura' (the Priest), who led the ELN guerrillas. The Truth Commission writes that in 1983 the ELN set a plan to grow under a single leadership.","El Paisa":"Hernán Darío Velásquez, a former FARC commander and a commander of the Second Marquetalia. He had led the FARC's Teófilo Forero column in Huila and Caquetá. Authorities found that he ordered the FARC's February 2003 car bomb at El Nogal, a Bogotá club, which killed more than 30 people.","Romaña":"Henry Castellanos Garzón, a former FARC commander who became a commander of the Second Marquetalia. From 1994 he led the 53rd Front, a FARC unit, and was known for kidnapping travelers at random on national highways. In 2014 he joined the FARC's delegation to the peace talks in Cuba.","Communist Party":"Colombia's Communist Party, founded in 1930 with the approval of the Communist International. It worked through peasant leagues and farm workers' unions, and Moscow told it to stay in legal politics. In the 1930s the Liberals, not the Communists, won over most of the discontented.","Liberals":"Supporters of the Liberal Party, one of Colombia's 2 major parties. In the Thousand Days' War, from 1899 to 1902, the Liberals fought the government, and about 100,000 people died by the lowest estimate.","Conservatives":"Supporters of the Conservative Party, one of Colombia's 2 major parties. Before 1930 its governments relied on the Catholic Church, which under an 1887 treaty with the Vatican acted for the state in education.","Cold War":"The rivalry between the United States and the Soviet Union and their allies, from the end of the Second World War to 1991. Colombia's government joined the anticommunist campaign and broke relations with Cuba, accusing it of funding and arming Colombian guerrillas.","El Davis":"A farm in Rioblanco, in southern Tolima, where Liberal and Communist families gathered to protect themselves from Conservative persecution. At least 5,000 people sheltered there, only about 250 of them armed.","Agrarian Program":"The program the guerrillas signed on 20 July 1964, one of the founding texts of the FARC. It called for a revolutionary land reform: confiscating the large estates and giving the land, free of charge, to the peasants who worked it or wanted to.","Las Delicias":"An army base in Putumayo, home to a battalion hunting cocaine labs. The Truth Commission writes that the FARC's capture of the base was a turning point, because similar attacks followed. In June 1997, under a deal with the government, the FARC freed the soldiers taken there.","El Billar":"A village in the municipality of Cartagena del Chairá, in Caquetá. Most of the soldiers the FARC ambushed there belonged to an elite army unit. The memory center's counts of soldiers killed range from 58 to 73, and the FARC took at least 26 prisoners.","Mapiripán":"A town in Meta where AUC paramilitaries massacred civilians in July 1997. About 100 of them had flown into the airport of San José del Guaviare, held by the army and the antinarcotics police, and soldiers picked them up without any check.","Caño Limón":"An oil field in Arauca, which gave its name to the Caño Limón-Coveñas oil pipeline. Colombia's National Center for Historical Memory writes that the field's discovery forced Occidental Petroleum and the other oil companies to treat the ELN guerrillas as a power in Arauca.","Laureano Gómez":"The Conservative Party's leader, elected president in 1949. The Truth Commission writes that he played a leading part in sowing partisan hatred. After Gaitán's murder he blamed the Communists, without evidence.","comunes":"A nickname for the peasant fighters of southern Tolima who had turned Communist, as opposed to the limpios ('the clean ones'), the Liberal fighters. Liberal local bosses gave both groups these names. The comunes were young men without land, in conflict with those same bosses.","self-defense groups":"Armed peasant groups formed to defend their own communities. The Communist ones, among Colombia's first guerrilla groups, settled mainly in the province of Tequendama, in Sumapaz, and in southern Tolima."},"tag_options":["Grievances","Selective incentives","Social sanctions","Force","Something else"],"tag_question":"Which idea from the course explains this stage best? Pick one, then argue it out."};

<script>/* ui.js — everything the student sees and clicks.

   The pure logic lives in core.js; this file renders screens, keeps the state
   in localStorage, opens the locked screens when the classroom code is typed,
   plays the surprise, and writes the receipt. It touches no network: there is
   no fetch, no font, and no image that is not beside the page. */
(function (root) {
  "use strict";

  const CORE = root.SIMCORE;
  const RULES = root.RULES || {};
  const DATA = root.DATA;
  const LOCKED = root.LOCKED;
  const KEY = "sim:" + DATA.id;

  let state = CORE.emptyState(DATA.build);
  let screens = [];
  let opened = null;          // the after-screens, once the code is in
  let soundOn = false;
  let stageRun = 0;

  /* ---------------------------------------------------------------- tools */
  const $ = (sel, node) => (node || document).querySelector(sel);
  const $$ = (sel, node) => Array.prototype.slice.call((node || document).querySelectorAll(sel));

  function el(tag, cls, html) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (html != null) node.innerHTML = html;
    return node;
  }

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function fromBase64(value) {
    const binary = atob(value);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  function notice(text, kind) {
    const node = $("#notice");
    if (!node) return;
    if (!text) { node.hidden = true; node.textContent = ""; return; }
    node.className = "notice" + (kind ? " " + kind : "");
    node.textContent = text;
    node.hidden = false;
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (err) {
      notice("This browser is not saving your work. Keep the tab open until you have copied your answers.", "warn");
    }
  }

  function load() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (err) { saved = null; }
    const restored = CORE.restore(saved, DATA.build);
    if (restored.dropped) {
      notice("This page was rebuilt since you last opened it, so the earlier answers were cleared.", "warn");
    }
    return restored.state;
  }

  function rule(name, extra) {
    return CORE.run(RULES, name, state, dataForRules(), extra);
  }

  /* Rules see the screens that are open. Before the code, the locked screens
     are not there, which is also true for the student. */
  function dataForRules() {
    return Object.assign({}, DATA, { screens: screens });
  }

  function screenById(id) {
    for (let i = 0; i < screens.length; i += 1) if (screens[i].id === id) return screens[i];
    return null;
  }

  function optionById(id) {
    return CORE.index(dataForRules())[id] || null;
  }

  function value(spec) {
    if (!spec) return "";
    const raw = spec.rule ? rule(spec.rule) : spec.value;
    if (raw && typeof raw === "object") return String(raw.text == null ? "" : raw.text);
    const body = CORE.formatValue(raw, spec.format, spec.digits);
    return (spec.prefix || "") + body + (spec.suffix ? " " + spec.suffix : "");
  }

  function sourceLine(id) {
    const source = (DATA.sources || []).filter(s => s.id === id)[0];
    return source ? source.text : "";
  }

  /* ------------------------------------------------------------ the shell */
  function go(id) {
    state.screen = id;
    save();
    render();
    window.scrollTo({ top: 0, behavior: "instant" });
  }

  function currentScreen() {
    return screenById(state.screen) || screens[0];
  }

  function render() {
    glossSeen = new Set();
    const screen = currentScreen();
    const app = $("#app");
    app.innerHTML = "";
    const kinds = {
      brief: renderBrief, choose: renderChoose, hold: renderHold, respond: renderRespond,
      write: renderWrite, outcome: renderOutcome, receipt: renderReceipt, surprise: renderSurpriseGate,
      custom: renderCustom, stage: renderStage, record: renderRecord
    };
    (kinds[screen.kind] || renderCustom)(screen, app);
  }

  function nextScreenId(id) {
    for (let i = 0; i < screens.length; i += 1) {
      if (screens[i].id === id && screens[i + 1]) return screens[i + 1].id;
    }
    return id;
  }

  function optionCard(option, screen) {
    const on = state.choices[option.id] != null;
    const card = el("div", "opt" + (on ? " on" : ""));
    const row = el("div", "oh");

    const tick = el("button", "chk", on ? "✓" : "");
    tick.type = "button";
    tick.setAttribute("aria-pressed", on ? "true" : "false");
    tick.setAttribute("aria-label", (on ? "Remove " : "Add ") + option.name);
    tick.addEventListener("click", () => {
      if (state.choices[option.id] != null) delete state.choices[option.id];
      else state.choices[option.id] = option.high == null ? 1 : 0.5;
      save();
      render();
    });
    row.appendChild(tick);

    const body = el("div", "obody");
    const details = el("details");
    const summary = el("summary");
    summary.appendChild(el("span", "otitle", esc(option.name)));
    details.appendChild(summary);
    if (option.description) details.appendChild(el("p", "odesc", esc(option.description)));
    (option.detail || []).forEach(d => {
      const line = el("p", "odetail");
      line.appendChild(el("strong", null, esc(d.label) + ": "));
      line.appendChild(document.createTextNode(d.text));
      details.appendChild(line);
    });
    if (option.source) details.appendChild(el("p", "osource", esc(sourceLine(option.source))));
    body.appendChild(details);

    if (option.tags && option.tags.length) {
      const tags = el("div", "otags");
      option.tags.forEach(t => tags.appendChild(el("span", "tag", esc(t))));
      body.appendChild(tags);
    }

    /* What this one choice does, on the row where the choice is made. A total a
       student cannot take apart is a total nobody trusts. */
    if (on && screen.row_rule) {
      let line = "";
      try { line = rule(screen.row_rule, { option: option }); } catch (err) { line = ""; }
      if (line) body.appendChild(el("p", "orow", esc(line)));
    }

    if (on && option.high != null) {
      const range = el("div", "orange");
      range.appendChild(el("span", "oscale", esc(CORE.formatValue(option.low, option.format || "int"))));
      const slider = el("input");
      slider.type = "range";
      slider.min = "0";
      slider.max = "1";
      slider.step = "0.05";
      slider.value = String(state.choices[option.id]);
      slider.setAttribute("aria-label", "How big: " + option.name);
      slider.addEventListener("input", () => {
        state.choices[option.id] = parseFloat(slider.value);
        save();
        paintScore();
        const shown = card.querySelector(".oval");
        if (shown) shown.textContent = amountText(option);
      });
      range.appendChild(slider);
      range.appendChild(el("span", "oscale", esc(CORE.formatValue(option.high, option.format || "int"))));
      body.appendChild(range);
    }
    row.appendChild(body);
    row.appendChild(el("div", "oval", esc(amountText(option))));
    card.appendChild(row);
    return card;
  }

  function amountText(option) {
    const size = state.choices[option.id];

  /* ------------------------------------------------------------- 3. hold */
  function renderHold(screen, app) {
    const wrap = el("div", "stagewrap hold");

      });

    }

    const form = el("div", "codebox");
    const label = el("label", null, esc(screen.code_label || "The code on the screen at the front"));
    label.setAttribute("for", "code");

    input.type = "text";
    input.autocomplete = "off";
    input.setAttribute("aria-label", "The code on the screen");
    const button = el("button", "btn", "Continue");
    button.type = "button";
    const said = el("p", "codemsg");

    async function tryCode() {
      said.textContent = "Checking…";
      const ok = await unlock(input.value);
      if (!ok) {
        said.textContent = "That code is not right. Check the screen.";
        said.className = "codemsg bad";
        return;
      }

    input.addEventListener("keydown", event => { if (event.key === "Enter") tryCode(); });

    form.appendChild(label);
    form.appendChild(input);
    form.appendChild(button);
    form.appendChild(said);
    wrap.appendChild(form);

    /* A saved stage call cannot be changed, so there is nothing to go back to. */
    const previous = screens[screens.indexOf(screen) - 1];
    if (previous && previous.kind !== "stage") {
      const back = el("button", "btn ghost", "Go back and change our answers");
      back.type = "button";

    }
    app.appendChild(wrap);

  /* The locked screens are AES-GCM ciphertext until the classroom code opens
     them, so a student who opens the address early sees nothing of what comes. */
  async function unlock(code) {
    const clean = CORE.normalizeCode(code);
    if (!clean || !LOCKED || !LOCKED.data) return false;
    try {
      const enc = new TextEncoder();
      const raw = await crypto.subtle.importKey("raw", enc.encode(clean), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: fromBase64(LOCKED.salt), iterations: LOCKED.iter, hash: "SHA-256" },
        raw, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: fromBase64(LOCKED.iv) }, key, fromBase64(LOCKED.data));
      opened = JSON.parse(new TextDecoder().decode(plain));
      state.unlocked = true;
      state.code = clean;
      mergeOpened();
      save();
      return true;
    } catch (err) {
      return false;
    }
  }

  function mergeOpened() {
    if (!opened || !opened.screens) return;
    const byId = {};
    opened.screens.forEach(s => { byId[s.id] = s; });
    screens = screens.map(s => (byId[s.id] ? byId[s.id] : s));
  }

  /* --------------------------------------------------------- 4. surprise */
  function renderSurpriseGate(screen, app) {
    const wrap = el("div", "stagewrap");
    wrap.appendChild(el("h1", null, esc(screen.headline || "Watch the screen.")));
    const play = el("button", "btn big", "Play it");

    play.addEventListener("click", () => playSurprise(screen));
    wrap.appendChild(play);
    app.appendChild(wrap);
    playSurprise(screen);
  }

  function variantFor(screen) {
    let key = null;
    try { key = screen.pick_rule ? rule(screen.pick_rule) : null; } catch (err) { key = null; }
    const variants = screen.variants || {};
    return variants[key] || variants.default || variants[Object.keys(variants)[0]] || { beats: [] };
  }

  function playSurprise(screen) {
    const run = ++stageRun;
    const stage = $("#stage");
    const variant = variantFor(screen);
    const picked = variant.option ? optionById(variant.option) : null;
    const vars = {
      names: state.names || "your group",
      option: picked ? picked.name : (variant.label || ""),
      amount: picked ? amountText(picked) : ""
    };
    const beats = (variant.beats || []).map(beat => Object.assign({}, beat, {
      text: CORE.fill(beat.text, vars),
      say: CORE.fill(beat.say || beat.text, vars)
    }));

    stage.innerHTML = "";
    stage.hidden = false;
    stage.setAttribute("aria-hidden", "false");
    document.body.classList.add("staged");

    const frame = el("div", "beatframe");
    const media = el("div", "beatmedia");
    const text = el("div", "beattext");
    const label = el("div", "simlabel", esc(DATA.label || "Simulated for a class exercise"));
    const controls = el("div", "beatctl");
    const sound = el("button", null, soundOn ? "Sound on" : "Sound off");
    const replay = el("button", null, "Play it again");
    const skip = el("button", null, esc(screen.skip_label || "Skip ahead"));
    const next = el("button", "next", esc(screen.continue_label || "Continue"));
    next.hidden = true;
    /* No sound on this site: the news plays as text only. */
    controls.appendChild(replay);
    controls.appendChild(skip);
    frame.appendChild(media);
    frame.appendChild(text);
    frame.appendChild(label);
    frame.appendChild(controls);
    frame.appendChild(next);
    stage.appendChild(frame);

    sound.addEventListener("click", () => {
      soundOn = !soundOn;
      sound.textContent = soundOn ? "Sound on" : "Sound off";
      if (!soundOn) stopSpeech();
    });
    replay.addEventListener("click", () => playSurprise(screen));
    skip.addEventListener("click", () => finish());
    next.addEventListener("click", () => finish());

    function finish() {
      if (run !== stageRun) return;
      stopSpeech();
      stage.hidden = true;
      stage.setAttribute("aria-hidden", "true");
      document.body.classList.remove("staged");
      go(nextScreenId(screen.id));
    }

    let index = 0;
    function beat() {
      if (run !== stageRun) return;
      if (index >= beats.length) {
        next.hidden = false;
        next.focus();
        return;
      }
      const item = beats[index];
      index += 1;
      frame.className = "beatframe " + (item.kind || "line");
      media.innerHTML = "";
      if (item.file) {
        const img = el("img");
        img.src = item.file;
        img.alt = item.alt || "";
        media.appendChild(img);
        if (item.credit) media.appendChild(el("span", "credit", esc(item.credit)));
      }
      text.innerHTML = "";
      if (item.stamp) text.appendChild(el("span", "stamp", esc(item.stamp)));
      if (item.figure_rule) {
        let figure = "";
        try { figure = CORE.formatValue(rule(item.figure_rule), item.format || "int"); } catch (err) { figure = ""; }
        text.appendChild(el("span", "figure", esc(figure)));
      }
      text.appendChild(el("p", null, esc(item.text)));
      const ms = Math.max(item.min || 3200, estimateMs(item.text));
      speak(item.say, () => {});
      window.setTimeout(beat, ms);
    }
    beat();
  }

  function estimateMs(text) {
    const words = String(text || "").split(/\s+/).filter(Boolean).length;
    return 900 + words * 340;
  }

  /* Browser narration, with the four fixes Holbein's notes record: no blank
     utterance (it wedges Chrome's queue), a generation guard so a cancelled
     line cannot resume over the next one, a watchdog because onend sometimes
     never fires, and no resume() after a cancel. */
  let speechRun = 0;
  function speak(text, done) {
    const clean = String(text || "").trim();
    if (true || !soundOn || !clean || !("speechSynthesis" in window)) { if (done) done(); return; }
    const run = ++speechRun;
    try { window.speechSynthesis.cancel(); } catch (err) { /* nothing to cancel */ }
    const utterance = new SpeechSynthesisUtterance(clean);
    utterance.rate = 0.95;
    let finished = false;
    const finish = () => {
      if (finished || run !== speechRun) return;
      finished = true;
      if (done) done();
    };
    utterance.onend = finish;
    utterance.onerror = finish;
    window.setTimeout(finish, Math.max(2000, clean.length * 80));
    try { window.speechSynthesis.speak(utterance); } catch (err) { finish(); }
  }

  function stopSpeech() {
    speechRun += 1;
    try { if ("speechSynthesis" in window) window.speechSynthesis.cancel(); } catch (err) { /* fine */ }
  }

    const sent = state.sent > 0;

    const cards = el("div", "targets");
    targets.forEach(target => {
      const card = el("div", "target");

      }
      if (target.needs) {
        const p = el("p", "pos");
        p.appendChild(el("strong", null, "What they want: "));
        p.appendChild(document.createTextNode(target.needs));
        body.appendChild(p);
      }
      if (target.source) body.appendChild(el("p", "osource", esc(sourceLine(target.source))));
      const label = el("label", null, esc(screen.box_label || "Your message"));
      label.setAttribute("for", "t-" + target.id);
      const box = el("textarea");
      box.id = "t-" + target.id;
      box.rows = 4;
      box.value = state.texts[target.id] || "";
      box.addEventListener("input", () => {
        state.texts[target.id] = box.value;
        save();
      });
      body.appendChild(label);
      body.appendChild(box);
      card.appendChild(body);
      cards.appendChild(card);
    });
    wrap.appendChild(cards);

    if (sent) wrap.appendChild(resultsPanel(screen));

    const row = el("div", "row");
    const send = el("button", "btn", sent ? "Send these too" : (screen.send_label || "Send the messages"));
    send.type = "button";
    send.disabled = targets.length === 0;
    send.addEventListener("click", () => {
      const all = screen.targets || [];
      const scored = CORE.lockPitches(all, state.texts, state.moved,
        (target, text) => rule(screen.score_rule, { target: target, text: text }),
        screen.policy, state.sent);
      state.moved = scored.moved;
      state.sent += 1;
      save();
      render();
    });
    row.appendChild(send);
    if (sent) {
      const next = el("button", "btn", esc(screen.continue_label || "See where the count stands"));
      next.type = "button";
      next.addEventListener("click", () => go(nextScreenId(screen.id)));
      row.appendChild(next);
    }
    wrap.appendChild(row);
    app.appendChild(wrap);
  }

  function resultsPanel(screen) {
    const box = panel("What came back", null);
    (screen.targets || []).forEach(target => {
      const moved = !!state.moved[target.id];
      const row = el("div", "result " + (moved ? "yes" : "no"));
      row.appendChild(el("strong", null, esc(target.name)));
      /* A group that gets nothing but "not moved" learns nothing. When the
         score rule says what was missing, that line is the answer. */
      /* What happened decides the line. The score rule's own sentence explains
         it only when the two agree: a target that moved on the fallback must
         not be told it stayed put. */
      let why = moved ? (target.moved_line || "Comes with you.")
        : (target.open_line || "Still not with you.");
      if (screen.score_rule && !moved) {
        const text = String(state.texts[target.id] || "").trim();
        let scored = null;
        try { scored = rule(screen.score_rule, { target: target, text: text }); } catch (err) { scored = null; }
        if (scored && scored.why && !scored.ready) why = scored.why;
      }
      row.appendChild(el("span", null, esc(why)));
      box.body.appendChild(row);
    });
    return box.box;
  }

  /* ---------------------------------------------------------- 7. outcome */
  function renderOutcome(screen, app) {
    const wrap = el("div", "stagewrap wide");
    if (screen.headline) wrap.appendChild(el("h1", null, esc(screen.headline)));
    if (screen.intro) wrap.appendChild(el("p", "lede", esc(screen.intro)));

    tally.appendChild(el("span", "tn", esc(String(yes))));
    tally.appendChild(el("span", "tk", esc((screen.tally_label || "with you")

    const bar = el("div", "tbar");
    const fill = el("i");
    fill.style.width = Math.min(100, (yes / (screen.total || 100)) * 100) + "%";
    fill.className = yes >= screen.threshold ? "pass" : "fail";
    bar.appendChild(fill);
    const mark = el("u");
    mark.style.left = ((screen.threshold / (screen.total || 100)) * 100) + "%";
    bar.appendChild(mark);

      row.appendChild(head);
      if (bloc.why) row.appendChild(el("p", "bw", esc(bloc.why)));

    }

      back.type = "button";

      row.appendChild(back);
    }
    const next = el("button", "btn", esc(screen.continue_label || "Finish"));
    next.type = "button";
    next.addEventListener("click", () => go(nextScreenId(screen.id)));
    row.appendChild(next);
    wrap.appendChild(row);
    app.appendChild(wrap);
  }

  /* ---------------------------------------------------------- 8. receipt */
  function receiptContext() {
    const chosen = CORE.chosen(state, dataForRules()).map(option => ({
      name: option.name, value: amountText(option)
    }));
    const strategyScreen = screens.filter(s => s.kind === "respond")[0];
    const strategy = strategyScreen
      ? (strategyScreen.strategies || []).filter(s => s.id === state.strategy)[0]
      : null;
    const writeScreen = screens.filter(s => s.kind === "write")[0];
    const messages = writeScreen
      ? (writeScreen.targets || []).map(target => ({
        name: target.name, moved: !!state.moved[target.id], text: (state.texts[target.id] || "").trim()
      }))
      : [];
    const outcomeScreen = screens.filter(s => s.kind === "outcome")[0];
    let outcome = null;
    if (outcomeScreen) {
      const blocs = rule(outcomeScreen.blocs_rule) || [];
      const yes = blocs.filter(b => b.yes).reduce((total, b) => total + (Number(b.size) || 0), 0);
      outcome = {
        headline: yes + " of " + outcomeScreen.total + ", " + outcomeScreen.threshold + " needed",
        detail: yes >= outcomeScreen.threshold ? "It passes as it stands." : "It does not pass as it stands."
      };
    }
    const surpriseScreen = screens.filter(s => s.kind === "surprise")[0];
    let surprise = "";
    if (surpriseScreen && state.unlocked) {
      const variant = variantFor(surpriseScreen);
      surprise = variant.label || (variant.option ? (optionById(variant.option) || {}).name : "") || "";
    }
    return { choices: chosen, strategy: strategy, messages: messages, outcome: outcome, surprise: surprise, stages: stageContext() };
  }

    ctx.stats = (screen.stats || []).map(stat => ({ label: stat.label, value: value(stat) }));
    const wrap = el("div", "stagewrap receiptwrap");

      || "This is what your group hands in. Copy the text into the Blackboard item.")));

    card.appendChild(el("h1", null, esc(screen.title || DATA.title)));
    const namesLine = el("p", "names", esc(DATA.no_names
      ? "Group members: add every name to the file you download, or type them into Blackboard when you upload it."

    const sections = [

      ["What we chose", ctx.choices.map(c => c.name + " (" + c.value + ")")],

    ];
    sections.forEach(pair => {

      const list = el("ul");

      section.appendChild(list);
      card.appendChild(section);
    });
    if (screen.grade_note) card.appendChild(el("p", "grade-note", esc(screen.grade_note)));
    wrap.appendChild(card);

    const row = el("div", "row");
    const copy = el("button", "btn", "Copy the text for Blackboard");
    copy.type = "button";
    copy.addEventListener("click", () => {
      const text = CORE.receiptText(state, DATA, ctx);
      const area = el("textarea", "offscreen");
      area.value = text;
      document.body.appendChild(area);
      area.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
      document.body.removeChild(area);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => { copy.textContent = "Copied"; }, () => {});
      }
      copy.textContent = ok ? "Copied" : "Select the text below and copy it";
      if (!ok) {
        const fallback = el("textarea", "fallback");
        fallback.value = text;
        fallback.rows = 12;
        wrap.appendChild(fallback);
      }
    });
    /* The other way to hand it in: a file the group uploads to Blackboard, for
       a room where pasting into a text box goes wrong. */
    const download = el("button", "btn ghost", esc(screen.download_label || "Download our answers"));
    download.type = "button";
    download.addEventListener("click", () => {
      const text = CORE.receiptText(state, DATA, ctx);
      const blob = new Blob([text], { type: "text/plain" });
      const link = el("a");
      link.href = URL.createObjectURL(blob);
      link.download = CORE.fileName(state, DATA);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      window.setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      download.textContent = "Downloaded " + CORE.fileName(state, DATA);
    });

    const print = el("button", "btn ghost", "Print");
    print.type = "button";
    print.addEventListener("click", () => window.print());
    if (DATA.no_names) {
      download.className = "btn";
      copy.className = "btn ghost";

      row.appendChild(copy);
      row.appendChild(download);
