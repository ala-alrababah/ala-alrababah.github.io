<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Colombia's war, 1946 to today</title>
<!-- Built by group-session/sim/make_sim.mjs from sim.json and sim_rules.js.
     Everything the page needs is inside this file or in the media folder beside
     it: no fonts, no scripts, and no images from the internet, so the page runs
     the same from the site and from the offline copy. Build e0a3940724c7. -->
<style>/* engine.css — the whole look of a simulation page. System fonts only: the page
   must load nothing from the internet, so it also runs from the offline copy. */
:root {
  --bg: #eef0f4; --panel: #ffffff; --panel-2: #f5f7fa; --ink: #131a26; --ink-2: #3a4560;
  --muted: #667089; --rule: #d5dae3; --rule-soft: #e6eaf1; --ui: #2a3c63;
  --good: #00705f; --good-bg: #e2f0ec; --bad: #b8402a; --bad-bg: #f9e7e2;
  --warn: #8a5a08; --warn-bg: #fbf0dc;
  --shadow: 0 1px 2px rgba(19, 26, 38, .06), 0 12px 30px -22px rgba(19, 26, 38, .5);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a0f18; --panel: #131a27; --panel-2: #0e1420; --ink: #e9eef7; --ink-2: #b6c1d6;
    --muted: #8390a8; --rule: #232d43; --rule-soft: #1a2233; --ui: #a8bbe8;
    --good: #2aa189; --good-bg: #0c2e28; --bad: #dd6242; --bad-bg: #361b14;
    --warn: #dfa83e; --warn-bg: #33260f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 12px 30px -22px rgba(0, 0, 0, 1);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
body.staged { overflow: hidden; }
h1 { font-size: clamp(26px, 3.6vw, 40px); line-height: 1.08; letter-spacing: -.02em; margin: 6px 0 12px; }
h2 { font-size: 18px; margin: 22px 0 8px; }
h3 { font-size: 17px; margin: 0 0 4px; }
p { margin: 0 0 12px; }
a { color: var(--ui); }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible {
  outline: 2px solid var(--ui); outline-offset: 2px;
}
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- top bar */
.topbar {
  position: sticky; top: 0; z-index: 40; background: var(--panel);
  border-bottom: 1px solid var(--rule); padding: 10px 20px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.brand { margin-right: auto; display: flex; flex-direction: column; }
.brand .name { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.brand .sub { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tabs { display: flex; gap: 2px; }
.tabs button {
  background: none; border: 1px solid transparent; color: var(--muted); font-size: 13px; padding: 6px 12px;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--rule); background: var(--panel-2); }
.topbar .ghost {
  background: var(--panel-2); border: 1px solid var(--rule); color: var(--ink-2);
  font-size: 12px; padding: 6px 10px;
}
.notice {
  margin: 0; padding: 10px 20px; background: var(--warn-bg); color: var(--warn);
  border-bottom: 1px solid var(--rule); font-size: 14px;
}
.notice.warn { background: var(--warn-bg); color: var(--warn); }

/* ----------------------------------------------------------------- layout */
main, .how { max-width: 1180px; margin: 0 auto; padding: 26px 20px 120px; }
.stagewrap { max-width: 860px; margin: 0 auto; }
.stagewrap.wide { max-width: 1100px; }
.kicker { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0; }
.lede { font-size: 18px; color: var(--ink-2); max-width: 68ch; }
.panel { background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); margin: 18px 0; }
.panel-h {
  padding: 10px 15px; border-bottom: 1px solid var(--rule); font-size: 11px;
  letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  display: flex; justify-content: space-between; gap: 10px;
}
.panel-b { padding: 14px 15px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
.btn {
  background: var(--ui); color: #fff; border: 1px solid var(--ui); padding: 11px 22px;
  font-weight: 600; font-size: 15px;
}
.btn:hover { filter: brightness(1.12); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: none; color: var(--ink-2); border-color: var(--rule); }
.btn.big { padding: 13px 28px; font-size: 16px; }
.tag {
  font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  border: 1px solid var(--rule); color: var(--muted); padding: 1px 7px; margin-right: 6px;
}

/* ------------------------------------------------------------------ brief */
.brief-main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, .55fr); gap: 22px; margin-top: 22px; }
.brief-copy { min-width: 0; }
.memo { background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); padding: 22px 24px; }
.memo-h { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; margin: 0 0 14px;
  padding-bottom: 12px; border-bottom: 2px solid var(--ink); font-size: 13px; }
.memo-h dt { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
.memo-h dd { margin: 0; }
.steps { background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); padding: 18px 22px; margin-top: 18px; }
.steps ol { margin: 0; padding-left: 20px; color: var(--ink-2); }
.steps li { margin-bottom: 6px; }
.deliverable { margin: 14px 0 0; padding: 10px 12px; border-left: 3px solid var(--ui); background: var(--panel-2); font-size: 14px; }
.grade-note { margin: 12px 0 0; padding: 10px 12px; border: 1px solid var(--warn); background: var(--warn-bg); color: var(--ink-2); font-size: 14px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); margin-top: 20px; }
.tiles div { background: var(--panel); padding: 14px 16px; }
.tiles .n { font-size: 24px; font-weight: 700; display: block; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tiles .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: block; margin-top: 3px; }
.tiles .src { font-size: 11px; color: var(--muted); display: block; margin-top: 6px; }
.brief-photos { display: flex; flex-direction: column; gap: 14px; }
.brief-photos figure { margin: 0; border: 1px solid var(--rule); background: var(--panel); box-shadow: var(--shadow); }
.brief-photos img { width: 100%; display: block; }
.brief-photos figcaption { font-size: 11px; color: var(--muted); padding: 6px 8px; }
.startrow { margin-top: 26px; display: grid; gap: 8px; max-width: 640px; }
.startrow label { font-weight: 700; font-size: 14px; }
textarea, input[type="text"] {
  font: inherit; width: 100%; background: var(--panel); color: var(--ink);
  border: 1px solid var(--rule); padding: 10px 12px; resize: vertical;
}
.startrow { background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); padding: 18px 20px; }
.startrow .hint { font-size: 13.5px; color: var(--muted); margin: 0; }
.startrow .namemsg { font-size: 13px; color: var(--muted); margin: 0; min-height: 18px; }
.startrow .btn { justify-self: start; }
.namefix { margin-top: 8px; font-size: 13px; color: var(--muted); }
.namefix summary { cursor: pointer; }
.namefix textarea { margin-top: 6px; }

/* ----------------------------------------------------------------- choose */
.choose { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; margin-top: 18px; }
.options { background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); }
.cat { padding: 14px 16px 0; }
.cat h2 { margin: 6px 0 2px; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.catnote { font-size: 13px; color: var(--ink-2); }
.opt { border-bottom: 1px solid var(--rule-soft); padding: 14px 16px; }
.opt.on { background: var(--panel-2); }
.oh { display: flex; gap: 12px; align-items: flex-start; }
.chk { width: 20px; height: 20px; border: 1.5px solid var(--rule); background: var(--panel); color: #fff; padding: 0; flex: 0 0 auto; }
.opt.on .chk { background: var(--ui); border-color: var(--ui); }
.obody { flex: 1; min-width: 0; }
.opt summary { cursor: pointer; list-style: none; }
.opt summary::-webkit-details-marker { display: none; }
.otitle { font-weight: 600; }
.odesc { font-size: 14px; color: var(--ink-2); margin: 4px 0 0; }
.odetail { font-size: 13.5px; color: var(--ink-2); margin: 6px 0 0; }
.osource { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.orow { font-size: 13.5px; color: var(--ui); margin: 8px 0 0; font-variant-numeric: tabular-nums; }
.otags { margin-top: 8px; }
.orange { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.orange input[type="range"] { flex: 1; accent-color: var(--ui); }
.oscale { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.oval { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.score { position: sticky; top: 76px; background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); padding: 16px; }
.score h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.big-n { padding: 10px 0; border-bottom: 1px solid var(--rule-soft); }
.big-n .k { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: block; }
.big-n .v { font-size: 28px; font-weight: 700; letter-spacing: -.03em; display: block; font-variant-numeric: tabular-nums; }
.big-n .s { font-size: 13px; color: var(--muted); display: block; }
.howlink {
  margin-top: 12px; background: none; border: 0; padding: 0; color: var(--ui);
  font-size: 13px; text-decoration: underline; text-underline-offset: 3px;
}
.flags { margin-top: 12px; display: grid; gap: 8px; }
.flag { display: flex; gap: 8px; font-size: 13px; color: var(--ink-2); }
.flag .fi { flex: 0 0 auto; border: 1px solid currentColor; padding: 0 5px; height: 18px; line-height: 16px; font-size: 11px; }
.flag.bad .fi { color: var(--bad); }
.flag.good .fi { color: var(--good); }
.flag.warn .fi { color: var(--warn); }
/* The bar sticks to the bottom, so the list keeps room under it: without this
   the last choice sits behind the bar on a short screen. */
.choosewrap { padding-bottom: 96px; }
.submitbar {
  position: sticky; bottom: 0; margin-top: 18px; background: var(--panel); border: 1px solid var(--rule);
  padding: 12px 16px; display: flex; align-items: center; gap: 16px; justify-content: space-between;
}

/* ------------------------------------------------------------------- hold */
.hold { text-align: center; padding-top: 6vh; }
.hold .tiles { max-width: 640px; margin-left: auto; margin-right: auto; text-align: left; }
.codebox { max-width: 380px; margin: 26px auto 0; display: grid; gap: 8px; text-align: left; }
.codebox label { font-weight: 700; font-size: 14px; }
.codemsg { min-height: 20px; font-size: 14px; color: var(--muted); margin: 0; }
.codemsg.bad { color: var(--bad); }
.hold .btn.ghost { margin-top: 18px; }

/* --------------------------------------------------------------- surprise */
.stage { position: fixed; inset: 0; z-index: 90; background: #05070b; display: grid; place-items: center; }
.stage[hidden] { display: none; }
.beatframe { position: relative; width: 100%; height: 100%; display: grid; place-items: center; overflow: hidden; }
.beatmedia { position: absolute; inset: 0; }
.beatmedia img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.25) contrast(1.1) brightness(.55); }
.beatmedia .credit { position: absolute; right: 10px; top: 10px; font-size: 10px; color: rgba(255, 255, 255, .55); }
.beattext { position: relative; z-index: 2; max-width: 92vw; padding: 0 6vw; text-align: center; color: #f7f6f3; }
.beattext .stamp { display: block; font-size: 13px; letter-spacing: .24em; text-transform: uppercase; color: #e0754f; margin-bottom: 18px; }
.beattext .figure { display: block; font-size: clamp(48px, 11vw, 130px); font-weight: 700; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.beattext p { font-size: clamp(24px, 4.4vw, 52px); line-height: 1.16; margin: 0 auto; max-width: 20ch; }
.beatframe.slate { background: #05070a; }
.beatframe.slate .beattext p { font-size: clamp(18px, 2.4vw, 30px); max-width: 44ch; line-height: 1.5; }
.beatframe.end { background: #7a1c0d; }
.beatframe.end .beattext p { font-size: clamp(30px, 6vw, 72px); font-weight: 700; max-width: 14ch; }
.simlabel {
  position: absolute; right: 16px; bottom: 16px; z-index: 3; font-size: 11px; letter-spacing: .14em;
  text-transform: uppercase; color: rgba(255, 255, 255, .72); border: 1px solid rgba(255, 255, 255, .3); padding: 4px 8px;
}
.beatctl { position: absolute; top: 16px; right: 16px; z-index: 3; display: flex; gap: 8px; }
.beatctl button {
  background: rgba(0, 0, 0, .5); border: 1px solid rgba(255, 255, 255, .34); color: #fff;
  font-size: 12px; letter-spacing: .1em; text-transform: uppercase; padding: 6px 12px;
}
.beatframe .next {
  position: absolute; left: 50%; bottom: 8vh; transform: translateX(-50%); z-index: 4;
  background: #fff; color: #10141b; border: 0; padding: 15px 26px; font-size: 13px;
  letter-spacing: .14em; text-transform: uppercase; min-width: 280px;
}
.beatframe .next[hidden] { display: none; }

/* ---------------------------------------------------------------- respond */
.strats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-top: 18px; }
.strat {
  background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); padding: 18px;
  text-align: left; color: inherit; display: flex; flex-direction: column; gap: 8px;
}
.strat.picked { border-color: var(--ui); box-shadow: 0 0 0 2px var(--panel-2), var(--shadow); }
.strat .theory { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ui); }
.strat .sn { font-size: 17px; font-weight: 700; }
.strat .sd { font-size: 14px; color: var(--ink-2); }
.strat .sc { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--rule-soft); font-size: 12px; color: var(--muted); display: grid; gap: 3px; }

/* ------------------------------------------------------------------ write */
.guide { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); margin: 18px 0; }
.guide div { background: var(--panel); padding: 12px 14px; }
.guide strong { display: block; font-size: 14px; margin-bottom: 3px; }
.guide span { font-size: 13px; color: var(--ink-2); }
.targets { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.target { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); padding: 14px; }
.target:not(:has(.tmedia)) { grid-template-columns: minmax(0, 1fr); }
.tmedia img { width: 96px; height: 116px; object-fit: cover; border: 1px solid var(--rule); }
.tmedia .credit { font-size: 10px; color: var(--muted); display: block; }
.target .tm { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.target .pos { font-size: 14px; color: var(--ink-2); margin: 0 0 8px; }
.target label { font-weight: 700; font-size: 13px; display: block; margin-bottom: 4px; }
.result { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--rule-soft); font-size: 14px; }
.result.yes strong { color: var(--good); }
.result.no strong { color: var(--bad); }

/* ---------------------------------------------------------------- outcome */
.tally { background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); padding: 20px; text-align: center; margin: 18px 0; }
.tally .tn { font-size: 54px; font-weight: 700; letter-spacing: -.04em; display: block; font-variant-numeric: tabular-nums; }
.tally .tk { font-size: 13px; color: var(--muted); display: block; margin-top: 4px; }
.tbar { height: 12px; background: var(--rule-soft); position: relative; margin-top: 14px; }
.tbar i { position: absolute; left: 0; top: 0; bottom: 0; display: block; background: var(--bad); }
.tbar i.pass { background: var(--good); }
.tbar u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.blocs { display: grid; gap: 10px; }
.bloc { background: var(--panel); border: 1px solid var(--rule); padding: 12px 14px; }
.bh { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.bn { font-weight: 600; }
.bs { font-size: 13px; font-variant-numeric: tabular-nums; }
.bloc.yes .bs { color: var(--good); }
.bloc.no .bs { color: var(--bad); }
.bw { font-size: 13.5px; color: var(--ink-2); margin: 6px 0 0; }
.advice { margin-top: 16px; font-size: 15px; color: var(--ink-2); }

/* ---------------------------------------------------------------- receipt */
.shotnote { border: 1px dashed var(--ui); color: var(--ui); padding: 10px 14px; text-align: center; font-size: 14px; }
.receipt { background: var(--panel); border: 1px solid var(--ink); box-shadow: var(--shadow); padding: 30px 34px; margin-top: 14px; }
.receipt .ex { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.receipt .names { font-weight: 700; font-size: 17px; }
.rsec { margin-top: 20px; }
.rsec h2 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--rule); padding-bottom: 5px; margin-bottom: 8px; }
.rsec ul { margin: 0; padding-left: 20px; }
.rsec li { margin-bottom: 4px; }
.offscreen { position: absolute; left: -9999px; top: 0; }
.fallback { margin-top: 14px; }

/* -------------------------------------------------- how this page works */
.how h2 { margin-top: 26px; }
.how ul { padding-left: 20px; }
.how li { margin-bottom: 8px; }
.how .note { color: var(--muted); font-size: 14px; max-width: 70ch; }
.how .warn { background: var(--warn-bg); color: var(--warn); padding: 10px 14px; }

@media (max-width: 980px) {
  .brief-main, .choose { grid-template-columns: 1fr; }
  .score { position: static; }
}
@media print {
  .topbar, .submitbar, .shotnote, .row, .notice { display: none !important; }
  body { background: #fff; }
  .receipt { border: 1px solid #000; box-shadow: none; }
}

/* stage screens: a briefing, one call with a reason, then the record */
.stagescreen .brief-copy > p { font-size: 16px; line-height: 1.55; max-width: 72ch; }
.stageask { background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); padding: 16px 18px; margin: 22px 0; }
.stageask h2 { margin-top: 0; font-size: 19px; }
.stagepicks { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin: 12px 0 16px; }
.stagepick { text-align: left; background: var(--panel-2); border: 1px solid var(--rule); color: var(--ink); padding: 12px 13px; cursor: pointer; font: inherit; }
.stagepick .pn { display: block; font-weight: 600; margin-bottom: 4px; }
.stagepick .pd { display: block; font-size: 14px; color: var(--ink-2); line-height: 1.45; }
.stagepick.on { border-color: var(--ui); box-shadow: inset 0 0 0 2px var(--ui); }
.stagepick[disabled] { cursor: default; opacity: .8; }
.stagepick.on[disabled] { opacity: 1; }
.stageask textarea { width: 100%; font: inherit; padding: 8px; background: var(--panel-2); color: var(--ink); border: 1px solid var(--rule); }
.stagereveal { border-left: 4px solid var(--ui); background: var(--panel); padding: 14px 18px; margin: 22px 0; box-shadow: var(--shadow); }
.stagereveal h2 { margin-top: 0; }
.stagecompare { font-weight: 600; }
.stagetimeline li { margin: 5px 0; line-height: 1.45; }
.stagelink { background: var(--panel-2); border: 1px solid var(--rule-soft); padding: 10px 14px; margin-top: 14px; }
.stagelink h3 { margin: 0 0 6px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.stagereveal .src, .stagelink .src { font-size: 12px; color: var(--muted); }
#case figure img { max-width: 100%; }
.revealphotos { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 14px; }
.revealphotos figure, .stagescreen .brief-photos figure { margin: 0 0 12px; }
.revealphotos img, .stagescreen .brief-photos img { width: 100%; height: auto; display: block; border: 1px solid var(--rule); background: #fff; }
.revealphotos figcaption, .stagescreen .brief-photos figcaption { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
.stagemap { margin: 18px 0 0; max-width: 640px; background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); }
.stagemap img { width: 100%; display: block; }
.stagemap figcaption { font-size: 12px; color: var(--muted); padding: 6px 10px; }
.strats + .btn, .stagewrap .strats ~ .btn { margin-top: 18px; }
.stagebullets li { margin: 6px 0; line-height: 1.5; font-size: 16px; max-width: 70ch; }
.stagescreen .brief-main { grid-template-columns: minmax(0, 1.15fr) minmax(300px, .85fr); }
.stagescreen .brief-photos .sidemap { background: var(--panel); }
.stagelink ul { margin: 6px 0 0; padding-left: 20px; }
.stagelink li { margin: 6px 0; line-height: 1.5; }

<script>/* core.js — the simulation engine's pure logic.

   No DOM, no network, no randomness, no clock: everything here is a function of
   the state, the simulation data, and the rules the session wrote. The page
   loads it as a plain script; the Node tests and the route runner load it in a
   vm. Both get the same answers, which is the point.

   State shape:
     {version, names, choices: {optionId: size 0..1}, strategy, texts: {targetId},
      moved: {targetId: true}, sent, unlocked, screen}
   Rules signature, written by the session in sim_rules.js:
     RULES[name](state, data, helpers, extra) */
(function (root) {
  "use strict";

  function normalizeCode(value) {
    return String(value == null ? "" : value).replace(/\s+/g, "").toUpperCase();
  }

  function num(value, fallback) {
    var n = Number(value);
    return isFinite(n) ? n : (fallback == null ? 0 : fallback);
  }

  /* An option's size is a factor between 0 and 1 over its low-to-high range.
     An option with no high is all or nothing, so the size cannot shrink it. */
  function amount(option, size) {
    if (!option) return 0;
    var lo = num(option.low, 0);
    if (option.high == null) return lo;
    var hi = num(option.high, lo);
    var f = size == null ? 1 : Math.max(0, Math.min(1, num(size, 1)));
    return lo + (hi - lo) * f;
  }

  function eachOf(data, key, fn) {
    (data && data.screens || []).forEach(function (screen) {
      (screen[key] || []).forEach(fn);
    });
  }

  function index(data) {
    var byId = {};
    ["options", "strategies", "targets"].forEach(function (key) {
      eachOf(data, key, function (item) { if (item && item.id) byId[item.id] = item; });
    });
    return byId;
  }

  function chosen(state, data) {
    var out = [];
    eachOf(data, "options", function (option) {
      if (state && state.choices && state.choices[option.id] != null) out.push(option);
    });
    return out;
  }

  /* What a rule gets as its third argument. Everything a formula needs about
     this group's page, and nothing that could reach outside it. */
  function helpers(state, data) {
    var byId = index(data);
    function option(id) { return typeof id === "string" ? (byId[id] || null) : (id || null); }
    return {
      option: option,
      amount: function (idOrOption) {
        var opt = option(idOrOption);
        if (!opt) return 0;
        return amount(opt, state && state.choices ? state.choices[opt.id] : 1);
      },
      size: function (idOrOption) {
        var opt = option(idOrOption);
        if (!opt || !state || !state.choices) return 0;
        var size = state.choices[opt.id];
        /* The same clamp as amount(): a size out of range would leave a choice
           costing what it costs and doing whatever the store says. */
        return size == null ? 0 : Math.max(0, Math.min(1, num(size, 0)));
      },
      picked: function (id) { return !!(state && state.choices && state.choices[id] != null); },
      chosen: function () { return chosen(state, data); },
      strategy: function () { return state && state.strategy ? option(state.strategy) : null; },
      moved: function () { return Object.keys((state && state.moved) || {}); },
      hasMoved: function (id) { return !!(state && state.moved && state.moved[id]); },
      value: function (item, key, fallback) {
        var obj = option(item);
        if (!obj || !obj.values || obj.values[key] == null) return fallback == null ? 0 : fallback;
        return obj.values[key];
      },
      sum: function (list, fn) {
        return (list || []).reduce(function (total, item) {
          return total + num(fn ? fn(item) : item, 0);
        }, 0);
      },
      clamp: function (value, lo, hi) { return Math.max(lo, Math.min(hi, num(value, lo))); },
      stagePick: function (stageId) {
        var row = state && state.stages ? state.stages[stageId] : null;
        return row && row.revealed ? row.pick : null;
      }
    };
  }

  function emptyState(version) {
    return {
      version: version || "",
      names: "",
      choices: {},
      strategy: null,
      texts: {},
      moved: {},
      sent: 0,
      unlocked: false,
      screen: null,
      stages: {}
    };
  }

  /* A saved state belongs to the build that wrote it. A rebuilt page keeps
     nothing from an older build, and says so on screen rather than silently.
     The saved code comes back too, or a reload after the unlock would land on a
     screen the page can no longer open. Sizes are clamped on the way in: the
     store is the student's own browser and anything can be typed into it. */
  function restore(saved, version) {
    if (!saved || typeof saved !== "object" || saved.version !== version) {
      return { state: emptyState(version), dropped: !!saved };
    }
    var state = emptyState(version);
    ["names", "strategy", "screen", "code"].forEach(function (key) {
      if (saved[key] != null) state[key] = saved[key];
    });
    ["texts", "moved"].forEach(function (key) {
      if (saved[key] && typeof saved[key] === "object") state[key] = saved[key];
    });
    if (saved.choices && typeof saved.choices === "object") {
      Object.keys(saved.choices).forEach(function (id) {
        var size = Number(saved.choices[id]);
        state.choices[id] = isFinite(size) ? Math.max(0, Math.min(1, size)) : 1;
      });
    }
    state.sent = Math.max(0, num(saved.sent, 0));
    state.unlocked = !!saved.unlocked;
    /* A stage holds the group's call, its reason, and whether the record has
       been shown. A call is never changed after the record is out. */
    if (saved.stages && typeof saved.stages === "object") {
      Object.keys(saved.stages).forEach(function (id) {
        var row = saved.stages[id] || {};
        state.stages[id] = {
          pick: typeof row.pick === "string" ? row.pick : null,
          why: typeof row.why === "string" ? row.why : "",
          revealed: !!row.revealed && typeof row.pick === "string"
        };
      });
    }
    return { state: state, dropped: false };
  }

  var DEFAULT_POLICY = { maxNewFirst: 2, maxNewRetry: 1, minOneIfWritten: true, minWords: 8 };

  function words(text) {
    return String(text || "").trim().split(/\s+/).filter(Boolean).length;
  }

  function byStrength(a, b) {
    return (b.points - a.points)
      || (b.text.length - a.text.length)
      || String(a.target.name || a.target.id).localeCompare(String(b.target.name || b.target.id));
  }

  /* Holbein's locking policy, and the reasons it exists:
       - nothing written persuades nobody (a group cannot skip the work);
       - a real attempt always moves one (the exercise is not a dead end);
       - never everyone at once, so the count stays hard;
       - a target already moved stays moved and shows up as a yes in the count;
       - a retry can move one more, and shows only the targets still open. */
  function lockPitches(targets, texts, moved, score, policy, sends) {
    var rules = {};
    Object.keys(DEFAULT_POLICY).forEach(function (k) { rules[k] = DEFAULT_POLICY[k]; });
    Object.keys(policy || {}).forEach(function (k) { if (policy[k] != null) rules[k] = policy[k]; });

    var locked = {};
    Object.keys(moved || {}).forEach(function (k) { if (moved[k]) locked[k] = true; });
    var all = targets || [];

    var scored = all.map(function (target) {
      var text = String((texts && texts[target.id]) || "").trim();
      var result = text ? (score(target, text) || {}) : { points: 0, ready: false };
      return {
        target: target, text: text, points: num(result.points, 0), ready: !!result.ready,
        /* A real attempt has substance. Without this a full stop in each box
           moves somebody, and a group can send the same junk again and again
           until everybody has moved. */
        real: words(text) >= rules.minWords
      };
    });
    var anyReal = scored.some(function (row) { return row.real; });
    var open = scored.filter(function (row) { return !locked[row.target.id]; });
    /* The allowance follows how many times the group has pressed send, not how
       many targets happen to have moved. */
    var maxNew = num(sends, 0) > 0 ? rules.maxNewRetry : rules.maxNewFirst;
    maxNew = Math.max(0, Math.min(maxNew, all.length - 1));   // never everybody at once

    var winners = open.filter(function (row) { return row.ready && row.real; }).sort(byStrength).slice(0, maxNew);
    if (!winners.length && anyReal && rules.minOneIfWritten && maxNew > 0) {
      winners = open.filter(function (row) { return row.real; }).sort(byStrength).slice(0, 1);
    }
    winners.forEach(function (row) { locked[row.target.id] = true; });

    var results = {};
    scored.forEach(function (row) {
      results[row.target.id] = {
        moved: !!locked[row.target.id],
        points: row.points,
        ready: row.ready,
        wrote: row.text.length > 0,
        real: row.real
      };
    });
    return { moved: locked, results: results };
  }

  function fill(text, vars) {
    return String(text == null ? "" : text).replace(/\{\{(\w+)\}\}/g, function (whole, key) {
      return vars && vars[key] != null ? String(vars[key]) : whole;
    });
  }

  function group(value) {
    var parts = String(value).split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return parts.join(".");
  }

  function formatValue(value, format, digits) {
    if (value == null || value === "") return "—";
    var n = Number(value);
    if (format === "text" || !isFinite(n)) return String(value);
    switch (format) {
      case "int": return group(String(Math.round(n)));
      case "one": return group(n.toFixed(1));
      case "pct": return Math.round(n) + "%";
      case "pct1": return n.toFixed(1) + "%";
      case "fixed": return group(n.toFixed(num(digits, 0)));
      default: return group(String(Math.round(n * 100) / 100));
    }
  }

  /* The text a group copies into the Blackboard item. Every student's name is
     the first line, because that is what the submission rule asks for. */
  function receiptText(state, data, ctx) {
    ctx = ctx || {};
    var lines = [];
    /* A simulation can leave the names off the page: the group adds them to the
       downloaded file, or types them into Blackboard when it uploads. */
    if (data && data.no_names) lines.push("Group members: (write every name in your group here)");
    else lines.push(String((state && state.names) || "").trim() || "(no names entered)");
    lines.push("");
    lines.push([data && data.course, data && data.title].filter(Boolean).join(" — "));
    if (ctx.stats && ctx.stats.length) {
      lines.push("");
      ctx.stats.forEach(function (row) { lines.push(row.label + ": " + row.value); });
    }
    if (ctx.choices && ctx.choices.length) {
      lines.push("");
      lines.push("What we chose");
      ctx.choices.forEach(function (row) {
        lines.push("- " + row.name + (row.value ? " (" + row.value + ")" : ""));
      });
    }
    if (ctx.stages && ctx.stages.length) {
      lines.push("");
      lines.push("Our calls, stage by stage");
      ctx.stages.forEach(function (row) {
        lines.push("- " + row.title + ": " + (row.pick || "(no call)"));
        if (row.why) lines.push("  Why: " + row.why);
        if (row.real) lines.push("  What really happened: " + row.real);
      });
    }
    if (ctx.surprise) {
      lines.push("");
      lines.push("What broke: " + ctx.surprise);
    }
    if (ctx.strategy) {
      lines.push("");
      lines.push("Our response: " + ctx.strategy.name
        + (ctx.strategy.theory ? " (" + ctx.strategy.theory + ")" : ""));
    }
    if (ctx.messages && ctx.messages.length) {
      lines.push("");
      lines.push("Our messages");
      ctx.messages.forEach(function (row) {
        lines.push("- " + row.name + ": " + (row.moved ? "moved" : "not moved"));
        if (row.text) lines.push("  " + row.text);
      });
    }
    if (ctx.outcome) {
      lines.push("");
      lines.push("Outcome: " + ctx.outcome.headline);
      if (ctx.outcome.detail) lines.push(ctx.outcome.detail);
    }
    return lines.join("\n");
  }

  /* Every student's name, the way the submission rule asks for it. One name is
     a group that forgot the others, so the page says so before it starts. */
  function nameList(value) {
    return String(value == null ? "" : value)
      .split(/[,\n;]+| and /i)
      .map(function (name) { return name.trim(); })
      .filter(function (name) { return name.length > 1; });
  }

  /* The name of the file a group uploads: the simulation, then the names they
     typed, so a folder of them can be read without opening any. */
  function fileName(state, data) {
    var names = String((state && state.names) || "").toLowerCase()
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60).replace(/-+$/, "");
    var id = String((data && data.id) || "simulation").toLowerCase()
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    return [id, names || "answers"].filter(Boolean).join("-") + ".txt";
  }

  function rule(RULES, name) {
    var fn = RULES && RULES[name];
    if (typeof fn !== "function") throw new Error("rule not found: " + name);
    return fn;
  }

  function run(RULES, name, state, data, extra) {
    return rule(RULES, name)(state, data, helpers(state, data), extra);
  }

  root.SIMCORE = {
    normalizeCode: normalizeCode,
    amount: amount,
    chosen: chosen,
    helpers: helpers,
    index: index,
    emptyState: emptyState,
    restore: restore,
    lockPitches: lockPitches,
    fill: fill,
    formatValue: formatValue,
    receiptText: receiptText,
    fileName: fileName,
    nameList: nameList,
    rule: rule,
    run: run,
    DEFAULT_POLICY: DEFAULT_POLICY
  };
}(typeof globalThis !== "undefined" ? globalThis : this));
</script>
<script>/* sim_rules.js: the page scores nothing. One rule counts the calls saved,
   which the build's route check uses to confirm the exercise can be finished. */
RULES = {
  callsSaved: function (state, data, H) {
    var n = 0;
    ["s1", "s2", "s3", "s4", "s4b", "s5", "s6"].forEach(function (id) { if (H.stagePick(id)) n += 1; });
    return n;
  }
};
</script>
<script>
/* window, not const: a top-level const is not a property of the page's global
   object, and the engine reads these from there. */
window.DATA = {"id":"poc-s11-colombia","title":"Colombia's war, 1946 to today","course":"Politics of Conflict","session":null,"address":"www.ala-alrababah.com/teaching/poc-s11/","label":"A class exercise. Every event shown is real.","illustrative":false,"build":"e0a3940724c7","sources":[{"id":"CEV","text":"Truth Commission of Colombia, final report (2022)","url":""},{"id":"IC1","text":"InSight Crime, The FARC 1964-2002: From Ragged Rebellion to Military Machine","url":""},{"id":"MORE1","text":"National Center for Historical Memory, ¡Basta Ya! (2013) and Todo pasó frente a nuestros ojos (2018), and the Inter-American Court of Human Rights, Unión Patriótica vs. Colombia (2022)","url":""},{"id":"MORE2","text":"The La Uribe accords (1984), the M-19 peace agreement (1990), and the Final Agreement to End the Armed Conflict (2016)","url":""},{"id":"MORE3","text":"Fearon (1995), Fearon and Laitin (2003), Humphreys and Weinstein (2008), Arjona and Kalyvas (2009), Walter (2009), Cederman, Weidmann, and Gleditsch (2011), Matanock and García-Sánchez (2017), and Mampilly and Gutiérrez (2023)","url":""},{"id":"MORE4","text":"UN Verification Mission in Colombia, Security Council Report, US Congressional Research Service, UK Home Office, Council on Foreign Relations, Human Rights Watch, and Global Protection Cluster","url":""},{"id":"MORE5","text":"InSight Crime, Fundación Ideas para la Paz, Indepaz, Colombiacheck, Rutas del Conflicto, and the CIA's Studies in Intelligence","url":""},{"id":"MORE6","text":"BBC, Al Jazeera, Foreign Policy, Semana, El Tiempo, El Colombiano, and Radio Nacional de Colombia news reports, 1990 to 2026","url":""}],"rules":[{"name":"callsSaved","label":"Calls saved.","describe":"Counts how many of the 7 calls your group has saved. Nothing is scored."}],"screens":[{"id":"brief","kind":"brief","kicker":"Politics of Conflict","headline":"Colombia's war, 1946 to today","lede":"Your group leads the peasant fighters who became the FARC (Revolutionary Armed Forces of Colombia), Colombia's largest guerrilla group. You will go through 6 stages from 1946 to today. Your role changes from stage to stage.","steps":["Open this page on one laptop per group and press Start.","At each stage, read the briefing, agree on one call, and write why.","Save your call. The page then shows what the real fighters did and what happened afterwards. Then you need to answer an additional question about it.","Underlined names and terms, and the photos and maps, give a short note when you hover over or tap them."],"deliverable":"The tab called The case starts almost empty and fills up as you go. After each stage it adds that stage's timeline and terms, and at the end the evidence that may be useful for an essay. At the end, download your file and upload it to Blackboard.","grade_note":"Your calls are not graded.","panels":[{"title":"Why civil wars start","bullets":["**Exclusion (Cederman, Weidmann, and Gleditsch 2011).** Ethnic groups shut out of state power, or, in very unequal countries, much richer or poorer than the national average, resent their position, and those in power share it only reluctantly. So excluded groups rebel more often than included ones, and very rich and very poor groups more often than groups near the average.","**Opportunity (Fearon and Laitin 2003).** Grievances are common, they argue, so they cannot explain where wars break out. Wars start where small rebel bands can survive: a poor state with weak police and army, rough terrain far from the capital where rebels can hide, and a large population."]},{"title":"Why people join (based on Humphreys and Weinstein 2008)","bullets":["**Grievances.** People join to fight for a cause, out of anger at poverty or at being shut out of politics.","**Selective incentives.** A rebellion's gains go to everyone, fighters or not, so each person is tempted to let others take the risk. Armed groups overcome this with rewards only fighters get: money, goods, or loot, or protection when staying out is more dangerous than joining.","**Social sanctions.** Close communities watch their members and shame or punish those who stay out, so people join when their friends, family, and neighbors do.","**Force.** Armed groups can also fill their ranks by abducting people or making them join."]},{"title":"Why bargains fail (Fearon 1995, Walter 2009)","bullets":["**Private information.** If both sides knew who would win, they would almost always prefer a deal to the costs of war. But each knows its own strength and resolve better than the other does and has reasons to bluff, so both may expect to win until the fighting shows who is stronger.","**Commitment problem.** A deal can fail even when both sides want it, because nothing enforces it over time and it can leave one or both sides open to attack. Rebels must usually disarm as part of a deal, and Walter and others find that wars end in a deal more often when an outside state or international organization sends peacekeepers to help carry it out.","**Indivisible stakes.** If what the sides fight over cannot be split, such as sole control of a territory or of the government, no compromise exists. Walter notes that Fearon dismisses this problem, holding that a compromise short of war is almost always available, but she adds that in practice such disputes appear harder to settle, especially over territory that matters for symbolic or strategic reasons."]}],"tiles":[{"value":"450,664","label":"people killed in the war between 1985 and 2018.","source":"CEV"},{"value":"About 7.75 million","label":"people forced from their homes between 1985 and 2019.","source":"CEV"}]},{"id":"s1","kind":"stage","kicker":"Stage 1 of 6 · 1946 to 1953","headline":"1953: General Rojas offers an amnesty","receipt_title":"Stage 1, the 1953 amnesty","lede":"You are a Communist peasant fighter in southern Tolima, in the mountains of central Colombia. It is late 1953.","paragraphs":[],"panels":[{"title":"What the amnesty offers","bullets":["A pardon for political crimes.","Release of prisoners, help for victims, and the rebuilding of towns and schools in the war zones.","A promise of a role in politics, though Congress stays closed. In return, fighters hand in their weapons.","The government promises to protect former fighters. Nobody outside the government checks that it does. The army that has been fighting the Communists remains in charge of security."]}],"tiles":[{"value":"About 200,000","label":"killed in La Violencia, the estimate most often cited","source":"CEV"}],"question":"Rojas offers an amnesty. What do you do?","picks":[{"id":"s1_disarm","name":"Take the amnesty and hand in your weapons","detail":"Go home and farm, with a pardon, as the largest Liberal force has done. The army has no reason left to hunt you, and you rely on the government's promise of safety.","others":{"who":"The Llanos guerrillas, a Liberal force led by Guadalupe Salcedo.","bullets":["**15 September 1953.** Salcedo's 200-plus men handed in their weapons at Monterrey, Casanare.","**6 June 1957.** Police killed Salcedo in Bogotá. The official account spoke of a shootout. The autopsy found 5 bullet wounds, 2 in the backs of his hands, which suggested he was shot while surrendering."]}},{"id":"s1_keep","name":"Stop fighting but keep your weapons","detail":"Farm in your own zone, under your own guard. You keep your protection, but an armed zone gives the government a reason to treat you as rebels."},{"id":"s1_fight","name":"Keep fighting","detail":"Refuse the amnesty. You keep your freedom to act, but the army, now backed by both major parties, can turn its full force on you.","others":{"who":"Liberal bands that kept fighting after the amnesty. The Liberal Party disowned them, and they were called 'bandoleros', bandits. Not the Communist groups that became the FARC.","bullets":["**About 1958.** An estimate of the time, cited by the Truth Commission, put the number of armed groups at about 200, most of them called bandoleros.","**22 January 1963.** The army killed the bandolero leader known as Chispas."]}}],"why_min":12,"reveal":{"real_pick":"s1_keep","bullets":["**The Liberals disarmed, the Communists did not.** Many Liberal fighters took the amnesty. In southern Tolima the Communists doubted that a military government could end La Violencia. Their party told them to stop fighting but keep their weapons and organize the peasants for self-defense.","**1954 to 1955: war on the Communist zones.** Rojas outlawed the Communist Party. When the army arrested a Communist leader in Villarrica, Tolima, the fighting resumed, and the army dropped at least 50 napalm bombs on the area. About 100,000 people fled.","**December 1955: a new refuge.** Driven from their zones, Charro Negro and Marulanda settled their group in a remote corner of southern Tolima and named it Marquetalia.","**June 1957: Salcedo is killed.** Police shot the Liberal commander who had disarmed, in Bogotá. They called it a shootout. Other former fighters were killed in those years too.","**1957: the two parties share power.** Rojas fell after he began building his own party, which threatened the leaders of both. The Liberals and Conservatives agreed to the National Front: they would alternate the presidency and split every seat in Congress and the courts, for 12 years, later 16. The Communists were left out of the pact. The 1957 vote did lift the ban on their party, and the self-defense groups moved into politics.","**1958: the Communists keep their weapons again.** Offered a new amnesty, they again refused to disarm. The Truth Commission writes that they had seen Liberals who disarmed, such as Salcedo, murdered."],"class_link":{"text":["**Exclusion.** The closing of Congress in November 1949 shut the Liberals out of power, and the 1954 ban on the Communist Party and the 1957 National Front shut out the Communists (all above). The Communists armed in October 1949, a month before Congress closed, and first kept their weapons in 1953, before the ban. The excluded groups were political parties, not the ethnic groups Cederman, Weidmann, and Gleditsch study.","**Opportunity.** The armed groups formed in the mountains of Tolima and Cundinamarca and on the eastern plains. After the army's offensive on Villarrica in June 1955, the guerrillas who had come there from southern Tolima marched with hundreds of families to El Pato and Guayabero, on the Huila and Caquetá border, and settled there. Charro Negro and Marulanda's group went to Marquetalia (December 1955, above)."],"reading":"Truth Commission, No matarás (2022), pp. 58 to 70. Cederman, Weidmann, and Gleditsch (2011), p. 488.","title":"How this connects to the course","tag_question":"Armed peasant groups formed across Colombia from 1949. Which explanation of why civil wars start fits this best? Pick one, then argue it out.","tag_options":["Exclusion","Opportunity","Something else"]}},"lock_label":"Save our call and see what happened","photos":[{"file":"media/gaitan.jpg","alt":"Jorge Eliécer Gaitán, 1936","credit":"Jorge Eliécer Gaitán, 1936. Photo: Revista Credencial Historia, public domain.","info":"On 7 February 1948 Gaitán led the March of Silence through Bogotá to protest the political violence. Estimates, hard to verify, put the crowd at about 100,000."},{"file":"media/rojas_pinilla2.jpg","alt":"General Gustavo Rojas Pinilla","credit":"General Gustavo Rojas Pinilla. Photo: public domain.","info":"The Liberal leader Darío Echandía hailed the takeover as a 'golpe de opinión', a coup of public opinion."}],"map":{"file":"media/map_stage1.svg","alt":"Map of Colombia for stage 1","credit":"Shaded: Tolima, Cundinamarca, and the Llanos, the main areas of armed groups in this stage. Map: Natural Earth, geoBoundaries, and GeoNames.","info":"**Dots**: Ceilán, in Valle del Cauca, and Sumapaz, in Cundinamarca. Sumapaz's dot lies about 80 km southwest of Bogotá in a straight line."},"bullets":["**Two parties.** Colombia was run by two major parties, the Liberals and the Conservatives, who fought over who held the state and its jobs.","**1946: the Conservatives take back power.** The Liberals had governed since 1930, but they split between two candidates, Gabriel Turbay and Jorge Eliécer Gaitán, and the Conservative Mariano Ospina Pérez won.","**The police.** From 1945 to 1947 at least 78 of Gaitán's supporters were murdered, many in Boyacá, where Ospina's government recruited a police force, the chulavitas, that it used against Liberals.","**9 April 1948: Gaitán is shot dead in Bogotá.** The Liberals' most popular leader was killed, and riots, the Bogotazo, spread across the country.","**La Violencia.** In the countryside, Conservative police and gunmen attacked Liberal villages, and Liberals formed guerrillas to fight back.","**November 1949: Congress is closed.** When the Liberals moved to remove President Ospina in Congress, he declared emergency rule, closed Congress, and censored the press. Congress stayed closed for 9 years. The Conservative Laureano Gómez was then elected with no opponent.","**The Communists arm.** In October 1949 the Communist Party, strong among peasants who had fought landowners since the 1920s, told its followers to form armed self-defense groups, to hold off attacks by the state and Conservative gunmen.","**Liberals and Communists split.** In southern Tolima, Liberal and Communist families first hid together on one farm, El Davis. By 1951 they had split into two hostile camps: the limpios, loyal to the Liberal Party and its landowners, and the comunes, who had turned Communist and farmed collectively. Manuel Marulanda, later the FARC's top commander, went with the Communists.","**June 1953: a general takes over.** With the Conservatives divided and the country at war, General Gustavo Rojas Pinilla overthrew the hard-line government of Laureano Gómez. The Liberals, Ospina's wing of the Conservatives, business, and the Church backed him. He promised peace, and the Liberals hoped he would reopen politics.","**The amnesty.** To end the fighting, Rojas offered an amnesty under the slogan 'peace, justice, and liberty for all'. It covered both sides, so the chulavita police who had attacked Liberal villages were pardoned too.","**15 September 1953: the largest Liberal force disarms.** Guadalupe Salcedo, commander of the Llanos guerrillas, handed in his men's weapons. Many Liberals followed."],"why_label":"Why? And name the risk you accept."},{"id":"s2","kind":"stage","kicker":"Stage 2 of 6 · 1958 to 1964","headline":"1964: The army prepares to attack Marquetalia","receipt_title":"Stage 2, Marquetalia in 1964","lede":"You lead the armed peasant community of Marquetalia, in the far south of Tolima. It is early April 1964.","paragraphs":[],"panels":[],"tiles":[],"question":"What does Marquetalia do?","picks":[{"id":"s2_defend","name":"Stay and defend Marquetalia","detail":"Move the women, children, and old people out. The armed men hold the land and the homes built since 1955, and show the country they are farmers defending themselves. The army can bring far more men than you have."},{"id":"s2_mobile","name":"Leave and become mobile guerrillas","detail":"Abandon the homes and fields built since 1955 and move through the mountains in small armed bands. You become what the army says you are: guerrillas, not settlers defending their land."},{"id":"s2_petition","name":"Ask the president for peace","detail":"Ask the president to call off the troops and send schools, roads, and clinics, and keep your weapons while you wait. The government gets a peaceful way out, but the troops may march before it answers."}],"why_min":12,"reveal":{"real_pick":"s2_mobile","bullets":["**May 1964: the attack.** Operation Marquetalia began on 18 May with 2,000 to 3,000 soldiers, by military sources. Two days later more than 300 settlers wrote to the president asking for the troops to leave, and for schools, roads, and clinics. They did not offer to disarm, and said they were ready to die fighting.","**June 1964: they slip away.** The fighters left, and Marulanda went to Riochiquito, in Cauca.","**Mobile guerrillas.** By late 1964 (1965 in some accounts) the settlers had become mobile guerrillas, and in 1966 they took the name FARC.","**A small group.** In 1970 only 3 FARC actions are recorded, against 12 by the EPL and 18 by the ELN, two newer guerrilla groups."],"paragraphs":[],"class_link":{"text":["**Commitment problem.** The Communists' 1958 pledge not to use their weapons, Marulanda's return to arms after Charro Negro's killing in January 1960 ('we are next'), the dispute over whether the pledge was broken in the December 1963 ambush, and the May 1964 letter that did not offer to disarm are all above.","**Private information.** Weeks before the attack, government intelligence counted at least 400 armed men at Marquetalia, and the FARC later said it had about 50 (both above). The size of the attacking force is also disputed: 2,000 to 3,000 soldiers by military sources (above), and 10,000 to 16,000 by the guerrillas' later account.","**Indivisible stakes.** In his 1961 speech (above), Gómez Hurtado also said the zones did not recognize the sovereignty of the Colombian state. The settlers' May 1964 letter asked for the troops to leave (above).","**Discuss:** Marulanda later said the settlers asked only for roads, a market, and schools, which would have cost the state no more than 5 million pesos. If peace was that cheap, why did the state attack?"],"reading":"Truth Commission, No matarás (2022), pp. 70 and 97 to 104. Colombiacheck (2026), on the settlers' May 1964 letter and the intelligence count.","title":"How this connects to the course","tag_question":"The armed peace of 1958 ended in war by 1964. Which explanation of why peace fails fits this best? Pick one, then argue it out.","tag_options":["Commitment problem","Private information","Indivisible stakes","Something else"]}},"lock_label":"Save our call and see what happened","photos":[{"file":"media/planadas.jpg","alt":"Planadas, the municipality in southern Tolima where Marquetalia lay, 2021","credit":"Planadas today, the municipality in southern Tolima where Marquetalia lay. Photo: Felviper, CC BY-SA 4.0, 2021.","info":"Planadas is now Tolima's largest coffee producer, known for specialty coffee, and its growers have won Colombia's national Cup of Excellence coffee contest."}],"map":{"file":"media/map_stage2.svg","alt":"Map of Colombia for stage 2","credit":"Shaded: Tolima, Huila, and Cauca. El Pato and Guayabero lay just to the east, in Caquetá and Meta. Map: Natural Earth, geoBoundaries, and GeoNames.","info":"**Dots**: Marquetalia, Riochiquito, El Pato, and Guayabero. In a straight line, Marquetalia lay about 250 km southwest of Bogotá and about 60 km from Riochiquito."},"bullets":["**1958: an armed peace.** Under the National Front the Communists stopped fighting but kept their weapons, promising not to use them. Marulanda took a job as a road inspector, and fighters' families settled at Marquetalia to farm.","**What they asked for.** In 1958 talks with the government, the Communists asked for an end to rule by emergency decree, the return of land taken in La Violencia, and an end to attacks by the limpios.","**January 1960: the peace breaks.** In a feud over a machine gun, the limpio leader Mariachi had Charro Negro, Marquetalia's co-founder, shot dead. By a fighter's account, Marulanda said: 'They killed Charro, and we are next.' He took up arms again.","**1961: 'independent republics'.** In the Senate, the Conservative Álvaro Gómez Hurtado called the Communist zones 'independent republics' 'where the Colombian army cannot enter' and urged the army to take them back. Similar pressure, and the guerrilla attacks (below), led the president to order an attack.","**The army prepares.** It was the Cold War, and the army's new plan, Plan Lazo, drew on US advice on fighting Communist insurgents.","**Who attacked first is disputed.** In 1962 and 1963 guerrillas carried out a wave of attacks. The army says Marquetalia's fighters killed 5 soldiers in an ambush in December 1963. A former fighter says the settlers had kept their promise not to attack the army.","**1964: the target.** The army's campaign plan names Marquetalia and three other Communist zones, Riochiquito, El Pato, and Guayabero. The attack is set for the third week of May.","**How strong is Marquetalia?**  Government intelligence reported at least 400 armed men. The FARC later said it had about 50 armed men (plus dozens of families, numbering hundreds of individuals in total)."],"why_label":"Why? And name the risk you accept."},{"id":"s3","kind":"stage","kicker":"Stage 3 of 6 · 1978 to 1983","headline":"1982: Paying for the war","receipt_title":"Stage 3, how to pay for the war","lede":"You sit on the FARC's leadership. It is May 1982, and the FARC is holding its Seventh Conference in Guayabero, in Meta.","paragraphs":[],"panels":[],"tiles":[],"question":"What will be the FARC's main source of money?","picks":[{"id":"s3_refuse","name":"Refuse drug money","detail":"Live on contributions from your peasant supporters. You keep their support and Arenas's line against drug money, but you may grow slowly.","others":{"who":"The ELN (National Liberation Army), another guerrilla group that refused drug money for decades, though not kidnapping.","bullets":["In the early 1980s it grew on kidnapping and on payments from oil companies building the Caño Limón-Coveñas pipeline.","Under pressure from the security forces, the paramilitaries, and the FARC, some of its fronts later moved into drugs, including taxing coca growers."]}},{"id":"s3_growers","name":"Tax the coca growers","detail":"Charge every peasant who grows coca a fee per gram. Coca is the main crop in your southern zones, so the money is steady, and it comes from the people you say you defend."},{"id":"s3_traffickers","name":"Tax the traffickers, spare the growers","detail":"Demand large sums from traffickers and cocaine labs in your areas, and leave small growers alone. The sums are large, but you depend on the men who formed MAS to hunt kidnappers."},{"id":"s3_kidnap","name":"Kidnap ranchers and businessmen","detail":"Make holding wealthy people for ransom your main source, as other guerrilla groups do. It pays fast. The traffickers' answer to the M-19 shows what it can provoke.","others":{"who":"Two guerrilla groups that kidnapped more than the FARC in the 1980s: the M-19 and the ELN.","bullets":["Cocaine traffickers created Death to Kidnappers (MAS) within weeks, to hunt kidnappers.","**1999.** The ELN kidnapped about 190 people from a church in Cali, the largest kidnapping in Colombia's history. Its refusal to give up kidnapping was among the obstacles that stalled its talks with the government from 2022 to 2025."]}}],"why_min":12,"reveal":{"bullets":["**The coca rule.** Sources disagree on what was decided. By the FARC's own documents, it banned charging small and medium growers per gram, and told units to demand large sums from major traffickers, without the FARC's role becoming public.","**Units broke the rule.** That year the leaders rebuked Argemiro, commander in Caquetá, for taxing growers and for his ties with traffickers. In 1983 they complained that some fronts had bought businesses and property.","**Kidnapping and the militias.** In October 1983 the leaders admitted that units in the Magdalena Medio had kidnapped small and medium ranchers, and that this fed the anger that built the militias against the FARC. Traffickers, Pablo Escobar among them, bought land there and paid for those militias, which became the paramilitaries.","**Others kidnapped more.** From 1980 to 1989 the FARC carried out 489 kidnappings, fewer than the M-19 (672) or the ELN (574).","**Growth.** Fronts grew from 16 in 1982 to 48 in 1991. Fighters grew from 5,800 in 1991 to between 16,000 and 28,000 around 2002, by different estimates. Arenas died in 1990. His objection to drug money had been one of the main obstacles to a larger FARC role in the trade."],"class_link":{"text":["**Grievances.** Arjona and Kalyvas surveyed former paramilitaries and former FARC fighters who had left the group on their own. Economic, political, and ideological grievances did not set FARC recruits apart from recruits to the paramilitaries, who fought the FARC. If anything, those who saw themselves as poor were more likely to have joined the paramilitaries. A former FARC member: 'I lived in Tolima with my family which was poor. We worked in farms, I was not paid. I got bored with this and joined the FARC.'","**Selective incentives.** The FARC paid its fighters no salary, despite its income from illegal sources, while the paramilitaries usually paid an estimated $200 a month. About 25% of former FARC members said they had expected some material reward, against about half of former paramilitaries, who named economic interest as a reason. Only about 4% in each group named safety as key to joining.","**Social sanctions.** Arjona and Kalyvas measured community ties partly by whether recruits said they joined because friends or family already had. Former FARC members were more likely than former paramilitaries to say so. One said he 'liked the ideas. Because of friends, for fun.' The authors had expected no difference between the two groups on such measures."],"reading":"Arjona and Kalyvas (2009), pp. 18 to 19, 24, 28, and 29.","title":"How this connects to the course","tag_question":"The FARC grew from about 3,000 fighters in 1982 to between 16,000 and 28,000 around 2002. Why did people join? Which motive fits best? Pick one, then argue it out.","tag_options":["Grievances","Selective incentives","Social sanctions","Something else"]},"real_label":"by its own rules, tax the traffickers and spare the growers. In practice some units also taxed growers, and the FARC kidnapped for ransom."},"lock_label":"Save our call and see what happened","photos":[{"file":"media/marulanda_arenas.jpg","alt":"Manuel Marulanda and Jacobo Arenas","credit":"Manuel Marulanda (left) and Jacobo Arenas, undated. Photo: Agencia Fariana de Prensa, the FARC's press agency, CC0.","info":"Marulanda was the FARC's first commander. Arenas came to it from the Communist Party and had traveled to Havana and Moscow."}],"map":{"file":"media/map_stage3.svg","alt":"Map of Colombia for stage 3","credit":"Shaded: the southern coca frontier (Caquetá, Putumayo, Guaviare, and Meta), and Antioquia, Boyacá, and Santander, in the Magdalena Medio valley. Map: Natural Earth, geoBoundaries, and GeoNames.","info":"**Dots**: the Magdalena Medio, about 160 km north-northwest of Bogotá in a straight line, and the Seventh Conference, about 270 km south."},"bullets":["**The FARC is still small.** In 1982 it has 16 fronts (regional units), up from 9 in 1979, and about 3,000 fighters, by one estimate.","**A plan to take power.** Marulanda and Jacobo Arenas, the FARC's political leader, present a plan to take power in 8 years with an army of 28,000. That needs far more money than the FARC has.","**Coca is spreading in its zones.** In the 1970s traffickers pushed peasants in the southern frontier to grow coca and make coca paste. It became the region's main crop.","**The FARC already taxes drugs.** It taxed marijuana growers from the mid-1970s. By one grower's account, it first opposed coca, then stopped bothering growers around 1980.","**Kidnapping for ransom.** Guerrillas often kidnap wealthy people for ransom. When the M-19 kidnapped Marta Nieves Ochoa, the sister of cocaine traffickers, in November 1981, the traffickers formed Death to Kidnappers (MAS) to hunt kidnappers.","**Ranchers' militias.** In the Magdalena Medio valley, ranchers are forming militias against the guerrillas, with weapons and training from the army.","**A moral objection.** Arenas thinks drug money will corrupt the FARC."],"why_label":"Why? And name the risk you accept."},{"id":"s4","kind":"stage","kicker":"Stage 4 of 6 · 1982 to 1984","headline":"1984: The La Uribe accords","receipt_title":"Stage 4, the 1984 peace offer","lede":"You lead the FARC. It is 1984, and President Belisario Betancur is offering peace.","paragraphs":[],"panels":[],"question":"What does the FARC do with the truce?","picks":[{"id":"s4_both","name":"Launch a party, keep the weapons","detail":"Send commanders into politics and run in elections. Keep the fronts armed in case the deal fails. The army will see your party as the guerrillas in disguise."},{"id":"s4_disarm","name":"Disarm and become a party","detail":"Hand in the weapons and compete for votes like any other party. The army loses its main argument against your party, and your members' safety rests on the government.","others":{"who":"The M-19, which disarmed in 1990.","bullets":["**8 March 1990.** The M-19 handed in its weapons.","**26 April 1990.** Its leader, presidential candidate Carlos Pizarro, was killed.","**1991.** Its party, in alliance with the former EPL guerrillas, won 9 Senate and 13 House seats.","**1994.** It lost all its Senate seats and soon disappeared as a party."]}},{"id":"s4_grow","name":"Use the truce to grow, stay out of politics","detail":"Keep the ceasefire but send nobody into elections. Recruit and build new fronts while the army holds back. You risk nothing in politics, and you give up the chance to win support by votes.","others":{"who":"The closest case: the ELN, another guerrilla group, which stayed out of the 1984 talks altogether.","bullets":["It ignored Betancur's call for peace and rebuilt under its leader Manuel Pérez.","**1990 to 1991.** It refused to disarm when the M-19 and most of the EPL did.","It is still fighting today."]}}],"why_min":12,"lock_label":"Save our call and see what happened","photos":[{"file":"media/betancur.jpg","alt":"President Belisario Betancur, 1985","credit":"President Belisario Betancur, 1985. Photo: Ronald Reagan Library, public domain.","info":"Betancur also founded a publishing house and translated the Greek poet Constantine Cavafy."}],"map":{"file":"media/map_stage4.svg","alt":"Map of Colombia for stage 4","credit":"Shaded: Meta, where the accords were signed. Map: Natural Earth, geoBoundaries, and GeoNames.","info":"La Uribe lies about 155 km south of Bogotá in a straight line."},"bullets":["**A president who wants peace.** Belisario Betancur, a Conservative elected in 1982, said the war had social causes that had to be fixed, and chose to negotiate. Under his amnesty more than 1,000 jailed guerrillas went free.","**28 March 1984: the La Uribe accords.** The FARC and the government agree to a ceasefire from 28 May 1984, checked by a national commission. The FARC promises to stop kidnapping and extortion.","**A door into politics.** Once the ceasefire holds, a 1-year trial period opens in which FARC members may organize politically, with guarantees from the government that the accords do not spell out.","**What the accords leave out.** They do not require the FARC to hand in its weapons. They do not say how its members will be protected, and no one from outside Colombia monitors them.","**The army.** Top army officers see talks with the FARC during a ceasefire as weakness and want to defeat it by force. In January 1984 Betancur forced out his defense minister, General Fernando Landazábal, for undermining the peace policy."],"reveal":{"real_pick":"s4_both","bullets":["**May 1985: a new party.** The Patriotic Union (UP) was founded out of the peace talks. The FARC kept its weapons, and kept growing, from 27 fronts in 1984 to 39 in 1987.","**The communist party agreed with this decision.** The FARC's main ally, the Communist Party, helped found the UP. Since 1961 the party had held that votes and weapons could be combined.","**1986: the first elections.** The UP won 4.5% of the vote for president, 9 of 199 House seats and 6 of 114 Senate seats (counting coalitions), and 325 town councilors (351 by the Truth Commission's count)."]},"why_label":"Why? And name the risk you accept."},{"id":"s4b","kind":"stage","kicker":"Stage 4 of 6 · 1986 to 1987","headline":"1987: The Patriotic Union under attack","receipt_title":"Stage 4, after the killings began","lede":"You lead the FARC. It is early 1987, and members of your party, the Patriotic Union, are being killed across the country, among them members of Congress and town councilors.","paragraphs":[],"question":"What does the FARC do now?","picks":[{"id":"s4b_war","name":"Pull your people out of politics and go back to war","detail":"Call your commanders back from the party to the fronts and prepare for war. Your commanders are safer, but you give up the seats won in 1986, and the party's unarmed members are left on their own."},{"id":"s4b_both","name":"Keep the party and the weapons","detail":"Stay in elections and keep your armed fronts, so neither is given up. As long as the fronts stay armed, every party member stays a target."},{"id":"s4b_break","name":"Break with armed struggle to protect the party","detail":"Say in public that the party has nothing to do with the guerrillas, and ask the state to protect its members. The party may survive, if the killers believe you.","others":{"who":"The Patriotic Union's own leaders, who broke with the FARC.","bullets":["**By 1988.** The party had declared itself separate from the FARC. The army and the government kept calling it part of the guerrilla.","**11 October 1987.** The UP's president, Jaime Pardo Leal, was killed. **22 March 1990.** His successor as UP president, Bernardo Jaramillo, was killed.","**1990.** In the congressional elections, the UP won just 1 Senate seat and 1 House seat on its own lists, plus 6 Senate seats and 1 House seat on joint lists with other parties.","The Truth Commission counts 5,733 people tied to the party killed or disappeared, 5,195 of them members."]}},{"id":"s4b_deal","name":"Disarm in exchange for guarantees","detail":"Offer to hand in your weapons if the state commits to protect your members and your party. You would be trusting a state whose soldiers and police are among the likely killers.","others":{"who":"The M-19, which disarmed in 1990 under its own deal.","bullets":["**8 March 1990.** The M-19 handed in its weapons.","**26 April 1990.** Its leader, presidential candidate Carlos Pizarro, was shot on a plane by a hitman. Courts later convicted the paramilitary leaders Carlos and Fidel Castaño (2002) and a state security agent on his bodyguard team (2025).","It never went back to war. Its party won seats in the 1991 constitutional assembly and in Congress."]}}],"why_min":12,"reveal":{"real_pick":"s4b_war","bullets":["**February 1987.** The FARC pulled out of the Patriotic Union and called its members back to the fronts.","**June 1987.** The truce broke down. The memory center ties the break to the systematic killing of UP members.","**The next screen** shows what happened to the party."]},"continue_label":"See the full record","bullets":["**Who is killing them, and why.** The killers are rarely caught. Colombia's National Center for Historical Memory later named paramilitaries as the likely killers in most cases where one is known, and soldiers and police in about a quarter. The Truth Commission describes local networks of army units, politicians, ranchers, and drug traffickers that wanted to stop the UP from governing the towns where it had won elections.","**How the army sees your party.** Most army officers see the UP as the FARC in politics, not as a separate party. In 1986 the former defense minister, General Fernando Landazábal, called it a front for the guerrillas. The Truth Commission writes that for these officers, attacking the UP meant attacking the FARC.","**What leaving politics would cost.** The seats won in 1986: 9 in the House, 6 in the Senate (counting coalitions), and 325 town councilors."],"why_label":"Why? And name the risk you accept.","photos":[{"file":"media/pardo_leal.jpg","alt":"Jaime Pardo Leal","credit":"Jaime Pardo Leal, the UP's president and its 1986 presidential candidate. Photo: Lidio.m32, CC BY-SA 3.0."}]},{"id":"r4","kind":"record","stage":"s4","real_pick":"s4_both","kicker":"Stage 4 of 6 · the full record","headline":"The Patriotic Union, 1985 to 1991","bullets":["**The party leaders chose votes.** Jaime Pardo Leal, the UP's president and 1986 presidential candidate, September 1987: 'At this moment armed struggle is not the correct path.' Bernardo Jaramillo, its next president: 'We do not need weapons to win votes.'","**Leaders killed.** Pardo Leal on 11 October 1987, Jaramillo on 22 March 1990. Jaramillo was its 1990 presidential candidate. The UP then pulled out of that race, saying it had no protection.","**By whom.** For 1984 to 1988 the memory center names paramilitaries as the likely killers in 60.8% of cases, state agents in 25.9%, and both together in 6.8%.","**How many.** Counts differ. The memory center counts 4,153 UP members killed, disappeared, or kidnapped from the 1984 accords to 2002. The Truth Commission counts 5,195 members killed or disappeared. The Inter-American Court of Human Rights counts more than 6,000 victims, including survivors of threats and torture, and called it an extermination.","**The M-19 disarms.** Its 1990 deal gave a pardon and the right to do politics, and the government and the M-19 promised to back special seats in Congress, for one election only, for parties of disarmed guerrillas. It disarmed on 8 March 1990. On 26 April a hired gunman shot its leader and presidential candidate, Carlos Pizarro, on a plane. The paramilitary leader Carlos Castaño admitted training the gunman and planning the killing, and prosecutors are investigating former officials of the state security agency for weakening Pizarro's protection.","**The M-19 after Pizarro's death.** The M-19 stayed in the deal. Its leader Antonio Navarro later said the Medellín drug cartel was killing presidential candidates, and asked: 'What did we do? Keep our word.' On 9 December 1990 its party won 19 of 70 seats in the assembly that wrote the 1991 Constitution. The UP won 2. The same day, the army bombed Casa Verde, the FARC's headquarters.","**The EPL.** The EPL also disarmed in 1991 and got seats in that assembly. Its party, Esperanza, Paz y Libertad, lost 110 members to targeted killings in the years that followed."],"paragraphs":["In the Truth Commission's words, the FARC then gave up on winning office openly and put its army first."],"class_link":{"title":"How this connects to the course","text":["**Commitment problem.** The 1984 accords did not require the FARC to disarm, did not say how its members would be protected, and had no monitor from outside Colombia. Thousands of UP members were then killed or disappeared (above), and in February 1987 the FARC called its members back to the fronts. Through the truce the FARC also kept growing, from 27 fronts in 1984 to 39 in 1987.","**Indivisible stakes.** Power in Congress and in the towns: in 1986 the UP won 9 of 199 House seats, 6 of 114 Senate seats (counting coalitions), and 325 town councilors, and local networks of army units, politicians, ranchers, and drug traffickers then tried to stop it from governing the towns it had won.","**Discuss:** the M-19 disarmed, lost its candidate, and stayed in its deal. Did it solve the commitment problem, or just accept the risk?"],"reading":"La Uribe accords (1984). National Center for Historical Memory, Todo pasó frente a nuestros ojos (2018), pp. 44, 58, 62 to 63, and 67. Truth Commission, La esperanza acorralada (2022). Fundación Ideas para la Paz, Hoy y ayer del Bloque Oriental de las FARC (2015).","tag_question":"The FARC kept its weapons through the 1984 truce, and the truce collapsed in 1987. Which explanation of why peace fails fits this best? Pick one, then argue it out.","tag_options":["Commitment problem","Indivisible stakes","Something else"]},"photos":[{"file":"media/jaramillo_ossa.jpg","alt":"Bernardo Jaramillo Ossa","credit":"Bernardo Jaramillo Ossa. Photo: Lidio.m32, CC BY-SA 3.0."},{"file":"media/pardo_leal_mural.jpg","alt":"Mural honoring Jaime Pardo Leal at the University of Antioquia, Medellín","credit":"A mural honoring Jaime Pardo Leal at the University of Antioquia, Medellín, 2025. Photo: CC0."}],"show_call":false},{"id":"s5","kind":"stage","kicker":"Stage 5 of 6 · 1993 to 2016","headline":"1998: Pastrana's demilitarized zone","receipt_title":"Stage 5, the 1998 zone","lede":"You lead the FARC. It is November 1998, the FARC is near its peak, and the new president, Andrés Pastrana, offers it a zone of its own for peace talks.","paragraphs":[],"panels":[],"tiles":[{"value":"More than 10,000","label":"FARC fighters in the 1990s, by one estimate","source":"IC1"}],"question":"What do you do with the zone?","picks":[{"id":"s5_negotiate","name":"Negotiate a settlement","detail":"Use the talks to win land reform and a place in politics while your forces are at their largest. A deal means giving up the army that won you this offer.","others":{"who":"The closest case: the paramilitary AUC, the FARC's enemy, which negotiated with President Uribe.","bullets":["**July 2003.** It agreed to demobilize. The Justice and Peace Law of 2005 later offered reduced sentences to members who confessed to major crimes.","**April 2006.** More than 31,000 members had demobilized and handed in more than 17,000 weapons.","**13 May 2008.** Colombia extradited 14 people to the US, among them top paramilitary commanders.","Many former paramilitaries joined new criminal groups. By 2013 the Urabeños were the strongest of them."]}},{"id":"s5_grow","name":"Talk, but use the zone to grow","detail":"Train, recruit, and hold prisoners there while the talks go on. You get stronger, but if the country sees the zone used for war, the next government may fight you harder."},{"id":"s5_refuse","name":"Refuse the zone","detail":"Talks have failed before. Keep fighting everywhere and give the president nothing to show. You avoid a trap, and you lose a safe base the size of Switzerland.","others":{"who":"No guerrilla group turned down a zone. The closest case is the ELN, whose own talks failed and which never got a zone.","bullets":["**1998.** Its own peace talks failed.","**2000.** It asked for a zone in southern Bolívar. The paramilitary leader Carlos Castaño opposed it, and the plan failed. The ELN is still fighting."]}}],"why_min":12,"reveal":{"real_pick":"s5_grow","bullets":["**1999 to 2002: talking and fighting.** Marulanda did not come, and Pastrana opened the talks on 7 January 1999 next to his empty chair. The FARC said paramilitaries planned to kill Marulanda there. Both sides kept fighting, and the memory center says the war reached its greatest intensity. A US Congressional Research Service report says the FARC was widely seen as using the zone to regroup and rearm.","**February 2002: the end of the zone.** After the FARC hijacked a plane and kidnapped a senator on board, Pastrana ended the talks and the zone on 20 February. Three days later the FARC kidnapped presidential candidate Íngrid Betancourt.","**2002 to 2010: all-out war.** President Álvaro Uribe fought the FARC with US aid from Plan Colombia, for which the US Congress had approved $1.3 billion in 2000. Kills became the army's measure of success.","**Losses.** In March 2008 the military killed second-in-command Raúl Reyes in Ecuador, and Marulanda died of a heart attack. In November 2011 it killed his successor, Alfonso Cano. Fighters fell from between 16,000 and 28,000 around 2002 to between 7,000 and 9,000 by 2012.","**2012 to 2016: a deal in Havana.** The FARC, led by Rodrigo Londoño, known as Timochenko, negotiated with President Juan Manuel Santos, Uribe's former defense minister. They signed on 26 September 2016.","**What the deal promised.** At least 5 Senate and 5 House seats for 2 terms, whatever the vote. 90% of the minimum wage for 24 months for each former fighter without a paid job. A security body, run joi
